      - tests/tms_test.rs
      - CHANGELOG.md:1.21.4
    local_verification: pending
feature_families:
  - id: core-grl
    status: verified_upstream
    evidence: [README.md, docs/core-features/GRL_SYNTAX.md, examples/01-getting-started/grule_demo.rs]
    summary: GRL parsing, rule loading, conditions, actions, facts, and expressions.
  - id: rete
    status: verified_upstream
    evidence: [README.md, docs/core-features/FEATURES.md, examples/02-rete-engine/rete_grl_demo.rs]
    summary: Upstream RETE/RETE-UL execution, alpha/beta indexing, incremental facts, and parallel execution. This is upstream evidence only, not local parity.
  - id: backward-chaining
    status: verified_upstream
    required_feature: backward-chaining
    evidence: [README.md, examples/09-backward-chaining/simple_query_demo.rs]
    summary: Goal-driven queries, unification, search strategies, aggregation, negation, and proof traces.
  - id: streaming
    status: verified_upstream
    required_feature: streaming
    evidence: [README.md, CHANGELOG.md:1.21.0, examples/03-advanced-features/streaming_with_rules_demo.rs]
    summary: Stream patterns, sliding/tumbling/session windows, correlation, and TimeWindow.record().
  - id: streaming-redis
    status: verified_upstream
    required_feature: streaming-redis
    evidence: [Cargo.toml, docs/advanced-features/REDIS_STATE_BACKEND.md]
    summary: Upstream Redis-backed streaming state. Locally the native adapter is an optional backend compiled only when RULE_ENGINE_ENABLE_REDIS is ON and CMake discovers hiredis; without the client the Redis kind stays RE_STATUS_NOT_SUPPORTED, and the adapter is compile-verified only on the current host.
  - id: advanced-rule-control
    status: verified_upstream
    evidence: [docs/core-features/FEATURES.md, docs/core-features/GRL_SYNTAX.md]
    summary: Salience, no-loop, agenda groups, activation groups, date bounds, modules, and accumulators.
  - id: v1.21.4-fix
    status: verified_upstream
    evidence: [CHANGELOG.md:1.21.4, README.md]
    summary: Dotted field references in actions resolve to their actual value rather than a literal path.
local_implementation_status: partial
parity_statement: This file records upstream evidence and the inventory baseline; it does not establish local implementation or full parity. Local classifications are authoritative only when backed by an implementation reference and an executed local test reference.
classification_vocabulary:
  implemented: local code exists, but parity still requires the named conformance test
  tested: local behavior is executed by the named test and is equivalent or exact as stated
  pending: scoped for parity, but local evidence is incomplete
  unsupported: local implementation intentionally does not provide the upstream behavior
  optional_backend: available only through a separately enabled local backend
  blocked: verification or implementation is blocked by an unavailable dependency/service
  exact_parity: observable semantics and contract match the upstream slice
  equivalent_behavior: observable outcome is preserved through a different C99 implementation or narrower boundary
  bounded_behavior: deliberately narrower than upstream and must never be labeled exact_parity
inventory:
  public_modules:
    - id: lib
      upstream_ref: src/lib.rs
      local_status: implemented
      local_ref: engine/src/rule_engine/rule_engine.h
      local_tests: [engine/tests/rule_engine_c99_consumer.c]
      parity: equivalent_behavior
      notes: C99 opaque ABI replaces Rust module exports; declarations alone are not capability evidence.
    - id: engine
      upstream_ref: src/engine/
      local_status: tested
      local_ref: engine/src/rule_engine/engine.c
      local_tests: [engine/tests/test_rule_engine.c]
      parity: equivalent_behavior
      notes: Forward execution, assignment, callback, limits, cancellation, and transactional install are covered; plugin actions and full Rust engine APIs are not.
    - id: errors
      upstream_ref: src/errors.rs
      local_status: tested
      local_ref: engine/src/rule_engine/rule_engine.h
      local_tests: [engine/tests/test_rule_engine.c, engine/tests/rule_engine_fuzz_smoke.c]
      parity: equivalent_behavior
      notes: Direct re_status_t ABI replaces the upstream typed Rust error enum.
    - id: expression
      upstream_ref: src/expression.rs
      local_status: tested
      local_ref: [engine/src/rule_engine/parser.c, engine/src/rule_engine/engine.c, engine/src/rule_engine/ir_eval.c, engine/src/rule_engine/builtins.c]
      local_tests: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_grl_surface.c]
      parity: bounded_behavior
      notes: 'Local parser/evaluator covers the tested expression subset plus the sub-project A surface - word operator aliases (eq/ne/gt/gte/lt/lte/not_contains), case-insensitive bool/null literals, % modulo, string + concatenation, D4 comparison alignment (strict typed equality, to_number relational coercion), general !(...)/exists(...)/forall(...) quantifiers with the prefix-heuristic candidate rule, the condition and utility built-in families, multifield array predicates, the accumulate CE, test(f(...)), and the $x: Type(conds) typed form. Bounded then-action $Fact.method(...) calls (set/get/reset/update conventions with registered-function fallback) are verified local parity. Documented divergences - D1 short-circuit compound evaluation, D2 no receiver-aware condition method dispatch, the exists(/typed/accumulate disambiguation bounds, and the skipped upstream-only aliases (maximum/minimum, ceiling, absolute, begins_with/ends_with, tolower/toupper, strip, update/refresh).'
    - id: parser
      upstream_ref: src/parser/
      local_status: tested
      local_ref: engine/src/rule_engine/parser.c
      local_tests: [engine/tests/test_rule_engine.c, engine/tests/rule_engine_fuzz_smoke.c]
      parity: bounded_behavior
      notes: Named rules, conjunctions, salience, selected controls, references, and bounded modules are tested; full GRL syntax is pending.
    - id: plugins
      upstream_ref: src/plugins/
      local_status: pending
      local_ref: engine/src/rule_engine/extensions.c
      local_tests: [engine/tests/test_rule_engine.c]
      parity: equivalent_behavior
      notes: Custom-function callback boundary is tested; upstream built-in plugin suite is not locally present.
    - id: rete
      upstream_ref: src/rete/
      local_status: tested
      local_ref: [engine/src/rule_engine/rete.c, engine/src/rule_engine/agenda.c, engine/src/rule_engine/engine.c, engine/src/rule_engine/tms.c, engine/src/rule_engine/parser.c]
      local_tests: [engine/tests/test_rule_engine_rete_incremental.c, engine/tests/test_rule_engine_agenda.c, engine/tests/test_rule_engine_tms.c]
      parity: bounded_behavior
      notes: 'Local private RETE is one bounded network per eligible rule (up to eight ANDed fact-vs-literal comparisons, chained on the facts store without cross-rule alpha sharing) plus a persistent agenda with value-fingerprint refraction and pop-time revalidation. Sub-project B delivered TMS parity at the upstream src/rete/tms.rs + tests/tms_test.rs slice (the 12 upstream test semantics are ported: explicit support unconditionally valid via a premise-less marker justification, explicit/logical coexistence on one fact, multi-justification survival, cascade and diamond retraction, no re-derivation on a new justification; insertion-time cycle rejection is a stricter local bound) and the src/rete/agenda.rs AdvancedAgenda focus stack (push on ActivateAgendaGroup, pop on focus-group exhaustion, bounded 32) with the auto-focus attribute switching focus on a genuinely new activation push. Vapor finding (source-level research at tag f80a541, recorded in docs/superpowers/specs/2026-08-29-rule-engine-full-parity-design.md Sub-project B): upstream has no real cross-rule RETE network - no shared alpha memories or beta tokens in any execution path, "RETE-UL" is a per-rule boolean expression tree, and the named BetaNode/TokenPool/NodeSharing utilities are unused by any engine - so per the evidence rule it is documented, not replicated.'
    - id: types
      upstream_ref: src/types.rs
      local_status: tested
      local_ref: engine/src/rule_engine/rule_engine.h
      local_tests: [engine/tests/rule_engine_c99_consumer.c, engine/tests/test_rule_engine.c]
      parity: equivalent_behavior
      notes: C99 tagged values cover the tested scalar/null/unknown subset; Rust type and coercion surface is not identical.
    - id: backward
      upstream_ref: src/backward/
      local_status: tested
      local_ref: [engine/src/rule_engine/backward.c, engine/src/rule_engine/proof_graph.c]
      local_tests: [engine/tests/test_rule_engine_backward.c, engine/tests/test_rule_engine_backward_bindings.c, engine/tests/test_rule_engine_backward_ext.c]
      parity: bounded_behavior
      notes: Bounded goal recursion and bindings are tested, plus query-level NOT (negation-as-failure, closed-world, no stratification - upstream also restricts NOT to a goal prefix), query aggregation over an internal bounded query (COUNT/SUM/AVERAGE/MIN/MAX/FIRST/LAST with int64-preserving SUM/MIN/MAX matching the upstream aggregation type rules), and selectable search strategies whose BFS/ITERATIVE share an iterative-deepening wrapper - upstream ITERATIVE is likewise DFS probes at rising depth caps, while upstream BFS is a separate queue-based search that is not modeled. The bounded 64-entry shared proof graph now carries the upstream src/backward/proof_graph.rs graph shape (premise capture with typed value fingerprints, per-premise invalidation over a generation fast path, informational node records, struct_size-versioned stats_v2, lazy dependent propagation instead of upstream's eager invalidate_handle). Bounded ?var unification per the src/backward/unification.rs case table is tested (sticky-consistent branch failure, no occurs check, no deferral, scalar/array typed equality, one-directional aliases without union-find); upstream's own Unifier is never called by its search and its integrated proof-graph caching is dead (fresh graph per query plus an insert/lookup key mismatch) - vapor findings recorded in docs/superpowers/specs/2026-08-29-rule-engine-full-parity-design.md Sub-project B, so the semantics are mapped onto the local machine rather than ported as modules. Arbitrary predicate unification and the upstream shared-subgraph provenance graph remain absent.
    - id: streaming
      upstream_ref: src/streaming/
      local_status: tested
      local_ref: [engine/src/rule_engine/tumbling_session.c, engine/src/rule_engine/stream_correlation.c]
      local_tests: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_stream_ext.c, engine/tests/rule_engine_fuzz_smoke.c]
      parity: bounded_behavior
      notes: Window/correlation/provider slices are tested, including window aggregates count/sum/average plus the appended min/max/first/last kinds (struct_size-gated result fields, window-owned first/last borrows); full streaming patterns and watermark-integrated runtime remain absent.
  cargo_features:
    - id: default
      upstream_ref: Cargo.toml:[features].default
      local_status: tested
      local_ref: engine/CMakeLists.txt:704-742
      local_tests: [engine/tests/test_rule_engine.c]
      parity: equivalent_behavior
    - id: streaming
      upstream_ref: Cargo.toml:[features].streaming
      local_status: tested
      local_ref: [engine/src/rule_engine/extensions.c, engine/src/rule_engine/stream_correlation.c]
      local_tests: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_stream_ext.c, engine/tests/rule_engine_fuzz_smoke.c]
      parity: bounded_behavior
      notes: Window aggregate kinds now include min/max/first/last appended under struct_size gating, matching the window-ops surface used by upstream's streaming feature at bounded scope.
    - id: streaming-redis
      upstream_ref: Cargo.toml:[features].streaming-redis
      local_status: optional_backend
      local_ref: [engine/CMakeLists.txt:721-736, engine/src/rule_engine/redis_provider.c]
      local_tests: [engine/tests/test_rule_engine_stream_ext.c]
      parity: bounded_behavior
      notes: Native adapter mirrors the in-memory provider vtable over the sync hiredis API - the same synchronous style as upstream's redis-crate usage - with "<prefix>:<name>" keys, raw-byte values, and PSETEX/SET/GET/DEL/PTTL; it compiles only when RULE_ENGINE_ENABLE_REDIS is ON and hiredis is discovered (a missing client force-disables the option, no silent fallback), and without the macro the Redis kind stays RE_STATUS_NOT_SUPPORTED. Compile-verified only on the current host; the runtime roundtrip is RE_TEST_REDIS_URL skip-guarded.
    - id: backward-chaining
      upstream_ref: Cargo.toml:[features].backward-chaining
      local_status: tested
      local_ref: [engine/src/rule_engine/backward.c, engine/src/rule_engine/proof_graph.c]
      local_tests: [engine/tests/test_rule_engine_backward.c, engine/tests/test_rule_engine_backward_bindings.c, engine/tests/test_rule_engine_backward_ext.c]
      parity: bounded_behavior
    - id: all-features
      upstream_ref: Cargo.toml:package.metadata.docs.rs:all-features
      local_status: pending
      local_ref: engine/CMakeLists.txt:704-742
      local_tests: []
      parity: unsupported
      notes: There is no local single switch equivalent to upstream all-features.
  syntax_families:
    - {id: rule-structure-and-actions, upstream_refs: [docs/core-features/GRL_SYNTAX.md, src/parser/grl.rs], local_status: tested, local_refs: [engine/src/rule_engine/parser.c, engine/src/rule_engine/engine.c, engine/src/rule_engine/builtins.c], local_tests: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_grl_surface.c], parity: bounded_behavior, notes: Named rules, conjunctions, salience, selected controls, references, bounded modules, and the whitelisted bare action built-ins (retract/log/ActivateAgendaGroup plus the D5 workflow-trio registered dispatch) are tested; the enabled attribute, comment syntax, object literals, and index syntax are upstream-absent parse errors (sweep locked in test_rule_engine_grl_surface.c).}
    - {id: comparisons-and-boolean-logic, upstream_refs: [docs/core-features/GRL_SYNTAX.md, src/types.rs], local_status: tested, local_refs: [engine/src/rule_engine/parser.c, engine/src/rule_engine/engine.c, engine/src/rule_engine/ir_eval.c], local_tests: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_grl_surface.c], parity: bounded_behavior, notes: D4-aligned - equality strictly typed (Integer(1) != Number(1.0)), relational operators coerce via to_number (numeric strings coerce; bool/null/array/object make the comparison false); word aliases and general parenthesized !(expr) negation covered; D1 short-circuit is a documented divergence (upstream evaluates both sides).}
    - {id: arithmetic-and-variable-references, upstream_refs: [docs/core-features/GRL_SYNTAX.md, src/expression.rs], local_status: tested, local_refs: [engine/src/rule_engine/parser.c, engine/src/rule_engine/ir_eval.c], local_tests: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_grl_surface.c], parity: bounded_behavior, notes: Precedence, integer/double arithmetic, malformed expressions, division by zero, checked integer overflow, the % modulo (f64-based; Integer-typed result only when both operands are Integer and the result is integral), and string + concatenation are covered; object literals and index syntax are upstream-absent parse errors.}
    - {id: exists-not-forall, upstream_refs: [docs/core-features/FEATURES.md, src/rete/pattern.rs, src/rete/pattern_matcher.rs], local_status: tested, local_refs: [engine/src/rule_engine/parser.c, engine/src/rule_engine/ir_eval.c], local_tests: [engine/tests/test_rule_engine_ir.c, engine/tests/test_rule_engine_forall_limits.c, engine/tests/test_rule_engine_grl_surface.c, engine/tests/test_rule_engine_backward_ext.c], parity: bounded_behavior, notes: General parenthesized !/exists/forall with arbitrary inner boolean expressions, the D7 fact-name-prefix candidate heuristic with per-candidate rebinding and NOT_FOUND absorption, and vacuous-true forall (D6) are tested; linear evaluation only (never RETE nodes), and backward chaining rejects such rules with RE_STATUS_NOT_SUPPORTED.}
    - {id: arrays-multifield-and-in, upstream_refs: [docs/core-features/GRL_SYNTAX.md, src/types.rs, CHANGELOG.md:1.19.0, src/rete/multifield.rs], local_status: tested, local_refs: [engine/src/rule_engine/parser.c, engine/src/rule_engine/ir_eval.c, engine/src/rule_engine/values.c], local_tests: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_ir.c, engine/tests/test_rule_engine_grl_surface.c], parity: bounded_behavior, notes: Non-empty literal arrays and structured arrays containing scalar members support typed membership; literal arrays are capped at 64 elements. Multifield count/first/last/empty/not_empty/notEmpty/collect array-shape predicates are tested (upstream's GRL parser exposes exactly these spellings; index/slice exist only in upstream's RETE multifield Rust API and are a local parse error).}
    - {id: modules-import-export, upstream_refs: [docs/core-features/GRL_SYNTAX.md, src/rete/mod.rs], local_status: tested, local_refs: [engine/src/rule_engine/advanced.c], local_tests: [engine/tests/test_rule_engine.c], parity: bounded_behavior}
    - {id: stream-patterns-windows-and-correlation, upstream_refs: [docs/advanced-features/STREAMING.md, src/streaming/], local_status: tested, local_refs: [engine/src/rule_engine/tumbling_session.c, engine/src/rule_engine/stream_correlation.c], local_tests: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_stream_ext.c], parity: bounded_behavior, notes: Window aggregates cover count/sum/average plus appended min/max/first/last under struct_size gating; general stream patterns joins and watermarks remain absent.}
    - {id: backward-queries-unification-negation-aggregation, upstream_refs: [docs/api-reference/GRL_QUERY_SYNTAX.md, src/backward/, src/parser/grl_query.rs], local_status: tested, local_refs: [engine/src/rule_engine/backward.c, engine/src/rule_engine/proof_graph.c, engine/src/rule_engine/query_exec.c, engine/src/rule_engine/parser.c], local_tests: [engine/tests/test_rule_engine_backward.c, engine/tests/test_rule_engine_backward_ext.c, engine/tests/test_rule_engine_query_blocks.c], parity: bounded_behavior, notes: 'Prefix NOT negation-as-failure, bounded query aggregation (seven kinds, int64-preserving SUM/MIN/MAX), DFS/BFS/iterative-deepening strategy selection, a bounded shared proof graph result cache, and the GRL query "Name" block surface (goal/strategy/max-depth/max-solutions/enable-memoization/enable-optimization/when/on-success/on-failure/on-missing; textual &&/|| goal splitting, direct != evaluation, hard errors propagating without action dispatch, on-missing folded into on-failure) are tested; bounded ?var unification per the upstream case table (sticky-consistent, no occurs check, one-directional aliases) is also tested; arbitrary predicate unification, the upstream WHERE surface, and upstream shared-subgraph provenance remain unsupported.'}
  runtime_contracts:
    - {id: ownership-and-lifetimes, upstream_refs: [src/engine/, src/rete/, src/backward/], local_status: tested, local_refs: [engine/src/rule_engine/allocator.c, engine/src/rule_engine/facts.c, engine/src/rule_engine/query.c], local_tests: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_backward_bindings.c], parity: equivalent_behavior}
    - {id: errors-limits-cancellation, upstream_refs: [src/errors.rs, src/engine/], local_status: tested, local_refs: [engine/src/rule_engine/engine.c], local_tests: [engine/tests/test_rule_engine.c, engine/tests/rule_engine_fuzz_smoke.c], parity: equivalent_behavior}
    - {id: concurrency-and-thread-safety, upstream_refs: [src/rete/, src/backward/, tests/backward_thread_safety.rs], local_status: optional_backend, local_refs: [engine/src/rule_engine/executor.c], local_tests: [engine/tests/test_rule_engine_executor_stress.c, engine/tests/test_rule_engine_stream_ext.c], parity: bounded_behavior, notes: The threading contract is documented above re_engine_create - single-threaded handles; conflicting mutation during a run returns RE_STATUS_BUSY; action-callback fact writes stage into the firing transaction; allocator callbacks must not re-enter in-flight handles; the C11 executor evaluates read-only conditions in workers - and the busy semantics are test-locked by the executor-stress busy-boundary phase and the stream_ext guard tests.}
    - {id: transactions-and-fact-lifecycle, upstream_refs: [src/rete/facts.rs, src/rete/tms.rs, tests/tms_test.rs], local_status: tested, local_refs: [engine/src/rule_engine/transactions.c, engine/src/rule_engine/facts.c], local_tests: [engine/tests/test_rule_engine_transactions.c, engine/tests/test_rule_engine_rete_incremental.c], parity: equivalent_behavior}
    - {id: canonical-ir, upstream_refs: [src/rete/network.rs, RETE_ARCHITECTURE.md], local_status: implemented, local_refs: [engine/src/rule_engine/ir.h, engine/src/rule_engine/ir.c, engine/src/rule_engine/ir_validate.c, engine/src/rule_engine/ir_eval.c], local_tests: [engine/tests/test_rule_engine_ir.c], parity: bounded_behavior, notes: Private immutable IR covers the tested rule, expression, term, action, module, bounded source-envelope span, validation, and forward-evaluation boundary; it is not an upstream-compatible internal representation.}
    - {id: rete-ul-tms-persistent-agenda, upstream_refs: [src/rete/network.rs, src/rete/tms.rs, src/rete/agenda.rs], local_status: tested, local_refs: [engine/src/rule_engine/rete.c, engine/src/rule_engine/agenda.c, engine/src/rule_engine/engine.c, engine/src/rule_engine/tms.c, engine/src/rule_engine/parser.c], local_tests: [engine/tests/test_rule_engine_rete_incremental.c, engine/tests/test_rule_engine_agenda.c, engine/tests/test_rule_engine_tms.c], parity: bounded_behavior, notes: Bounded persistent agenda with value-fingerprint refraction and pop-time revalidation plus per-rule private networks are tested; sub-project B added TMS parity at the upstream tms.rs/tms_test.rs slice (explicit/logical coexistence via the premise-less explicit-support marker) and the AdvancedAgenda focus stack with auto-focus (push on ActivateAgendaGroup; pop on focus-group exhaustion; bounded 32). Full RETE-UL is upstream vapor (no shared alpha/beta machinery in any execution path - see the rete module row) and general multi-rule producer inference remains intentionally unsupported.}
    - {id: backward-arbitrary-unification-and-proof-sharing, upstream_refs: [src/backward/unification.rs, src/backward/proof_graph.rs], local_status: tested, local_refs: [engine/src/rule_engine/backward.c, engine/src/rule_engine/proof_graph.c], local_tests: [engine/tests/test_rule_engine_backward_bindings.c, engine/tests/test_rule_engine_backward_ext.c], parity: bounded_behavior, notes: "The proof-sharing half is a bounded local result cache (64 entries; clear-all eviction; final results only; pointer-identity keying with a documented ABA residual) upgraded to the upstream graph shape - premise capture with typed value fingerprints; per-premise invalidation over a generation fast path; informational node records; stats_v2; and lazy dependent propagation (semantically equivalent to upstream's eager invalidate_handle for a cache). The unification half is bounded ?var unification per the upstream case table (sticky-consistent branch failure; no occurs check; no deferral; scalar/array typed equality; one-directional aliases without union-find); upstream's own Unifier is dead code (never called by its search engine) so the case table is mapped at the local binding points. Arbitrary predicate unification and the upstream shared-subgraph producer-provenance graph remain absent locally."}
    - {id: full-streaming-patterns, upstream_refs: [src/rete/stream_alpha_node.rs, src/streaming/operators.rs, src/streaming/watermark.rs], local_status: unsupported, local_refs: [engine/src/rule_engine/extensions.c], local_tests: [engine/tests/rule_engine_fuzz_smoke.c], parity: bounded_behavior, notes: Full streaming patterns are absent locally.}
  test_families:
    upstream_declared_count: 436
    upstream_refs: [tests/grl_cases.yml, tests/grl_harness.rs, tests/backward_comprehensive_tests.rs, tests/proof_graph_integration_test.rs, tests/test_module_system.rs, tests/tms_test.rs, tests/backward_thread_safety.rs]
