  tag: v1.21.4
  commit: f80a5419847436f8095be6a9953c69b38a6ae052
  observed_on: 2026-08-24
  package_version: 1.21.4
  release_date: 2026-08-13
  tag_commit_match: true
  release_tag_discrepancy: "The requested tag and commit match, but GitHub has no Release object for v1.21.4; the crates.io package is version 1.21.4 and the tag/release date precedes this observation date."
  license: MIT
  license_source: https://raw.githubusercontent.com/KSD-CO/rust-rule-engine/f80a5419847436f8095be6a9953c69b38a6ae052/LICENSE
  primary_sources:
    - path: Cargo.toml
      url: https://github.com/KSD-CO/rust-rule-engine/blob/f80a5419847436f8095be6a9953c69b38a6ae052/Cargo.toml
    - path: README.md
      url: https://github.com/KSD-CO/rust-rule-engine/blob/f80a5419847436f8095be6a9953c69b38a6ae052/README.md
    - path: CHANGELOG.md
      url: https://github.com/KSD-CO/rust-rule-engine/blob/f80a5419847436f8095be6a9953c69b38a6ae052/CHANGELOG.md
    - path: docs/core-features/FEATURES.md
      url: https://github.com/KSD-CO/rust-rule-engine/blob/f80a5419847436f8095be6a9953c69b38a6ae052/docs/core-features/FEATURES.md
    - path: docs/core-features/GRL_SYNTAX.md
      url: https://github.com/KSD-CO/rust-rule-engine/blob/f80a5419847436f8095be6a9953c69b38a6ae052/docs/core-features/GRL_SYNTAX.md
    - path: LICENSE
      url: https://github.com/KSD-CO/rust-rule-engine/blob/f80a5419847436f8095be6a9953c69b38a6ae052/LICENSE
  upstream_test_evidence:
    declared_in_readme: "436 tests passing (release notes also report historical counts for earlier releases)."
    references:
      - tests/grl_cases.yml
      - tests/grl_harness.rs
      - tests/backward_comprehensive_tests.rs
      - tests/proof_graph_integration_test.rs
