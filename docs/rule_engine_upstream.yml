    parity: unsupported
    names: [grule_demo, fraud_detection, expression_demo, method_calls_demo, in_operator_demo, string_methods_demo, rete_demo, rete_grl_demo, rete_typed_facts_demo, rete_deffacts_demo, tms_demo, accumulate_grl_demo, conflict_resolution_demo, grl_no_loop_demo, action_handlers_grl_demo, rule_templates_demo, streaming_with_rules_demo, quick_engine_comparison, parallel_engine_demo, memory_usage_comparison, rete_p3_incremental, rete_ul_drools_style, simple_query_demo, ecommerce_approval_demo, medical_diagnosis_demo, grl_query_demo, proof_graph_cache_demo, smart_home_modules, phase3_demo]
    notes: Upstream example inventory is complete from the pinned Cargo manifest; no local Rust examples exist. rete_deffacts_demo and rule_templates_demo are covered with equivalent_behavior through the local deffacts GRL extension plus re_engine_load_deffacts/re_engine_reset_with_deffacts and the instantiate-to-text rule template API; every other example remains unpromoted.
