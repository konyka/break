  - id: private-rete-bounded-conjunction
    family: rete
    requirement: optional
    syntax: 'bounded runtime seam: up to eight ANDed fact-vs-literal comparisons per rule'
    expected_behavior: Maintain bounded deterministic incremental alpha/beta/token memories for up to eight fact-vs-literal comparisons joined by conjunction, one private network per eligible rule chained on the facts store without cross-rule alpha sharing; remove stale activations on lifecycle events and expose only fact-id/rule-name provenance; unsupported boolean forms use the linear evaluator with read-set-keyed zero-token activations and full RETE-UL/TMS remains unclaimed.
    upstream_refs: []
    upstream_status: not_applicable
    local_status: verified_local
    implementation_ref: engine/src/rule_engine/rete.c
    test_ref: [engine/tests/test_rule_engine_rete_incremental.c, engine/tests/test_rule_engine_agenda.c]
    doc_ref: docs/Rule_Engine_Architecture.md
  - id: recognize-act-cycle
    family: rete
    requirement: optional
    syntax: 're_engine_run(engine, facts, options, callbacks);'
    expected_behavior: Loop recompute, refraction-deduped agenda push, pop-highest, and fire until the agenda empties, a limit is reached, or cancellation is requested; refraction keys combine rule, premise slots, and value fingerprints, pop-time revalidation discards stale activations without mark_fired, per-rule RETE networks chained on the facts store cover every eligible rule (up to eight ANDed fact-vs-literal comparisons), and a zero-token fallback keys activations by the condition read-set for conditions the alpha memories cannot see.
    upstream_refs: [src/engine/engine.rs, src/rete/agenda.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: [engine/src/rule_engine/engine.c, engine/src/rule_engine/agenda.c]
    test_ref: engine/tests/test_rule_engine_agenda.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: value_fingerprint_refraction; timestep_free_fired_keys; pop_time_revalidation; per_rule_networks_no_cross_rule_alpha_sharing; max_activations_tracked_cap
    note: Value fingerprints FNV-hash premise content; a collision can theoretically miss a refire, doubles hash raw bits, and NULL/UNKNOWN/NONE/structured values mix only the type tag. Fired keys persist per run (and across runs in persistent mode until a premise change), so an A->B->A value round trip within one run does not refire, and linear self-rewrite rules loop until max_firings (default 1024).
  - id: persistent-agenda-inspection
    family: rete
    requirement: optional
    syntax: 're_engine_set_agenda_persistent(engine, 1); re_agenda_peek(agenda, 0, &entry);'
    expected_behavior: Provide a lazily created engine-owned agenda whose pending count and peek (salience descending, activation sequence ascending, true generation-safe premise ids) reflect the recognize-act cycle; with persistence enabled, pending activations and fired refraction keys survive OK, LIMIT, and CANCELLED run exits until a program install resets the agenda, and re_agenda_destroy is a documented no-op for the engine-owned instance.
    upstream_refs: [src/rete/agenda.rs, docs/core-features/FEATURES.md]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_AGENDA_RETE
    implementation_ref: [engine/src/rule_engine/engine.c, engine/src/rule_engine/agenda.c, engine/src/rule_engine/extensions.c]
    test_ref: engine/tests/test_rule_engine_agenda.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: pending_and_fired_survive_run_exits; install_resets_agenda; abi_minor_3; capability_advertised_with_attached_networks
    note: re_engine_agenda takes a non-const engine because creation is lazy; re_agenda_entry_t.rule_name borrows the installed program's storage; peek is O(n^2) bounded by max_activations_tracked (zero selects the 1024 default).
  - id: advanced-rule-control
    family: advanced-rule-control
    requirement: optional
    syntax: 'salience 100; agenda-group "approval"; no-loop true;'
    expected_behavior: Provide the locally tested bounded subset of salience, no-loop, agenda and activation groups, date bounds, modules, and accumulators; persistent agenda state is covered by the persistent-agenda-inspection row, while general producer provenance and full truth maintenance are not claimed.
    upstream_refs: [docs/core-features/FEATURES.md, docs/core-features/GRL_SYNTAX.md, tests/test_module_system.rs, tests/tms_test.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_AGENDA_RETE
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
    behavior_scope: private_bounded_slices; no full upstream parity claim
  - id: backward-chaining
    family: backward-chaining
    requirement: optional
    syntax: 'engine.query("Order.AutoApproved == true", &mut facts)?;'
    expected_behavior: Prove or fail a goal and expose a proof trace using goal-driven search.
    upstream_refs: [README.md, examples/09-backward-chaining/simple_query_demo.rs, tests/backward_comprehensive_tests.rs, tests/backward_thread_safety.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_BACKWARD_PROOFS
    implementation_ref: engine/src/rule_engine/backward.c
    test_ref: [engine/tests/test_rule_engine_backward.c, engine/tests/test_rule_engine_backward_ext.c]
    doc_ref: docs/Rule_Engine_Design.md
    behavior_scope: tested bounded query seam; goal("RuleName") recursion, active-path cycle detection, max_depth, deterministic alternative-rule enumeration, copied proof traces, owned derivation-path nodes and immediate trace-parent edges (including distinct sibling and nested alternative proofs), transfer-on-query_next proof lifetime, mutation invalidation of unconsumed proofs, literal/propagated formal-actual binding, nested goal operands, and registered custom-function operands; an exact-form goal("RuleName") query string is unwrapped to the bare rule goal; query-level negation, aggregation, search strategies, and the bounded shared proof graph are covered by the dedicated rows below; arbitrary predicate unification and shared-subgraph/upstream producer provenance remain unsupported
    note: A rule literally named goal("X") collides with the exact-form query-string unwrap and is queried as rule X.
  - id: query-negation
    family: backward-chaining
    requirement: optional
    syntax: 're_engine_query(engine, facts, "NOT Order.RequiresApproval == true", &query);'
    expected_behavior: Prove a leading-NOT goal by negation-as-failure under the closed-world assumption - upstream likewise restricts NOT to a goal prefix and applies no stratification pass. A provable subgoal yields DISPROVED with zero solutions; an unprovable or disproved subgoal yields PROVED with one empty-binding proof whose trace names the full NOT goal text; a depth-limited subgoal propagates RE_QUERY_LIMIT unchanged because inverting a limited search would be unsound. Nested NOT NOT unwraps one level per recursion, the prefix is case-sensitive, and the inversion composes with the selected search strategy because it applies to the strategy-selected subgoal result.
    upstream_refs: [docs/api-reference/GRL_QUERY_SYNTAX.md, src/backward/search.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_BACKWARD_PROOFS
    implementation_ref: engine/src/rule_engine/backward.c
    test_ref: engine/tests/test_rule_engine_backward_ext.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: prefix_not_only; closed_world_negation_as_failure; no_stratification; limit_propagated_never_inverted; nested_not_recursion; case_sensitive_prefix
    note: The NOT prefix consumes no max_depth level - the subgoal re-enters the dispatcher with the caller's normalized options and max_solutions 1. An empty remainder is RE_STATUS_INVALID_ARGUMENT, and a NOT query counts the subgoal consult in the proof-graph stats (one fresh "NOT X" records two misses).
  - id: query-aggregation
    family: backward-chaining
    requirement: optional
    syntax: 're_engine_query_aggregate(engine, facts, RE_ACCUM_SUM, field, pattern, &out);'
    expected_behavior: Run the pattern (an ordinary query goal string) through an internal bounded query with max_depth 64 and max_solutions 1024, then fold the binding named field over the solutions in DFS order. Kinds are COUNT, SUM, AVERAGE, MIN, MAX plus the appended FIRST/LAST. Result typing matches the upstream aggregation rules - COUNT RE_VALUE_INT64, AVERAGE RE_VALUE_DOUBLE, SUM/MIN/MAX RE_VALUE_INT64 when every folded value was INT64 else RE_VALUE_DOUBLE - and deliberately differs from re_accumulator_evaluate's always-DOUBLE, as the header comment notes. FIRST/LAST copy the first/last solution's binding value; a STRING result is RE_STATUS_NOT_SUPPORTED because proof string storage dies with the internal query. An empty solution set yields COUNT 0 with RE_STATUS_OK and NOT_FOUND for every other kind; a non-numeric fold input is RE_STATUS_INVALID_ARGUMENT.
    upstream_refs: [docs/api-reference/GRL_QUERY_SYNTAX.md, src/backward/aggregation.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: engine/src/rule_engine/backward.c
    test_ref: engine/tests/test_rule_engine_backward_ext.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: internal_bounded_query_max_depth_64_max_solutions_1024; seven_kinds_including_first_last; int64_preserving_sum_min_max; empty_set_count_zero_others_not_found; first_last_string_not_supported; non_numeric_fold_rejected
    note: Reaching the 1024-solution cap reports RE_STATUS_LIMIT because an exact fit cannot be told apart from a truncated set, as does a depth-limited internal search. Percentile, stddev, count-distinct, GROUP BY, and nested or multi-variable aggregation are excluded; upstream's GRL query-block/WHERE surface is not parsed. The INT64 fold accumulates with unchecked addition, so extreme sums overflow (wrap) without a status.
  - id: search-strategies
    family: backward-chaining
    requirement: optional
    syntax: 're_query_options_t options = {sizeof(options), 8u, 4u, RE_QUERY_STRATEGY_BREADTH_FIRST, 0u};'
    expected_behavior: Select RE_QUERY_STRATEGY_DEPTH_FIRST (default), BREADTH_FIRST, or ITERATIVE per query through the appended strategy field of re_query_options_t; the struct_size versioning keeps old-size structs on DFS with sharing on and rejects sub-size structs with RE_STATUS_INVALID_ARGUMENT, and a strategy value outside [0, 2] is RE_STATUS_INVALID_ARGUMENT. BREADTH_FIRST and ITERATIVE are the same iterative-deepening wrapper over the DFS machine, re-proving with max_depth caps 1, 2, 4, ... up to the configured max_depth (default 64) so the first cap yielding at least one solution wins; backward queries execute no actions so re-probing is side-effect free, and more than 32 doublings reports RE_STATUS_LIMIT. NOT composes with the strategy because the inversion applies to the strategy-selected subgoal result.
    upstream_refs: [docs/api-reference/GRL_QUERY_SYNTAX.md, src/backward/search.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: engine/src/rule_engine/backward.c
    test_ref: engine/tests/test_rule_engine_backward_ext.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: three_strategies_append_only_enum; bfs_and_iterative_share_iterative_deepening_wrapper; doubling_caps_first_solvable_wins; side_effect_free_reprobing; not_composes_with_strategy
    note: Upstream iterative deepening is likewise DFS probes at rising depth caps, so the local wrapper matches the upstream ITERATIVE mechanism and observably selects a shallowest-depth proof; upstream breadth-first is a separate queue-based search and is not modeled. A winning capped probe reports RE_QUERY_PROVED even though deeper branches were cut - the cap is the strategy mechanism, not a search failure.
  - id: shared-proof-graph
    family: backward-chaining
    requirement: optional
    syntax: 're_engine_proof_graph_stats(engine, &hits, &misses);'
    expected_behavior: Cache final backward-query results in a lazily created engine-owned 64-entry table consulted after option normalization, keyed on the exact goal text, facts identity, normalized options (max_depth, max_solutions, strategy), and the engine config serial, and stamped with the facts mutation generation. Only PROVED and DISPROVED are stored - LIMIT and UNKNOWN are never cached; a stale entry is dropped on lookup, a full table clears every entry, served proofs are deep clones, and a served query wires the same invalidation subscription a fresh run gets. The per-query disable_shared_proof_graph flag bypasses lookup, store, and stats entirely, and re_engine_proof_graph_stats reports hits and misses (zeroes before the first cached query).
    upstream_refs: [src/backward/proof_graph.rs, tests/proof_graph_integration_test.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_BACKWARD_PROOFS
    implementation_ref: [engine/src/rule_engine/proof_graph.c, engine/src/rule_engine/backward.c]
    test_ref: engine/tests/test_rule_engine_backward_ext.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: sixty_four_entry_clear_all_cache; final_results_only; coarse_per_facts_generation_invalidation; config_serial_covers_install_and_function_registration; served_proofs_deep_cloned; disable_flag_moves_no_stats
    note: Entries key on the facts pointer value but never dereference it, so there is no use-after-free; a destroy-plus-realloc at the same address with a matching generation could alias and is parked as a documented residual risk. Invalidation is coarse - any mutation of the same facts object (retraction included, via the mutation_serial fix) drops its entries on next lookup; the upstream shared-subgraph producer-provenance graph is not modeled.
  - id: streaming-windows
    family: streaming
    requirement: optional
    syntax: 'window.record(StreamEvent::with_timestamp("login_failure", data, "auth", event_ts_ms));'
    expected_behavior: Define a versioned opaque window handle with explicit u64 millisecond event timestamps, tested tumbling/sliding/session kinds, retention/event/byte limits, allowed lateness, deterministic late-event policy, and deterministic opaque snapshot/restore.
    upstream_refs: [README.md, CHANGELOG.md:1.21.0, tests/]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_STREAMING_WINDOWS
    implementation_ref: engine/src/rule_engine/extensions.c
    test_ref: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_stream_ext.c]
    doc_ref: docs/Rule_Engine_Design.md
    contract_only: false
    runtime_enabled: true
    snapshot_restore: opaque_versioned_bytes_with_explicit_release_callback
    tested_subset: event_type_and_string_key_filtering; bounded_correlation_timeout; count_sum_average_min_max_first_last
    note: re_stream_aggregate_result_t grew by tail append (minimum/maximum/first/last) under struct_size gating - old-size callers get the old fields only. MIN/MAX fold numeric event values with the same RE_STATUS_INVALID_ARGUMENT-on-non-numeric tolerance as SUM/AVERAGE; FIRST/LAST copy the earliest/latest retained event by timestamp with insertion order breaking ties and accept any value type; an empty filtered set reports RE_STATUS_NOT_FOUND for the four new kinds while COUNT keeps 0/OK. first/last string data is a window-owned borrow valid until the next window mutation or destroy.
  - id: streaming-redis-state
    family: streaming-redis
    requirement: optional
    syntax: 'cargo build --features streaming-redis'
    expected_behavior: Define an optional state-provider boundary with callback and Redis kinds, direct provider errors, and no public network/client types; a native Redis adapter compiles only when RULE_ENGINE_ENABLE_REDIS is ON and CMake discovers hiredis, and the Redis kind keeps returning RE_STATUS_NOT_SUPPORTED without the client.
    upstream_refs: [Cargo.toml, docs/advanced-features/REDIS_STATE_BACKEND.md, .github/workflows/rust.yml]
    upstream_status: verified_upstream
    local_status: optional_backend
    extension_abi: RE_EXTENSION_STATE_PROVIDER
    implementation_ref: [engine/src/rule_engine/rule_engine.h, engine/src/rule_engine/redis_provider.c, engine/CMakeLists.txt]
    test_ref: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_stream_ext.c]
    doc_ref: docs/Rule_Engine_Design.md
    contract_only: false
    runtime_enabled: true
    portable_backend: deterministic_bounded_in_memory
    native_redis_status: optional_adapter_compile_verified_only
    provider_errors: [unavailable, timeout, serialization, conflict]
    redis_boundary: optional_adapter_behind_RULE_ENGINE_ENABLE_REDIS; missing_client_force_disables_no_fallback
    note: The sync hiredis adapter (redis_provider.c, compiled only with RE_HAS_HIREDIS) mirrors the in-memory provider vtable with "<prefix>:<name>" keys, raw-byte values (type tag plus payload), and PSETEX/SET/GET/DEL/PTTL with millisecond TTL; it configures through RE_REDIS_URL (default redis://127.0.0.1:6379) with fixed prefix "re" because the v1 options carry no connection field, and reports failures as RE_PROVIDER_ERROR_UNAVAILABLE via last_error. hiredis is absent on the verification host, so the adapter is compile-verified only - the disabled-build boundary is test-locked and the runtime roundtrip is skip-guarded by RE_TEST_REDIS_URL; hiredis discovery alone is not runtime evidence.
  - id: optional-concurrency
    family: concurrency
    requirement: optional
    syntax: 'engine.executor_create({ worker_count: 4 });'
    expected_behavior: Permit an optional executor backend without making C11 threading types or parallel ordering part of the base ABI; the threading contract is documented above re_engine_create and its busy semantics are test-locked.
    upstream_refs: [README.md, tests/backward_thread_safety.rs, docs/core-features/FEATURES.md]
    upstream_status: verified_upstream
    local_status: optional_backend
    extension_abi: RE_EXTENSION_CONCURRENCY
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_stream_ext.c]
    build_option: RULE_ENGINE_ENABLE_C11_PARALLEL
    stress_test_ref: engine/tests/test_rule_engine_executor_stress.c
    behavior_scope: pure_read_only_conditions_only_serial_actions_and_callbacks
    threading_contract: single_threaded_handles; conflicting_mutation_during_run_returns_busy; action_callback_fact_writes_stage_into_the_firing_transaction; allocator_callbacks_must_not_reenter_in_flight_handles; c11_executor_read_only_conditions_in_workers
    doc_ref: docs/Rule_Engine_Design.md
    note: The Phase 4 audit found no new guard vectors - windows have no user-code callback paths, provider dispatch is single-return, and restore is staged - so the existing running/notifying/transaction flags cover the real reentrancy surface; reentrant run, user-transaction begin, and working-memory reset from an action callback all return RE_STATUS_BUSY, locked by the executor-stress busy-boundary phase (64 iterations, race-free on the engine thread) and the stream_ext guard tests.
  - id: nested-property-access
    family: values
    requirement: required
    syntax: 'Customer.Address.City'
    expected_behavior: Resolve dotted paths exact flat-key first, then by walking the root fact's structured members; reads through re_facts_get_path (existing) and writes through re_facts_set_path (new) cover rule conditions and action operands, writes never create implicit intermediate objects, and rule then-assignments route dotted targets through re_facts_set_path with a flat re_facts_set fallback.
    upstream_refs: [README.md, docs/core-features/GRL_SYNTAX.md]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_STRUCTURED_VALUES
    implementation_ref: engine/src/rule_engine/values.c
    test_ref: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_grl_semantics.c]
    doc_ref: docs/Rule_Engine_Design.md
  - id: exists-flat-fact-comparison
    family: core-grl
    requirement: required
    syntax: 'exists Customer.Active == true'
    expected_behavior: Match a bounded flat fact comparison when the exact fact exists and satisfies the scalar comparison; absence and mismatch are ordinary non-matches.
    upstream_refs: [docs/core-features/GRL_SYNTAX.md, src/rete/pattern.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: engine/src/rule_engine/parser.c
    test_ref: engine/tests/test_rule_engine_ir.c
    parity: bounded_behavior
    behavior_scope: one_flat_fact_scalar_comparison; linear_ir_evaluation; no_private_rete_collector
    note: General parenthesized quantifier forms (exists/forall/! with arbitrary inner expressions) are implemented in the grl-general-quantifiers row; the separate bounded array-fact forall slice keeps its own coverage.
  - id: v1-21-4-action-reference-resolution
    family: v1.21.4-fix
    requirement: required
    syntax: 'User.firstNameAgain = User.firstName;'
    expected_behavior: Resolve an action dotted-field reference to its value, apply the assignment, and notify the callback.
    upstream_refs: [CHANGELOG.md:1.21.4, README.md, src/parser/grl.rs, src/expression.rs, src/engine/engine.rs]
