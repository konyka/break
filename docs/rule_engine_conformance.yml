conformance_policy: Upstream behavior is a requirement to test; local verified statuses below are limited to the focused C99 core tests and do not imply parity for deferred families.
statuses: [verified_upstream, verified, verified_local, pending, deferred, unsupported, optional_backend, equivalent_behavior, exact_parity, not_applicable]
features:
  - id: grl-rule-structure
    family: core-grl
    requirement: required
    syntax: 'rule "VIP Discount" { when Customer.TotalSpent > 10000 then Customer.Discount = 0.15; }'
    expected_behavior: Parse a named rule with when conditions and a then assignment, apply the literal or fact-reference value, then notify the caller callback for a matching rule.
    upstream_refs: [README.md, docs/core-features/GRL_SYNTAX.md, tests/grl_cases.yml, tests/grl_harness.rs]
    upstream_status: verified_upstream
    local_status: verified
    implementation_ref: engine/src/rule_engine/parser.c
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Architecture.md
  - id: facts-and-field-access
    family: core-grl
    requirement: required
    syntax: 'facts.set("Customer.TotalSpent", Value::Number(15000.0));'
    expected_behavior: Store and resolve copied flat fact fields used by conditions; dotted names use exact flat-key lookup.
    upstream_refs: [README.md, CHANGELOG.md:1.21.4, tests/grl_harness_data.rs]
    upstream_status: verified_upstream
    local_status: verified
    implementation_ref: engine/src/rule_engine/facts.c
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Architecture.md
  - id: rete-forward-execution
    family: rete
    requirement: required
    syntax: 'engine.execute(&mut facts)?;'
    expected_behavior: Evaluate matching rules in stable salience/source order, apply each action before its callback, and notify the caller callback; callback fact mutation is allowed.
    upstream_refs: [README.md, docs/core-features/FEATURES.md, tests/rete_performance_test.rs]
    upstream_status: verified_upstream
    local_status: verified
    implementation_ref: engine/src/rule_engine/engine.c
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Architecture.md
  - id: rule-salience-ordering
    family: rete
    requirement: required
    syntax: 'rule "VIP" salience 100 { when true then Priority = 1; }'
    expected_behavior: Order matching activations by descending signed 32-bit salience and preserve source order for equal salience.
    upstream_refs: [docs/core-features/FEATURES.md, docs/core-features/GRL_SYNTAX.md]
    upstream_status: verified_upstream
    local_status: verified
    implementation_ref: engine/src/rule_engine/parser.c
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Architecture.md
  - id: custom-functions
    family: rete
    requirement: optional
    syntax: 'engine.register_function("regex_match", |args, _| { /* return FactValue */ });'
    expected_behavior: Invoke registered functions from GRL conditions with resolved fact or literal arguments.
    upstream_refs: [README.md, CHANGELOG.md:1.20.3]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_CUSTOM_FUNCTIONS
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
  - id: structured-values
    family: values
    requirement: optional
    syntax: 'facts.set_path("Customer", "Address.City", Value::String("Paris"));'
    expected_behavior: Represent structured/object values with bounded traversal and explicit value ownership.
    upstream_refs: [README.md, docs/core-features/FEATURES.md]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_STRUCTURED_VALUES
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
  - id: fact-lifecycle
    family: facts
    requirement: optional
    syntax: 'facts.begin_transaction(); facts.commit();'
    expected_behavior: Expose fact insert/update/retract lifecycle events with transactional ownership and bounded callbacks.
    upstream_refs: [docs/core-features/FEATURES.md, tests/tms_test.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_FACT_LIFECYCLE
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_transactions.c]
    doc_ref: docs/Rule_Engine_Design.md
  - id: agenda-rete-control
    family: rete
    requirement: optional
    syntax: 'engine.agenda(); engine.rete_network();'
    expected_behavior: Expose the locally implemented bounded persistent agenda and per-rule private RETE seam; incremental indexing is bounded to per-rule networks and full upstream RETE controls are not claimed.
    upstream_refs: [docs/core-features/FEATURES.md, docs/core-features/GRL_SYNTAX.md]
    upstream_status: verified_upstream
    local_status: verified_local
    ownership_contract: caller-created networks remain caller-owned; engine-created networks are released by the engine; facts destruction detaches caller-owned networks without freeing their handles
    extension_abi: RE_EXTENSION_AGENDA_RETE
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
  - id: private-rete-bounded-conjunction
    family: rete
    requirement: optional
    syntax: 'bounded runtime seam: up to eight ANDed fact-vs-literal comparisons per rule'
    expected_behavior: Maintain bounded deterministic incremental alpha/beta/token memories for up to eight fact-vs-literal comparisons joined by conjunction, one private network per eligible rule chained on the facts store without cross-rule alpha sharing; remove stale activations on lifecycle events and expose only fact-id/rule-name provenance; unsupported boolean forms use the linear evaluator with read-set-keyed zero-token activations and full RETE-UL/TMS remains unclaimed.
    upstream_refs: []
    upstream_status: not_applicable
    local_status: verified_local
    implementation_ref: engine/src/rule_engine/rete.c
    test_ref: [engine/tests/test_rule_engine_rete_incremental.c, engine/tests/test_rule_engine_agenda.c]
    doc_ref: docs/Rule_Engine_Architecture.md
  - id: recognize-act-cycle
    family: rete
    requirement: optional
    syntax: 're_engine_run(engine, facts, options, callbacks);'
    expected_behavior: Loop recompute, refraction-deduped agenda push, pop-highest, and fire until the agenda empties, a limit is reached, or cancellation is requested; refraction keys combine rule, premise slots, and value fingerprints, pop-time revalidation discards stale activations without mark_fired, per-rule RETE networks chained on the facts store cover every eligible rule (up to eight ANDed fact-vs-literal comparisons), and a zero-token fallback keys activations by the condition read-set for conditions the alpha memories cannot see.
    upstream_refs: [src/engine/engine.rs, src/rete/agenda.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: [engine/src/rule_engine/engine.c, engine/src/rule_engine/agenda.c]
    test_ref: engine/tests/test_rule_engine_agenda.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: value_fingerprint_refraction; timestep_free_fired_keys; pop_time_revalidation; per_rule_networks_no_cross_rule_alpha_sharing; max_activations_tracked_cap
    note: Value fingerprints FNV-hash premise content; a collision can theoretically miss a refire, doubles hash raw bits, and NULL/UNKNOWN/NONE/structured values mix only the type tag. Fired keys persist per run (and across runs in persistent mode until a premise change), so an A->B->A value round trip within one run does not refire, and linear self-rewrite rules loop until max_firings (default 1024).
  - id: persistent-agenda-inspection
    family: rete
    requirement: optional
    syntax: 're_engine_set_agenda_persistent(engine, 1); re_agenda_peek(agenda, 0, &entry);'
    expected_behavior: Provide a lazily created engine-owned agenda whose pending count and peek (salience descending, activation sequence ascending, true generation-safe premise ids) reflect the recognize-act cycle; with persistence enabled, pending activations and fired refraction keys survive OK, LIMIT, and CANCELLED run exits until a program install resets the agenda, and re_agenda_destroy is a documented no-op for the engine-owned instance.
    upstream_refs: [src/rete/agenda.rs, docs/core-features/FEATURES.md]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_AGENDA_RETE
    implementation_ref: [engine/src/rule_engine/engine.c, engine/src/rule_engine/agenda.c, engine/src/rule_engine/extensions.c]
    test_ref: engine/tests/test_rule_engine_agenda.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: pending_and_fired_survive_run_exits; install_resets_agenda; abi_minor_3; capability_advertised_with_attached_networks
    note: re_engine_agenda takes a non-const engine because creation is lazy; re_agenda_entry_t.rule_name borrows the installed program's storage; peek is O(n^2) bounded by max_activations_tracked (zero selects the 1024 default).
  - id: advanced-rule-control
    family: advanced-rule-control
    requirement: optional
    syntax: 'salience 100; agenda-group "approval"; no-loop true;'
    expected_behavior: Provide the locally tested bounded subset of salience, no-loop, agenda and activation groups, date bounds, modules, and accumulators; persistent agenda state is covered by the persistent-agenda-inspection row, while general producer provenance and full truth maintenance are not claimed.
    upstream_refs: [docs/core-features/FEATURES.md, docs/core-features/GRL_SYNTAX.md, tests/test_module_system.rs, tests/tms_test.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_AGENDA_RETE
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
    behavior_scope: private_bounded_slices; no full upstream parity claim
  - id: backward-chaining
    family: backward-chaining
    requirement: optional
    syntax: 'engine.query("Order.AutoApproved == true", &mut facts)?;'
    expected_behavior: Prove or fail a goal and expose a proof trace using goal-driven search.
    upstream_refs: [README.md, examples/09-backward-chaining/simple_query_demo.rs, tests/backward_comprehensive_tests.rs, tests/backward_thread_safety.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_BACKWARD_PROOFS
    implementation_ref: engine/src/rule_engine/backward.c
    test_ref: engine/tests/test_rule_engine_backward.c
    doc_ref: docs/Rule_Engine_Design.md
    behavior_scope: tested bounded query seam; goal("RuleName") recursion, active-path cycle detection, max_depth, deterministic alternative-rule enumeration, copied proof traces, owned derivation-path nodes and immediate trace-parent edges (including distinct sibling and nested alternative proofs), transfer-on-query_next proof lifetime, mutation invalidation of unconsumed proofs, literal/propagated formal-actual binding, nested goal operands, and registered custom-function operands; arbitrary predicate unification and shared-subgraph/upstream producer provenance remain unsupported
  - id: streaming-windows
    family: streaming
    requirement: optional
    syntax: 'window.record(StreamEvent::with_timestamp("login_failure", data, "auth", event_ts_ms));'
    expected_behavior: Define a versioned opaque window handle with explicit u64 millisecond event timestamps, tested tumbling/sliding/session kinds, retention/event/byte limits, allowed lateness, deterministic late-event policy, and deterministic opaque snapshot/restore.
    upstream_refs: [README.md, CHANGELOG.md:1.21.0, tests/]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_STREAMING_WINDOWS
    implementation_ref: engine/src/rule_engine/extensions.c
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
    contract_only: false
    runtime_enabled: true
    snapshot_restore: opaque_versioned_bytes_with_explicit_release_callback
    tested_subset: event_type_and_string_key_filtering; bounded_correlation_timeout; count_sum_average
  - id: streaming-redis-state
    family: streaming-redis
    requirement: optional
    syntax: 'cargo build --features streaming-redis'
    expected_behavior: Define an optional state-provider boundary with callback and Redis kinds, direct provider errors, and no public network/client types; Redis runtime support remains pending.
    upstream_refs: [Cargo.toml, docs/advanced-features/REDIS_STATE_BACKEND.md, .github/workflows/rust.yml]
    upstream_status: verified_upstream
    local_status: optional_backend
    extension_abi: RE_EXTENSION_STATE_PROVIDER
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
    contract_only: false
    runtime_enabled: true
    portable_backend: deterministic_bounded_in_memory
    native_redis_status: unsupported
    provider_errors: [unavailable, timeout, serialization, conflict]
    redis_boundary: configure_detection_only; native_adapter_not_implemented
  - id: optional-concurrency
    family: concurrency
    requirement: optional
    syntax: 'engine.executor_create({ worker_count: 4 });'
    expected_behavior: Permit an optional executor backend without making C11 threading types or parallel ordering part of the base ABI.
    upstream_refs: [README.md, tests/backward_thread_safety.rs, docs/core-features/FEATURES.md]
    upstream_status: verified_upstream
    local_status: optional_backend
    extension_abi: RE_EXTENSION_CONCURRENCY
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    build_option: RULE_ENGINE_ENABLE_C11_PARALLEL
    stress_test_ref: engine/tests/test_rule_engine_executor_stress.c
    behavior_scope: pure_read_only_conditions_only_serial_actions_and_callbacks
    doc_ref: docs/Rule_Engine_Design.md
  - id: nested-property-access
    family: values
    requirement: required
    syntax: 'Customer.Address.City'
    expected_behavior: Resolve dotted paths exact flat-key first, then by walking the root fact's structured members; reads through re_facts_get_path (existing) and writes through re_facts_set_path (new) cover rule conditions and action operands, writes never create implicit intermediate objects, and rule then-assignments route dotted targets through re_facts_set_path with a flat re_facts_set fallback.
    upstream_refs: [README.md, docs/core-features/GRL_SYNTAX.md]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_STRUCTURED_VALUES
    implementation_ref: engine/src/rule_engine/values.c
    test_ref: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_grl_semantics.c]
    doc_ref: docs/Rule_Engine_Design.md
  - id: exists-flat-fact-comparison
    family: core-grl
    requirement: required
    syntax: 'exists Customer.Active == true'
    expected_behavior: Match a bounded flat fact comparison when the exact fact exists and satisfies the scalar comparison; absence and mismatch are ordinary non-matches.
    upstream_refs: [docs/core-features/GRL_SYNTAX.md, src/rete/pattern.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: engine/src/rule_engine/parser.c
    test_ref: engine/tests/test_rule_engine_ir.c
    parity: bounded_behavior
    behavior_scope: one_flat_fact_scalar_comparison; linear_ir_evaluation; no_private_rete_collector
    note: General nested or compound exists forms remain pending; the separate bounded forall slice is verified below.
  - id: v1-21-4-action-reference-resolution
    family: v1.21.4-fix
    requirement: required
    syntax: 'User.firstNameAgain = User.firstName;'
    expected_behavior: Resolve an action dotted-field reference to its value, apply the assignment, and notify the callback.
    upstream_refs: [CHANGELOG.md:1.21.4, README.md, src/parser/grl.rs, src/expression.rs, src/engine/engine.rs]
    upstream_status: verified_upstream
    local_status: verified
    implementation_ref: engine/src/rule_engine/engine.c
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Architecture.md
  - id: bounded-truth-maintenance
    family: facts
    requirement: optional
    syntax: 'facts.insert_logical(name, value, producer_rule, premise_ids)'
    expected_behavior: Track explicit versus logical facts with bounded copied producer provenance and generation-safe premise IDs; coalesce duplicate justifications, retain facts while supported, and cascade retraction after final support removal.
    upstream_refs: [src/rete/tms.rs, tests/tms_test.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: engine/src/rule_engine/tms.c
    test_ref: engine/tests/test_rule_engine_tms.c
    doc_ref: docs/Rule_Engine_Architecture.md
    parity: bounded_behavior
    behavior_scope: private_fact_store_tms; bounded_justification_table; transactional_clone_swap; deterministic_provenance_inspection; no_full_rete_ul
    note: This is a tested bounded lifecycle model, not full upstream TMS or automatic general RETE producer inference; persistent-agenda integration is bounded to retraction cancelling pending activations.
  - id: linear-path-provenance
    family: facts
    requirement: optional
    syntax: 'when N + 0 > 0 then N = N + 1;'
    expected_behavior: Record a bounded condition read-set (eight deduped paths, silent overflow) on TERM_FACT/EXISTS/FORALL hits during linear matching (never on action right-hand sides or backward evaluation), derive premises as the RETE lineage union the read-set fact ids (capped at eight), route linear-path derivations through re_facts_insert_logical/re_facts_justification_add, and anchor dotted action targets with structured roots on the root fact id.
    upstream_refs: [src/rete/tms.rs, tests/tms_test.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: [engine/src/rule_engine/ir_eval.c, engine/src/rule_engine/engine.c]
    test_ref: engine/tests/test_rule_engine_agenda.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: condition_read_set_only; root_anchored_dotted_target_justification; executor_parallel_path_captures_no_read_set
    note: Dotted-target justification anchors on the root fact, so cascade retraction removes the root (a documented bound); RE_COMPARE_IN fact-operand reads are not in the read-set, structured-root premises mix only the type tag into fingerprints (member-only changes do not re-activate linear rules), and a dotted-target transitive cycle can surface RE_STATUS_LIMIT from the TMS dependency check.
  - id: grl-method-calls
    family: core-grl
    requirement: optional
    syntax: '$Customer.setScore(Score + 1); $Customer.getScore();'
    expected_behavior: In then actions, $Fact.method(args) applies the bounded set/get/reset/update conventions against the receiver's structured object or dispatches to a registered function named "Fact.method" then "method", failing with RE_STATUS_NOT_SUPPORTED when neither exists; $ outside a then method call is a parse error, and when conditions keep bare-identifier registered-function dispatch only.
    upstream_refs: [docs/core-features/GRL_SYNTAX.md, src/expression.rs, src/engine/engine.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: engine/src/rule_engine/engine.c
    test_ref: engine/tests/test_rule_engine_grl_semantics.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: then_action_dollar_receiver_calls_only; set_get_reset_update_conventions; registered_function_fallback; explicit_not_supported_divergence
    note: Upstream silently no-ops an unknown method while the local engine fails the run with RE_STATUS_NOT_SUPPORTED; method calls in when conditions remain registered-function only.
  - id: deffacts
    family: facts
    requirement: optional
    syntax: 'deffacts "seed" { Customer.TotalSpent = 15000.0; }; re_engine_load_deffacts(engine, facts, NULL);'
    expected_behavior: Parse top-level named deffacts sets of flat fact paths with scalar or array literals atomically alongside rules; re_engine_load_deffacts asserts one named set or all sets as plain non-logical facts with duplicates overwriting, and re_engine_reset_with_deffacts clears working memory (facts, TMS justifications, and the agenda hook) before loading every set.
    upstream_refs: [Cargo.toml:[[example]].rete_deffacts_demo]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: [engine/src/rule_engine/parser.c, engine/src/rule_engine/engine.c]
    test_ref: engine/tests/test_rule_engine_grl_semantics.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: local_grl_extension; scalar_and_array_literals_only; plain_non_logical_sets; clear_all_then_reseed
    note: Upstream exposes deffacts through its Rust API only, so the GRL top-level form is a documented local extension rather than upstream syntax parity.
  - id: rule-templates
    family: core-grl
    requirement: optional
    syntax: 're_rule_template_instantiate(t, rule_name, params, param_count, out_text, &size);'
    expected_behavior: Substitute {{identifier}} placeholders in condition and action templates by plain byte substitution with per-param defaults, emitting rule "name" [salience N] when/then text that the host parses through re_program_load; a missing param or an unmatched supplied param fails with RE_STATUS_INVALID_ARGUMENT.
    upstream_refs: [src/engine/template.rs, Cargo.toml:[[example]].rule_templates_demo]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: engine/src/rule_engine/templates.c
    test_ref: engine/tests/test_rule_engine_grl_semantics.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: instantiate_to_text_only; plain_byte_substitution; no_json_round_trip; no_engine_side_registry; no_clips_deftemplate_schema
    note: The emitted rule name is unescaped and text that is not an exact {{identifier}} placeholder copies through unchanged; there is no JSON round-trip and no program-side template registry.
conformance_statement: Locally verified rows are limited to the focused test cases in engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_rete_incremental.c, engine/tests/test_rule_engine_transactions.c, engine/tests/test_rule_engine_backward.c, engine/tests/test_rule_engine_backward_bindings.c, engine/tests/test_rule_engine_backward_deep_chain.c, engine/tests/test_backward_machine_structure.c, engine/tests/test_backward_machine_context.c, engine/tests/test_rule_engine_grl_semantics.c, and engine/tests/test_rule_engine_agenda.c plus separately named streaming, provider, fuzz-smoke, executor-stress, and C99 consumer evidence. The backward-chaining row covers the deliberately narrow bounded query seam with recursive goal traversal, literal/propagated formal-actual binding, nested goal operands, registered custom-function operands, cycle detection, deterministic alternative-rule enumeration, immutable proof ownership transferred by query_next, deterministic immediate trace-parent node/edge storage for each independent derivation, and mutation invalidation of remaining proofs. Arbitrary predicate unification, shared-subgraph proof provenance, RETE-UL parity, full upstream truth maintenance and general multi-rule producer inference, general backward chaining, and native Redis remain unsupported or unverified.
inventory_manifest: docs/rule_engine_upstream.yml
classification_policy:
  evidence_rule: A declaration, header, CMake option, or upstream documentation claim never promotes a local capability without an implementation reference and executed local test reference.
  exact_parity: Use only where the observable upstream semantics and contract are tested locally without a bounded restriction.
  equivalent_behavior: Use where C99 implementation differs internally or at the ABI boundary but preserves the tested observable contract.
  bounded_behavior: Use for deliberately narrower local slices; never report these as exact parity.
  statuses: [implemented, tested, pending, unsupported, optional_backend, blocked]
known_gaps:
  - {id: canonical-ir, status: implemented, upstream_refs: [src/rete/network.rs, RETE_ARCHITECTURE.md], local_refs: [engine/src/rule_engine/ir.h, engine/src/rule_engine/ir.c, engine/src/rule_engine/ir_validate.c], local_tests: [engine/tests/test_rule_engine_ir.c], parity: bounded_behavior, note: Private immutable compiled IR covers the tested rule, expression, term, action, module, bounded source-envelope span, validation, and transactional-install boundary; forward evaluation uses the IR.}
  - {id: grl-string-operators-append-and-bounded-in, status: tested, upstream_refs: [docs/core-features/GRL_SYNTAX.md, src/types.rs, CHANGELOG.md:1.19.0, CHANGELOG.md:1.15.0], local_refs: [engine/src/rule_engine/parser.c, engine/src/rule_engine/ir.h, engine/src/rule_engine/ir_eval.c, engine/src/rule_engine/engine.c, engine/src/rule_engine/values.c], local_tests: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_ir.c], parity: bounded_behavior, note: Forward IR supports contains, startsWith, endsWith, matches, += array append, and bounded membership against literal arrays or structured arrays containing scalar members. Literal arrays are capped at 64 elements; typed equality is used and malformed/non-array RHS values are rejected. Full upstream collection semantics remain pending; bounded then-action method calls and nested property writes are verified in the grl-method-calls and nested-property-access rows.}
