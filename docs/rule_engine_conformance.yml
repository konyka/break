schema: rule-engine-conformance/v1
project: rust-rule-engine
upstream_reference:
  tag: v1.21.4
  commit: f80a5419847436f8095be6a9953c69b38a6ae052
  evidence_manifest: docs/rule_engine_upstream.yml
  observed_on: 2026-08-24
  release_discrepancy: "v1.21.4 is tagged and published on crates.io, but no corresponding GitHub Release object was found."
local_implementation_status: partial
conformance_policy: Upstream behavior is a requirement to test; local verified statuses below are limited to the focused C99 core tests and do not imply parity for deferred families.
statuses: [verified_upstream, verified, verified_local, pending, deferred, unsupported, optional_backend, equivalent_behavior, exact_parity, not_applicable]
features:
  - id: grl-rule-structure
    family: core-grl
    requirement: required
    syntax: 'rule "VIP Discount" { when Customer.TotalSpent > 10000 then Customer.Discount = 0.15; }'
    expected_behavior: Parse a named rule with when conditions and a then assignment, apply the literal or fact-reference value, then notify the caller callback for a matching rule.
    upstream_refs: [README.md, docs/core-features/GRL_SYNTAX.md, tests/grl_cases.yml, tests/grl_harness.rs]
    upstream_status: verified_upstream
    local_status: verified
    implementation_ref: engine/src/rule_engine/parser.c
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Architecture.md
  - id: facts-and-field-access
    family: core-grl
    requirement: required
    syntax: 'facts.set("Customer.TotalSpent", Value::Number(15000.0));'
    expected_behavior: Store and resolve copied flat fact fields used by conditions; dotted names use exact flat-key lookup.
    upstream_refs: [README.md, CHANGELOG.md:1.21.4, tests/grl_harness_data.rs]
    upstream_status: verified_upstream
    local_status: verified
    implementation_ref: engine/src/rule_engine/facts.c
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Architecture.md
  - id: rete-forward-execution
    family: rete
    requirement: required
    syntax: 'engine.execute(&mut facts)?;'
    expected_behavior: Evaluate matching rules in stable salience/source order, apply each action before its callback, and notify the caller callback; callback fact mutation is allowed.
    upstream_refs: [README.md, docs/core-features/FEATURES.md, tests/rete_performance_test.rs]
    upstream_status: verified_upstream
    local_status: verified
    implementation_ref: engine/src/rule_engine/engine.c
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Architecture.md
  - id: rule-salience-ordering
    family: rete
    requirement: required
    syntax: 'rule "VIP" salience 100 { when true then Priority = 1; }'
    expected_behavior: Order matching activations by descending signed 32-bit salience and preserve source order for equal salience.
    upstream_refs: [docs/core-features/FEATURES.md, docs/core-features/GRL_SYNTAX.md]
    upstream_status: verified_upstream
    local_status: verified
    implementation_ref: engine/src/rule_engine/parser.c
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Architecture.md
  - id: custom-functions
    family: rete
    requirement: optional
    syntax: 'engine.register_function("regex_match", |args, _| { /* return FactValue */ });'
    expected_behavior: Invoke registered functions from GRL conditions with resolved fact or literal arguments.
    upstream_refs: [README.md, CHANGELOG.md:1.20.3]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_CUSTOM_FUNCTIONS
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
  - id: structured-values
    family: values
    requirement: optional
    syntax: 'facts.set_path("Customer", "Address.City", Value::String("Paris"));'
    expected_behavior: Represent structured/object values with bounded traversal and explicit value ownership.
    upstream_refs: [README.md, docs/core-features/FEATURES.md]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_STRUCTURED_VALUES
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
  - id: fact-lifecycle
    family: facts
    requirement: optional
    syntax: 'facts.begin_transaction(); facts.commit();'
    expected_behavior: Expose fact insert/update/retract lifecycle events with transactional ownership and bounded callbacks.
    upstream_refs: [docs/core-features/FEATURES.md, tests/tms_test.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_FACT_LIFECYCLE
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
  - id: agenda-rete-control
    family: rete
    requirement: optional
    syntax: 'engine.agenda(); engine.rete_network();'
    expected_behavior: Expose the locally implemented bounded agenda and private RETE seam; incremental indexing and full upstream RETE controls are not claimed.
    upstream_refs: [docs/core-features/FEATURES.md, docs/core-features/GRL_SYNTAX.md]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_AGENDA_RETE
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
  - id: private-rete-bounded-conjunction
    family: rete
    requirement: optional
    syntax: 'bounded runtime seam: two flat fact conditions joined by conjunction'
    expected_behavior: Maintain bounded deterministic incremental alpha/beta/token activations for two flat fact conditions across supported runs, remove stale activations on lifecycle events, and expose only fact-id/rule-name provenance; unsupported boolean forms use the linear evaluator and full RETE-UL/TMS remains unclaimed.
    upstream_refs: []
    upstream_status: not_applicable
    local_status: verified_local
    implementation_ref: engine/src/rule_engine/rete.c
    test_ref: engine/tests/test_rule_engine_rete_incremental.c
    doc_ref: docs/Rule_Engine_Architecture.md
  - id: advanced-rule-control
    family: advanced-rule-control
    requirement: optional
    syntax: 'salience 100; agenda-group "approval"; no-loop true;'
    expected_behavior: Provide the locally tested bounded subset of salience, no-loop, agenda and activation groups, date bounds, modules, and accumulators; persistent agenda state, full producer provenance, and truth maintenance are not claimed.
    upstream_refs: [docs/core-features/FEATURES.md, docs/core-features/GRL_SYNTAX.md, tests/test_module_system.rs, tests/tms_test.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_AGENDA_RETE
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
    behavior_scope: private_bounded_slices; no full upstream parity claim
  - id: backward-chaining
    family: backward-chaining
    requirement: optional
    syntax: 'engine.query("Order.AutoApproved == true", &mut facts)?;'
    expected_behavior: Prove or fail a goal and expose a proof trace using goal-driven search.
    upstream_refs: [README.md, examples/09-backward-chaining/simple_query_demo.rs, tests/backward_comprehensive_tests.rs, tests/backward_thread_safety.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_BACKWARD_PROOFS
    implementation_ref: engine/src/rule_engine/backward.c
    test_ref: engine/tests/test_rule_engine_backward.c
    doc_ref: docs/Rule_Engine_Design.md
    behavior_scope: tested bounded query seam; goal("RuleName") recursion, active-path cycle detection, max_depth, deterministic alternative-rule enumeration, copied proof traces, owned derivation-path nodes and immediate trace-parent edges (including distinct sibling and nested alternative proofs), transfer-on-query_next proof lifetime, mutation invalidation of unconsumed proofs, literal/propagated formal-actual binding, nested goal operands, and registered custom-function operands; arbitrary predicate unification and shared-subgraph/upstream producer provenance remain unsupported
  - id: streaming-windows
    family: streaming
    requirement: optional
    syntax: 'window.record(StreamEvent::with_timestamp("login_failure", data, "auth", event_ts_ms));'
    expected_behavior: Define a versioned opaque window handle with explicit u64 millisecond event timestamps, tested tumbling/sliding/session kinds, retention/event/byte limits, allowed lateness, deterministic late-event policy, and deterministic opaque snapshot/restore.
    upstream_refs: [README.md, CHANGELOG.md:1.21.0, tests/]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_STREAMING_WINDOWS
    implementation_ref: engine/src/rule_engine/extensions.c
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
    contract_only: false
    runtime_enabled: true
    snapshot_restore: opaque_versioned_bytes_with_explicit_release_callback
    tested_subset: event_type_and_string_key_filtering; bounded_correlation_timeout; count_sum_average
  - id: streaming-redis-state
    family: streaming-redis
    requirement: optional
    syntax: 'cargo build --features streaming-redis'
    expected_behavior: Define an optional state-provider boundary with callback and Redis kinds, direct provider errors, and no public network/client types; Redis runtime support remains pending.
    upstream_refs: [Cargo.toml, docs/advanced-features/REDIS_STATE_BACKEND.md, .github/workflows/rust.yml]
    upstream_status: verified_upstream
    local_status: optional_backend
    extension_abi: RE_EXTENSION_STATE_PROVIDER
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
    contract_only: false
    runtime_enabled: true
    portable_backend: deterministic_bounded_in_memory
    native_redis_status: unsupported
    provider_errors: [unavailable, timeout, serialization, conflict]
    redis_boundary: configure_detection_only; native_adapter_not_implemented
  - id: optional-concurrency
    family: concurrency
    requirement: optional
    syntax: 'engine.executor_create({ worker_count: 4 });'
    expected_behavior: Permit an optional executor backend without making C11 threading types or parallel ordering part of the base ABI.
    upstream_refs: [README.md, tests/backward_thread_safety.rs, docs/core-features/FEATURES.md]
    upstream_status: verified_upstream
    local_status: optional_backend
    extension_abi: RE_EXTENSION_CONCURRENCY
    implementation_ref: engine/src/rule_engine/rule_engine.h
    test_ref: engine/tests/test_rule_engine.c
    build_option: RULE_ENGINE_ENABLE_C11_PARALLEL
    stress_test_ref: engine/tests/test_rule_engine_executor_stress.c
    behavior_scope: pure_read_only_conditions_only_serial_actions_and_callbacks
    doc_ref: docs/Rule_Engine_Design.md
  - id: nested-fact-traversal
    family: values
    requirement: required
    syntax: 'Customer.Address.City'
    expected_behavior: Resolve nested paths only when structured values are enabled; exact flat-key lookup remains the current core behavior.
    upstream_refs: [README.md, docs/core-features/GRL_SYNTAX.md]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_STRUCTURED_VALUES
    implementation_ref: engine/src/rule_engine/values.c
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Design.md
  - id: v1-21-4-action-reference-resolution
    family: v1.21.4-fix
    requirement: required
    syntax: 'User.firstNameAgain = User.firstName;'
    expected_behavior: Resolve an action dotted-field reference to its value, apply the assignment, and notify the callback.
    upstream_refs: [CHANGELOG.md:1.21.4, README.md, src/parser/grl.rs, src/expression.rs, src/engine/engine.rs]
    upstream_status: verified_upstream
    local_status: verified
    implementation_ref: engine/src/rule_engine/engine.c
    test_ref: engine/tests/test_rule_engine.c
    doc_ref: docs/Rule_Engine_Architecture.md
conformance_statement: Locally verified rows are limited to the focused test cases in engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_rete_incremental.c, engine/tests/test_rule_engine_transactions.c, engine/tests/test_rule_engine_backward.c, engine/tests/test_rule_engine_backward_bindings.c, engine/tests/test_rule_engine_backward_deep_chain.c, engine/tests/test_backward_machine_structure.c, and engine/tests/test_backward_machine_context.c plus separately named streaming, provider, fuzz-smoke, executor-stress, and C99 consumer evidence. The backward-chaining row covers the deliberately narrow bounded query seam with recursive goal traversal, literal/propagated formal-actual binding, nested goal operands, registered custom-function operands, cycle detection, deterministic alternative-rule enumeration, immutable proof ownership transferred by query_next, deterministic immediate trace-parent node/edge storage for each independent derivation, and mutation invalidation of remaining proofs. Arbitrary predicate unification, shared-subgraph proof provenance, RETE-UL parity, persistent agenda control, full upstream producer provenance, general backward chaining, and native Redis remain unsupported or unverified.
inventory_manifest: docs/rule_engine_upstream.yml
classification_policy:
  evidence_rule: A declaration, header, CMake option, or upstream documentation claim never promotes a local capability without an implementation reference and executed local test reference.
  exact_parity: Use only where the observable upstream semantics and contract are tested locally without a bounded restriction.
  equivalent_behavior: Use where C99 implementation differs internally or at the ABI boundary but preserves the tested observable contract.
  bounded_behavior: Use for deliberately narrower local slices; never report these as exact parity.
  statuses: [implemented, tested, pending, unsupported, optional_backend, blocked]
known_gaps:
  - {id: canonical-ir, status: implemented, upstream_refs: [src/rete/network.rs, RETE_ARCHITECTURE.md], local_refs: [engine/src/rule_engine/ir.h, engine/src/rule_engine/ir.c, engine/src/rule_engine/ir_validate.c], local_tests: [engine/tests/test_rule_engine_ir.c], parity: bounded_behavior, note: Private immutable compiled IR covers the tested rule, expression, term, action, module, bounded source-envelope span, validation, and transactional-install boundary; forward evaluation uses the IR.}
  - {id: grl-string-operators-append-and-bounded-in, status: tested, upstream_refs: [docs/core-features/GRL_SYNTAX.md, src/types.rs, CHANGELOG.md:1.19.0, CHANGELOG.md:1.15.0], local_refs: [engine/src/rule_engine/parser.c, engine/src/rule_engine/ir.h, engine/src/rule_engine/ir_eval.c, engine/src/rule_engine/engine.c, engine/src/rule_engine/values.c], local_tests: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_ir.c], parity: bounded_behavior, note: Forward IR supports contains, startsWith, endsWith, matches, += array append, and bounded membership against literal arrays or structured arrays containing scalar members. Literal arrays are capped at 64 elements; typed equality is used and malformed/non-array RHS values are rejected. Full upstream collection semantics and method/property calls remain pending.}
  - {id: rete-ul-tms-persistent-agenda, status: unsupported, upstream_refs: [src/rete/network.rs, src/rete/tms.rs, src/rete/agenda.rs], local_refs: [engine/src/rule_engine/rete.c, engine/src/rule_engine/advanced.c], local_tests: [engine/tests/test_rule_engine_rete_incremental.c, engine/tests/test_rule_engine.c], parity: bounded_behavior, note: Full RETE-UL, TMS, and persistent agenda are absent; local RETE and agenda rows are bounded equivalents only.}
  - {id: backward-arbitrary-unification-proof-sharing, status: unsupported, upstream_refs: [src/backward/unification.rs, src/backward/proof_graph.rs], local_refs: [engine/src/rule_engine/backward.c, engine/src/rule_engine/backward_machine_bind.c], local_tests: [engine/tests/test_rule_engine_backward_bindings.c], parity: bounded_behavior, note: Backward arbitrary unification and proof sharing are absent; local binding/proof paths are bounded and non-shared.}
  - {id: full-streaming-patterns, status: unsupported, upstream_refs: [src/rete/stream_alpha_node.rs, src/streaming/operators.rs, src/streaming/watermark.rs], local_refs: [engine/src/rule_engine/tumbling_session.c, engine/src/rule_engine/stream_correlation.c], local_tests: [engine/tests/test_rule_engine.c, engine/tests/rule_engine_fuzz_smoke.c], parity: bounded_behavior, note: Full streaming patterns are absent; local windows/correlation are bounded extension seams.}
  - {id: native-redis, status: blocked, upstream_refs: [Cargo.toml:[features].streaming-redis, docs/advanced-features/REDIS_STATE_BACKEND.md], local_refs: [engine/CMakeLists.txt:719-730, engine/src/rule_engine/memory_provider.c], local_tests: [], parity: optional_backend, note: Native Redis is unavailable; hiredis detection alone is not implementation evidence.}
