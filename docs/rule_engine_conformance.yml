  - id: backward-chaining
    family: backward-chaining
    requirement: optional
    syntax: 'engine.query("Order.AutoApproved == true", &mut facts)?;'
    expected_behavior: Prove or fail a goal and expose a proof trace using goal-driven search.
    upstream_refs: [README.md, examples/09-backward-chaining/simple_query_demo.rs, tests/backward_comprehensive_tests.rs, tests/backward_thread_safety.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_BACKWARD_PROOFS
    implementation_ref: engine/src/rule_engine/backward.c
    test_ref: [engine/tests/test_rule_engine_backward.c, engine/tests/test_rule_engine_backward_ext.c]
    doc_ref: docs/Rule_Engine_Design.md
    behavior_scope: tested bounded query seam; goal("RuleName") recursion, active-path cycle detection, max_depth, deterministic alternative-rule enumeration, copied proof traces, owned derivation-path nodes and immediate trace-parent edges (including distinct sibling and nested alternative proofs), transfer-on-query_next proof lifetime, mutation invalidation of unconsumed proofs, literal/propagated formal-actual binding, nested goal operands, and registered custom-function operands; an exact-form goal("RuleName") query string is unwrapped to the bare rule goal; query-level negation, aggregation, search strategies, and the bounded shared proof graph are covered by the dedicated rows below; bounded ?var unification per the upstream case table is covered by the backward-qvar-unification row; arbitrary predicate unification and shared-subgraph/upstream producer provenance remain unsupported
    note: A rule literally named goal("X") collides with the exact-form query-string unwrap and is queried as rule X.
  - id: query-negation
    family: backward-chaining
    requirement: optional
    syntax: 're_engine_query(engine, facts, "NOT Order.RequiresApproval == true", &query);'
    expected_behavior: Prove a leading-NOT goal by negation-as-failure under the closed-world assumption - upstream likewise restricts NOT to a goal prefix and applies no stratification pass. A provable subgoal yields DISPROVED with zero solutions; an unprovable or disproved subgoal yields PROVED with one empty-binding proof whose trace names the full NOT goal text; a depth-limited subgoal propagates RE_QUERY_LIMIT unchanged because inverting a limited search would be unsound. Nested NOT NOT unwraps one level per recursion, the prefix is case-sensitive, and the inversion composes with the selected search strategy because it applies to the strategy-selected subgoal result.
    upstream_refs: [docs/api-reference/GRL_QUERY_SYNTAX.md, src/backward/search.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_BACKWARD_PROOFS
    implementation_ref: engine/src/rule_engine/backward.c
    test_ref: engine/tests/test_rule_engine_backward_ext.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: prefix_not_only; closed_world_negation_as_failure; no_stratification; limit_propagated_never_inverted; nested_not_recursion; case_sensitive_prefix
    note: The NOT prefix consumes no max_depth level - the subgoal re-enters the dispatcher with the caller's normalized options and max_solutions 1. An empty remainder is RE_STATUS_INVALID_ARGUMENT, and a NOT query counts the subgoal consult in the proof-graph stats (one fresh "NOT X" records two misses).
  - id: query-aggregation
    family: backward-chaining
    requirement: optional
    syntax: 're_engine_query_aggregate(engine, facts, RE_ACCUM_SUM, field, pattern, &out);'
    expected_behavior: Run the pattern (an ordinary query goal string) through an internal bounded query with max_depth 64 and max_solutions 1024, then fold the binding named field over the solutions in DFS order. Kinds are COUNT, SUM, AVERAGE, MIN, MAX plus the appended FIRST/LAST. Result typing matches the upstream aggregation rules - COUNT RE_VALUE_INT64, AVERAGE RE_VALUE_DOUBLE, SUM/MIN/MAX RE_VALUE_INT64 when every folded value was INT64 else RE_VALUE_DOUBLE - and deliberately differs from re_accumulator_evaluate's always-DOUBLE, as the header comment notes. FIRST/LAST copy the first/last solution's binding value; a STRING result is RE_STATUS_NOT_SUPPORTED because proof string storage dies with the internal query. An empty solution set yields COUNT 0 with RE_STATUS_OK and NOT_FOUND for every other kind; a non-numeric fold input is RE_STATUS_INVALID_ARGUMENT.
    upstream_refs: [docs/api-reference/GRL_QUERY_SYNTAX.md, src/backward/aggregation.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: engine/src/rule_engine/backward.c
    test_ref: engine/tests/test_rule_engine_backward_ext.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: internal_bounded_query_max_depth_64_max_solutions_1024; seven_kinds_including_first_last; int64_preserving_sum_min_max; empty_set_count_zero_others_not_found; first_last_string_not_supported; non_numeric_fold_rejected
    note: Reaching the 1024-solution cap reports RE_STATUS_LIMIT because an exact fit cannot be told apart from a truncated set, as does a depth-limited internal search. Percentile, stddev, count-distinct, GROUP BY, and nested or multi-variable aggregation are excluded; upstream's GRL query-block/WHERE surface is not parsed. The INT64 fold accumulates with unchecked addition, so extreme sums overflow (wrap) without a status.
  - id: search-strategies
    family: backward-chaining
    requirement: optional
    syntax: 're_query_options_t options = {sizeof(options), 8u, 4u, RE_QUERY_STRATEGY_BREADTH_FIRST, 0u};'
    expected_behavior: Select RE_QUERY_STRATEGY_DEPTH_FIRST (default), BREADTH_FIRST, or ITERATIVE per query through the appended strategy field of re_query_options_t; the struct_size versioning keeps old-size structs on DFS with sharing on and rejects sub-size structs with RE_STATUS_INVALID_ARGUMENT, and a strategy value outside [0, 2] is RE_STATUS_INVALID_ARGUMENT. BREADTH_FIRST and ITERATIVE are the same iterative-deepening wrapper over the DFS machine, re-proving with max_depth caps 1, 2, 4, ... up to the configured max_depth (default 64) so the first cap yielding at least one solution wins; backward queries execute no actions so re-probing is side-effect free, and more than 32 doublings reports RE_STATUS_LIMIT. NOT composes with the strategy because the inversion applies to the strategy-selected subgoal result.
    upstream_refs: [docs/api-reference/GRL_QUERY_SYNTAX.md, src/backward/search.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: engine/src/rule_engine/backward.c
    test_ref: engine/tests/test_rule_engine_backward_ext.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: three_strategies_append_only_enum; bfs_and_iterative_share_iterative_deepening_wrapper; doubling_caps_first_solvable_wins; side_effect_free_reprobing; not_composes_with_strategy
    note: Upstream iterative deepening is likewise DFS probes at rising depth caps, so the local wrapper matches the upstream ITERATIVE mechanism and observably selects a shallowest-depth proof; upstream breadth-first is a separate queue-based search and is not modeled. A winning capped probe reports RE_QUERY_PROVED even though deeper branches were cut - the cap is the strategy mechanism, not a search failure.
  - id: shared-proof-graph
    family: backward-chaining
    requirement: optional
    syntax: 're_engine_proof_graph_stats_v2(engine, &stats);'
    expected_behavior: Cache final backward-query results in a lazily created engine-owned 64-entry table consulted after option normalization, keyed on the exact goal text, facts identity, normalized options (max_depth, max_solutions, strategy), and the engine config serial, and stamped with the facts mutation generation. Only PROVED and DISPROVED are stored - LIMIT and UNKNOWN are never cached; a full table clears every entry (counted as evictions), served proofs are deep clones, and a served query wires the same invalidation subscription a fresh run gets. Sub-project B gave the cache the upstream proof_graph.rs graph shape over the entry layer - every backward run captures a bounded (32, deduped-by-path) premise set of {path, present, FNV-1a typed value fingerprint} covering each fact read (absent reads are recorded with present=0, so a later first assert still invalidates), cache hits merge the served entry's premises into an enclosing capture, and each store records one informational node per proof (trace-root rule name + valid flag) with the producing run's premise set. Lookup keeps generation equality as the fast path and, on serial mismatch, re-resolves each premise and compares presence plus typed fingerprint - a cached result whose premises all hold SURVIVES an unrelated mutation, and any flip unlinks the whole entry (the local analog of upstream lookup_by_key filtering invalid nodes). Any untracked influence (user function mid-proof, premise-cap overflow, allocation failure) flips the capture opaque and pins the entry to the coarse generation check. The per-query disable_shared_proof_graph flag bypasses lookup, store, and stats entirely; re_engine_proof_graph_stats keeps the ABI-stable hits/misses form and the appended re_engine_proof_graph_stats_v2 fills a struct_size-versioned re_proof_graph_stats_t {hits, misses, invalidations, stores, evictions}.
    upstream_refs: [src/backward/proof_graph.rs, tests/proof_graph_integration_test.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_BACKWARD_PROOFS
    implementation_ref: [engine/src/rule_engine/proof_graph.c, engine/src/rule_engine/backward.c]
    test_ref: engine/tests/test_rule_engine_backward_ext.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: sixty_four_entry_clear_all_cache; final_results_only; generation_fast_path_per_premise_revalidation; premise_capture_bounded_32_opaque_fallback; informational_node_records; stats_v2_struct_size_versioned; config_serial_covers_install_and_function_registration; served_proofs_deep_cloned; disable_flag_moves_no_stats
    note: Entries key on the facts pointer value but never dereference it, so there is no use-after-free; a destroy-plus-realloc at the same address with a matching generation could alias and is parked as a documented residual risk. Dependent propagation is lazy - an invalidated dependent is detected by re-validation at its next consult - rather than upstream's eager invalidate_handle recursion; semantically equivalent for a result cache. Value fingerprints cover BOOL/INT64/DOUBLE/STRING precisely; object/array facts fingerprint by type tag only (documented bound - future member-level reads must be captured or flip the capture opaque). The upstream shared-subgraph producer-provenance graph is not modeled.
  - id: streaming-windows
    family: streaming
    requirement: optional
    syntax: 'window.record(StreamEvent::with_timestamp("login_failure", data, "auth", event_ts_ms));'
    expected_behavior: Define a versioned opaque window handle with explicit u64 millisecond event timestamps, tested tumbling/sliding/session kinds, retention/event/byte limits, allowed lateness, deterministic late-event policy, and deterministic opaque snapshot/restore.
    upstream_refs: [README.md, CHANGELOG.md:1.21.0, tests/]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_STREAMING_WINDOWS
    implementation_ref: engine/src/rule_engine/extensions.c
    test_ref: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_stream_ext.c]
    doc_ref: docs/Rule_Engine_Design.md
    contract_only: false
    runtime_enabled: true
    snapshot_restore: opaque_versioned_bytes_with_explicit_release_callback
    tested_subset: event_type_and_string_key_filtering; bounded_correlation_timeout; count_sum_average_min_max_first_last; count_distinct_stddev_percentile; watermark_driven_closure_tumbling_session
    note: re_stream_aggregate_result_t grew by tail append (minimum/maximum/first/last) under struct_size gating - old-size callers get the old fields only. MIN/MAX fold numeric event values with the same RE_STATUS_INVALID_ARGUMENT-on-non-numeric tolerance as SUM/AVERAGE; FIRST/LAST copy the earliest/latest retained event by timestamp with insertion order breaking ties and accept any value type; an empty filtered set reports RE_STATUS_NOT_FOUND for the min/max/first/last kinds while COUNT keeps 0/OK. first/last string data is a window-owned borrow valid until the next window mutation or destroy. Sub-project C tail-appended RE_STREAM_AGGREGATE_COUNT_DISTINCT/STDDEV/PERCENTILE (kinds 8/9/10, src/streaming/aggregator.rs:12) - STDDEV is population (variance sums (v-mean)^2 over N, :233) and requires at least 2 numeric values else RE_STATUS_NOT_FOUND (upstream None); PERCENTILE sorts ascending and takes nearest-rank round(p/100 * (n-1)) on a 0-100 scale (:253) from the struct_size-gated filter tail field (an uncovered or out-of-range percentile, NaN included, is RE_STATUS_INVALID_ARGUMENT; pre-C1 filter sizes keep working for every other kind); COUNT_DISTINCT reports in the existing count field under typed equality over re_value_t (bitwise double comparison) - upstream counts distinct format!("{:?}") debug strings, which would equate 1 and 1.0, a documented divergence. STDDEV/PERCENTILE join the INVALID_ARGUMENT-on-non-numeric folds and the empty-set NOT_FOUND rule; re_stream_aggregate_result_t gained stddev/percentile under the same pair-gating idiom, and RE_ABI_VERSION_MINOR bumped once for the sub-project (3u to 4u). The C4 watermark_drives_closure flag (struct_size-gated tail append to re_stream_window_options_t, default 0 = pre-C behavior, forced 0 when uncovered) gates each record against the window's current watermark before the late gate - a tumbling bucket closes at watermark >= bucket_end + allowed_lateness_ms and a session target at watermark >= (ts + retention_ms) + allowed_lateness_ms (saturating); closed + DROP reports RE_STATUS_NOT_FOUND, closed + ERROR reports RE_STATUS_ERROR, closed + ACCEPT records only a still-retained target else RE_STATUS_NOT_FOUND; sliding never reaches the gate (record-gate only), closed buckets stay readable for aggregation until the usual eviction, and the gate is outcome-neutral for DROP/ERROR so its observable teeth are exactly the ACCEPT clause. Upstream watermarks never drive window closure except join-node eviction (src/streaming/watermark.rs) - the closure wiring is a documented local composition.
