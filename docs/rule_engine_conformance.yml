    family: rete
    requirement: optional
    syntax: 'bounded runtime seam: up to eight ANDed fact-vs-literal comparisons per rule'
    expected_behavior: Maintain bounded deterministic incremental alpha/beta/token memories for up to eight fact-vs-literal comparisons joined by conjunction, one private network per eligible rule chained on the facts store without cross-rule alpha sharing; remove stale activations on lifecycle events and expose only fact-id/rule-name provenance; unsupported boolean forms use the linear evaluator with read-set-keyed zero-token activations and full RETE-UL/TMS remains unclaimed.
    upstream_refs: []
    upstream_status: not_applicable
    local_status: verified_local
    implementation_ref: engine/src/rule_engine/rete.c
    test_ref: [engine/tests/test_rule_engine_rete_incremental.c, engine/tests/test_rule_engine_agenda.c]
    doc_ref: docs/Rule_Engine_Architecture.md
  - id: recognize-act-cycle
    family: rete
    requirement: optional
    syntax: 're_engine_run(engine, facts, options, callbacks);'
    expected_behavior: Loop recompute, refraction-deduped agenda push, pop-highest, and fire until the agenda empties, a limit is reached, or cancellation is requested; refraction keys combine rule, premise slots, and value fingerprints, pop-time revalidation discards stale activations without mark_fired, per-rule RETE networks chained on the facts store cover every eligible rule (up to eight ANDed fact-vs-literal comparisons), and a zero-token fallback keys activations by the condition read-set for conditions the alpha memories cannot see.
    upstream_refs: [src/engine/engine.rs, src/rete/agenda.rs]
    upstream_status: verified_upstream
    local_status: verified_local
    implementation_ref: [engine/src/rule_engine/engine.c, engine/src/rule_engine/agenda.c]
    test_ref: engine/tests/test_rule_engine_agenda.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: value_fingerprint_refraction; timestep_free_fired_keys; pop_time_revalidation; per_rule_networks_no_cross_rule_alpha_sharing; max_activations_tracked_cap
    note: Value fingerprints FNV-hash premise content; a collision can theoretically miss a refire, doubles hash raw bits, and NULL/UNKNOWN/NONE/structured values mix only the type tag. Fired keys persist per run (and across runs in persistent mode until a premise change), so an A->B->A value round trip within one run does not refire, and linear self-rewrite rules loop until max_firings (default 1024).
  - id: persistent-agenda-inspection
    family: rete
    requirement: optional
    syntax: 're_engine_set_agenda_persistent(engine, 1); re_agenda_peek(agenda, 0, &entry);'
    expected_behavior: Provide a lazily created engine-owned agenda whose pending count and peek (salience descending, activation sequence ascending, true generation-safe premise ids) reflect the recognize-act cycle; with persistence enabled, pending activations and fired refraction keys survive OK, LIMIT, and CANCELLED run exits until a program install resets the agenda, and re_agenda_destroy is a documented no-op for the engine-owned instance.
    upstream_refs: [src/rete/agenda.rs, docs/core-features/FEATURES.md]
    upstream_status: verified_upstream
    local_status: verified_local
    extension_abi: RE_EXTENSION_AGENDA_RETE
    implementation_ref: [engine/src/rule_engine/engine.c, engine/src/rule_engine/agenda.c, engine/src/rule_engine/extensions.c]
    test_ref: engine/tests/test_rule_engine_agenda.c
    doc_ref: docs/Rule_Engine_Design.md
    parity: bounded_behavior
    behavior_scope: pending_and_fired_survive_run_exits; install_resets_agenda; abi_minor_3; capability_advertised_with_attached_networks
    note: re_engine_agenda takes a non-const engine because creation is lazy; re_agenda_entry_t.rule_name borrows the installed program's storage; peek is O(n^2) bounded by max_activations_tracked (zero selects the 1024 default).
