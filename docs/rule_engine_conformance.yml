    note: The sync hiredis adapter (redis_provider.c, compiled only with RE_HAS_HIREDIS) mirrors the in-memory provider vtable with "<prefix>:<name>" keys, raw-byte values (type tag plus payload), and PSETEX/SET/GET/DEL/PTTL with millisecond TTL; it configures through RE_REDIS_URL (default redis://127.0.0.1:6379) with fixed prefix "re" because the v1 options carry no connection field, and reports failures as RE_PROVIDER_ERROR_UNAVAILABLE via last_error. Runtime-verified 2026-08-31 - with hiredis v1.4.1 scratch-built for the MSVC ABI and the two tracked enablement fixes (redis_provider.c includes <winsock2.h> before hiredis.h on _WIN32 for the complete struct timeval; the RULE_ENGINE_ENABLE_REDIS block links ws2_32 under WIN32), the pristine-hiredis probe tree build-redis-probe ran redis_roundtrip_when_service_available OK against the live Redis 8.10.1 at 127.0.0.1:6379 with RE_TEST_REDIS_URL=redis://127.0.0.1:6379 - 48/48 with and without the URL, clean SKIP without (verbatim evidence in .superpowers/sdd/2026-08-29-rule-engine-full-parity/redis-enablement-report.md). The disabled-build boundary stays test-locked and the runtime roundtrip stays skip-guarded by RE_TEST_REDIS_URL; hiredis discovery alone is not runtime evidence. D3 re-probe 2026-08-31 (verbatim evidence in .superpowers/sdd/2026-08-29-rule-engine-full-parity/task-d3-report.md) - a genuine Redis 8.10.1 service (MSYS2 Windows build, ~5.5-day uptime) answers PING at 127.0.0.1:6379, refuting an earlier same-day controller probe that recorded no service - but the hiredis development files are absent in every probed location (PATH, mingw include/lib roots, a VCPKG_ROOT with no installed/ tree, the Redis install tree itself, no vendored repo copy), so RULE_ENGINE_ENABLE_REDIS=ON force-disabled at configure time ("no fallback", engine/CMakeLists.txt:736-759) then; the blocker was the absent client, not the service. Service availability is time-dependent and must be re-probed before any re-run - the RE_TEST_REDIS_URL skip guard stays the CI path.
