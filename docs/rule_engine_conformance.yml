    note: The new-smoke count is 3 by verification, not omission - every other family shape already carries an end-to-end pin named in the mapping table, and duplicating pinned behavior is prohibited. Locked local bounds the mapping records explicitly - upstream's arbitrary bare then ActionName(...) spelling is a parse error for non-whitelisted names (test_rule_engine_grl_surface.c unknown_bare_action_call_stays_a_parse_error; the ex03 smoke exercises the re_engine_register_function expression dispatch instead), and the backward condition matcher reads flat fact names only with no dotted object traversal while the forward matcher walks (the ex09 smoke uses flat keys - upstream.yml backward-queries-unification-negation-aggregation row).
conformance_statement: Locally verified rows are limited to the focused test cases in engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_rete_incremental.c, engine/tests/test_rule_engine_transactions.c, engine/tests/test_rule_engine_backward.c, engine/tests/test_rule_engine_backward_bindings.c, engine/tests/test_rule_engine_backward_deep_chain.c, engine/tests/test_rule_engine_backward_ext.c, engine/tests/test_backward_machine_structure.c, engine/tests/test_backward_machine_context.c, engine/tests/test_rule_engine_grl_semantics.c, engine/tests/test_rule_engine_grl_surface.c, engine/tests/test_rule_engine_query_blocks.c, engine/tests/test_rule_engine_agenda.c, engine/tests/test_rule_engine_stream_ext.c, engine/tests/test_rule_engine_stream_grl.c, engine/tests/test_rule_engine_stream_eval.c, engine/tests/test_rule_engine_plugin_parity.c, and engine/tests/test_rule_engine_example_coverage.c plus separately named streaming, provider, fuzz-smoke, executor-stress, and C99 consumer evidence. The backward-chaining row covers the deliberately narrow bounded query seam with recursive goal traversal, literal/propagated formal-actual binding, nested goal operands, registered custom-function operands, cycle detection, deterministic alternative-rule enumeration, immutable proof ownership transferred by query_next, deterministic immediate trace-parent node/edge storage for each independent derivation, and mutation invalidation of remaining proofs; the query-negation, query-aggregation, search-strategies, and shared-proof-graph rows cover the Phase 3 extensions (prefix NOT negation-as-failure, bounded query aggregation, DFS/BFS/iterative-deepening strategy selection, and the 64-entry clear-all proof result cache). Sub-project B (2026-08-29) adds the tms-explicit-logical-coexistence, backward-qvar-unification, and agenda-focus-stack-and-auto-focus rows and upgrades the shared-proof-graph row to real node/premise shape with per-premise invalidation and stats_v2; the upstream-vapor-rete-ul-and-dead-integration row records the upstream vapor findings (no cross-rule RETE machinery, dead Unifier integration, dead integrated proof caching, stub parallel actions) that are documented and not replicated per the evidence rule. Sub-project C (2026-08-30) adds the stream-analytics, grl-stream-syntax, stream-joins, and stream-rule-evaluation rows, extends the streaming-windows row with the count-distinct/stddev/percentile kinds and the watermark_drives_closure flag, and reworks the full-streaming-patterns known_gaps row to the delivered tested state; the upstream-vapor-streaming-join-operators-topology row records the streaming vapor findings (parsed-but-unconsumed GRL && join grammar, the operators.rs offline fluent API, and the tokio channel/RwLock topology not applicable to the single-threaded contract) that are documented and not replicated per the evidence rule. Sub-project D (2026-08-31) adds the plugin-pure-helpers row (the pure upstream plugin helpers delivered as name-dispatched built-ins behind the host override-first registry; date family and metadata vapor documented out) and the example-family-coverage row (the 29 manifest examples plus the auto-discovered session_window_demo mapped per family with three new smokes), promotes the upstream-manifest plugins row to the delivered state, records the D3 Redis probe evidence on the streaming-redis-state row, and reworks the upstream all-features row to the CMake option-set mapping. Arbitrary predicate unification (structured terms, occurs check, union-find), shared-subgraph proof provenance, cross-rule RETE-UL (upstream vapor), general multi-rule producer inference beyond rule-fired derivations, general backward chaining, and sequence-pattern CEP beyond pair correlation remain unsupported; native Redis is an optional compile-gated adapter whose disabled-build boundary is verified and whose runtime roundtrip is unverified on the current host (D3 2026-08-31 - a live Redis 8.10.1 service exists at 127.0.0.1:6379 but the hiredis client dev files are absent, so the roundtrip stays compiled out).
inventory_manifest: docs/rule_engine_upstream.yml
classification_policy:
  evidence_rule: A declaration, header, CMake option, or upstream documentation claim never promotes a local capability without an implementation reference and executed local test reference.
  exact_parity: Use only where the observable upstream semantics and contract are tested locally without a bounded restriction.
  equivalent_behavior: Use where C99 implementation differs internally or at the ABI boundary but preserves the tested observable contract.
  bounded_behavior: Use for deliberately narrower local slices; never report these as exact parity.
  statuses: [implemented, tested, pending, unsupported, optional_backend, blocked]
known_gaps:
  - {id: canonical-ir, status: implemented, upstream_refs: [src/rete/network.rs, RETE_ARCHITECTURE.md], local_refs: [engine/src/rule_engine/ir.h, engine/src/rule_engine/ir.c, engine/src/rule_engine/ir_validate.c], local_tests: [engine/tests/test_rule_engine_ir.c], parity: bounded_behavior, note: "Private immutable compiled IR covers the tested rule, expression, term, action, module, bounded source-envelope span, validation, and transactional-install boundary; forward evaluation uses the IR."}
  - {id: grl-string-operators-append-and-bounded-in, status: tested, upstream_refs: [docs/core-features/GRL_SYNTAX.md, src/types.rs, CHANGELOG.md:1.19.0, CHANGELOG.md:1.15.0], local_refs: [engine/src/rule_engine/parser.c, engine/src/rule_engine/ir.h, engine/src/rule_engine/ir_eval.c, engine/src/rule_engine/engine.c, engine/src/rule_engine/values.c], local_tests: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_ir.c], parity: bounded_behavior, note: "Forward IR supports contains, startsWith, endsWith, matches, += array append, and bounded membership against literal arrays or structured arrays containing scalar members. Literal arrays are capped at 64 elements; typed equality is used and malformed/non-array RHS values are rejected. Full upstream collection semantics remain pending; bounded then-action method calls and nested property writes are verified in the grl-method-calls and nested-property-access rows."}
  - {id: forall-and-general-exists-forms, status: tested, upstream_refs: [docs/core-features/GRL_SYNTAX.md, src/rete/pattern.rs, src/rete/pattern_matcher.rs], local_refs: [engine/src/rule_engine/parser.c, engine/src/rule_engine/ir.h, engine/src/rule_engine/ir_eval.c, engine/src/rule_engine/values.c], local_tests: [engine/tests/test_rule_engine_ir.c, engine/tests/test_rule_engine_forall_limits.c, engine/tests/test_rule_engine_grl_surface.c, engine/tests/test_rule_engine_backward_ext.c], parity: bounded_behavior, note: "Implemented as the grl-general-quantifiers feature row: general parenthesized !/exists/forall with arbitrary inner boolean expressions, prefix-heuristic candidate iteration (D7), per-candidate rebinding and NOT_FOUND absorption, vacuous-true forall (D6), and a plain-store fallback for undotted inner expressions. Divergences and bounds (exists-disambiguation, RETE/backward exclusion) are documented on that row and in docs/Rule_Engine_Design.md; the historical narrow array-fact forall slice keeps its test_rule_engine_forall_limits.c coverage. RETE-UL quantifier nodes remain unclaimed (linear evaluation only)."}
  - {id: rete-ul-tms-persistent-agenda, status: tested, upstream_refs: [src/rete/network.rs, src/rete/tms.rs, src/rete/agenda.rs], local_refs: [engine/src/rule_engine/rete.c, engine/src/rule_engine/engine.c, engine/src/rule_engine/agenda.c, engine/src/rule_engine/tms.c, engine/src/rule_engine/parser.c], local_tests: [engine/tests/test_rule_engine_rete_incremental.c, engine/tests/test_rule_engine_agenda.c, engine/tests/test_rule_engine_tms.c], parity: bounded_behavior, note: "Delivered state (sub-project B): TMS parity at the upstream test slice (explicit/logical coexistence, multi-justification survival, cascade/diamond retraction - tms-explicit-logical-coexistence row), the agenda focus stack with push-on-ActivateAgendaGroup/pop-on-exhaustion plus the auto-focus attribute (agenda-focus-stack-and-auto-focus row), and the bounded persistent agenda with value-fingerprint refraction stay verified_local; the design still runs one private RETE network per eligible rule chained on the facts store with no cross-rule alpha sharing. Full RETE-UL is upstream vapor (no shared alpha/beta machinery exists in any upstream execution path - upstream-vapor-rete-ul-and-dead-integration row), documented and not replicated per the evidence rule; general multi-rule producer inference remains unsupported."}
  - {id: backward-arbitrary-unification-proof-sharing, status: tested, upstream_refs: [src/backward/unification.rs, src/backward/proof_graph.rs], local_refs: [engine/src/rule_engine/backward.c, engine/src/rule_engine/backward_machine_bind.c, engine/src/rule_engine/proof_graph.c], local_tests: [engine/tests/test_rule_engine_backward_bindings.c, engine/tests/test_rule_engine_backward_ext.c], parity: bounded_behavior, note: "Delivered state (sub-project B): bounded ?var unification per the upstream case table (sticky-consistent, no occurs check, no deferral, one-directional aliases - backward-qvar-unification row) and the shared proof graph upgraded to real node/premise shape with premise capture, per-premise invalidation over a generation fast path, and struct_size-versioned stats_v2 (shared-proof-graph row). Arbitrary predicate unification (structured terms, occurs check, union-find) remains unsupported; upstream's own Unifier is dead code (never called by its search) and its integrated proof-graph caching is dead (fresh graph per query plus an insert/lookup key mismatch), so the semantics are mapped onto the local machine rather than ported - upstream-vapor-rete-ul-and-dead-integration row."}
  - {id: full-streaming-patterns, status: tested, upstream_refs: [src/rete/stream_alpha_node.rs, src/streaming/operators.rs, src/streaming/watermark.rs, src/rete/stream_join_node.rs, src/streaming/aggregator.rs, src/streaming/engine.rs, src/parser/grl/stream_syntax.rs], local_refs: [engine/src/rule_engine/tumbling_session.c, engine/src/rule_engine/stream_correlation.c, engine/src/rule_engine/stream_analytics.c, engine/src/rule_engine/stream_join.c, engine/src/rule_engine/stream_eval.c, engine/src/rule_engine/extensions.c, engine/src/rule_engine/ir_eval.c, engine/src/rule_engine/parser.c], local_tests: [engine/tests/test_rule_engine.c, engine/tests/test_rule_engine_stream_ext.c, engine/tests/test_rule_engine_stream_grl.c, engine/tests/test_rule_engine_stream_eval.c, engine/tests/rule_engine_fuzz_smoke.c], parity: bounded_behavior, note: "Delivered state (sub-project C): windows with the appended count-distinct/stddev/percentile kinds and watermark-driven closure (streaming-windows row), the StreamAnalytics TTL-cache/moving-average/anomaly/trend surface (stream-analytics row), the four-type three-strategy cross-stream join with exactly-once outer emission on watermark pass (stream-joins row), the GRL stream-pattern CE incl. the session local extension (grl-stream-syntax row), and the engine stream registry with fact injection plus stream CE evaluation (stream-rule-evaluation row) are all verified_local. Sequence-pattern CEP beyond pair correlation stays bounded - upstream itself has no live sequence matcher; the GRL && join grammar (parsed-but-unconsumed upstream), the operators.rs offline fluent API, and the tokio channel/RwLock topology are vapor or not applicable and are documented in the upstream-vapor-streaming-join-operators-topology row."}
  - {id: native-redis, status: optional_backend, upstream_refs: ['Cargo.toml:[features].streaming-redis', docs/advanced-features/REDIS_STATE_BACKEND.md], local_refs: [engine/CMakeLists.txt:736-759, engine/src/rule_engine/redis_provider.c], local_tests: [engine/tests/test_rule_engine_stream_ext.c], parity: bounded_behavior, note: "Native adapter compiles into rule_engine_core only when RULE_ENGINE_ENABLE_REDIS is ON and CMake discovers hiredis (defining RE_HAS_HIREDIS); a missing client force-disables the option with a STATUS message - no silent fallback, no hard error - and RE_STATE_PROVIDER_REDIS keeps returning RE_STATUS_NOT_SUPPORTED without the macro. D3 re-probe 2026-08-31 found a genuine Redis 8.10.1 service (MSYS2 build) live at 127.0.0.1:6379 but the hiredis development files absent in every probed location; later the same day the adapter was runtime-verified - with hiredis v1.4.1 scratch-built for the MSVC ABI and the two tracked enablement fixes (winsock2 include in redis_provider.c, ws2_32 linked under WIN32), the pristine-hiredis probe tree build-redis-probe executed redis_roundtrip_when_service_available OK against the live service under RE_TEST_REDIS_URL, 48/48 with and without the URL (verbatim evidence in .superpowers/sdd/2026-08-29-rule-engine-full-parity/redis-enablement-report.md). The roundtrip test remains RE_TEST_REDIS_URL skip-guarded (compiled out without RE_HAS_HIREDIS); service availability is time-dependent - re-probe before any re-run; the skip guard stays the CI path. hiredis detection alone is not runtime evidence."}
  - {id: grl-syntax-sweep-upstream-absent-constructs, status: tested, upstream_refs: [docs/core-features/GRL_SYNTAX.md, src/parser/grl.rs, src/engine/rule.rs], local_refs: [engine/src/rule_engine/parser.c], local_tests: [engine/tests/test_rule_engine_grl_surface.c], parity: bounded_behavior, note: "Final syntax sweep dispositions (Task A10): block comments /* */ are doc-claimed but not implemented upstream (grl.rs clean_text strips only full //-prefixed lines inside when-clauses) and the local parser has no comment syntax at all - both forms are parse errors; the enabled rule attribute is a struct-only field upstream (rule.rs) with no GRL form (local parse error); object literals {k: v} and index syntax a[0] appear in the upstream doc's type and nested-access sections without parser support on either side (upstream index/slice exist only in the RETE multifield Rust API, not the GRL grammar). The rejections are locked by syntax_sweep_unsupported_constructs_parse_error."}
