    parity: bounded_behavior
    behavior_scope: condition_read_set_only; root_anchored_dotted_target_justification; executor_parallel_path_captures_no_read_set
    note: Dotted-target justification anchors on the root fact, so cascade retraction removes the root (a documented bound); RE_COMPARE_IN fact-operand reads are not in the read-set, structured-root premises mix only the type tag into fingerprints (member-only changes do not re-activate linear rules), and a dotted-target transitive cycle can surface RE_STATUS_LIMIT from the TMS dependency check.
  - id: grl-method-calls
    family: core-grl
    requirement: optional
    syntax: '$Customer.setScore(Score + 1); $Customer.getScore();'
    expected_behavior: In then actions, $Fact.method(args) applies the bounded set/get/reset/update conventions against the receiver's structured object or dispatches to a registered function named "Fact.method" then "method", failing with RE_STATUS_NOT_SUPPORTED when neither exists; $ outside a then method call is a parse error, and when conditions keep bare-identifier registered-function dispatch only.
