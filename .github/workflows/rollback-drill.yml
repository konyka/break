name: Rollback drill

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to roll back to (e.g. v1.4.2)"
        required: true
        type: string

jobs:
  rollback-verify:
    name: Build previous tag (rollback rehearsal)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify tag signature exists
        run: git tag -v "${{ inputs.tag }}"
      - name: Restore apt package cache
        # R682: .debs a previous run downloaded; apt only fetches what is
        # missing, so a slow Azure mirror (R677-R681: stalls on varied
        # packages) is only hit on a cache miss. GitHub's own action, no
        # third-party dependency. The key changes with the workflow file,
        # i.e. whenever a package list or pin changes.
        uses: actions/cache@v5
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-rollback-verify-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-rollback-verify-

      - name: Install pinned toolchain
        timeout-minutes: 20
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 -o Dir::Cache::Archives=$HOME/apt-archives -o Binary::apt::APT::Keep-Downloaded-Packages=true"
          # R675: each attempt is capped and retried -- a hung mirror otherwise
          # ate the whole step (R674 run: one job timed out at 10 min while
          # every other job installed in ~1 min). man-db triggers are skipped.
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p "$HOME/apt-archives/partial"; sudo rm -f /etc/apt/apt.conf.d/docker-clean
          # R677: each failed attempt publishes the tail of its output as
          # ::warning:: annotations (job logs are not readable anonymously).
          # R676: usage apt_retry <seconds-per-attempt> <apt-get args>. A failed
          # attempt moves the runner off its Azure mirror to archive.ubuntu.com
          # (R675 run: three 240 s attempts on the same stalled mirror).
          apt_retry() { t=$1; shift; for i in 1 2 3; do if ( set -o pipefail; sudo timeout "$t" apt-get $APT_OPTS "$@" 2>&1 | tee /tmp/apt-attempt.log ); then return 0; fi; echo "::warning::apt-get $1 attempt $i failed or timed out after ${t}s; last output:"; tail -8 /tmp/apt-attempt.log | while IFS= read -r l; do echo "::warning::  $l"; done; sudo sed -i "s#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo dpkg --configure -a || true; [ "$1" = install ] && sudo timeout 120 apt-get $APT_OPTS update || true; sleep 5; done; return 1; }
          apt_retry 120 update
          apt_retry 360 install -y --no-install-recommends \
            clang-18 lld-18 cmake=3.28.* ninja-build libx11-dev libxrandr-dev \
            libfreetype6-dev fonts-noto-cjk
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives" || true  # R682: readable by the cache save
      - name: Configure / build / headless test
        run: |
          cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=clang-18 -DCMAKE_BUILD_TYPE=Release -DENGINE_RHI_BACKEND=opengl
          cmake --build build --parallel
          ctest --test-dir build -LE "graphics|fuzz" --output-on-failure
      - name: Report
        run: echo "rollback drill OK for tag ${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
