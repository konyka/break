name: ci-image

# Builds and publishes the Linux CI base image (.github/docker/ci-linux.Dockerfile)
# to GHCR. The Linux lanes in ci.yml run inside it so they no longer depend on
# Ubuntu's package mirror at job time.
#
# Tags: `latest` (what ci.yml pulls), plus the commit sha for traceability.
# The Dockerfile pins the same apt versions as the old per-job installs.

on:
  push:
    branches: [master]
    paths:
      - ".github/docker/**"
      - ".github/workflows/ci-image.yml"
  schedule:
    - cron: "41 2 * * 0"   # weekly, Sunday 02:41 UTC: security updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/break-ci-linux

jobs:
  build:
    name: Build and push ci-linux image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          file: .github/docker/ci-linux.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm "$IMAGE:latest" bash -c '
            set -e
            cmake --version | head -1
            clang-18 --version | head -1
            gcc --version | head -1
            ninja --version
            xvfb-run --help >/dev/null 2>&1 || command -v Xvfb
            command -v weston wayland-scanner glslangValidator >/dev/null 2>&1 || command -v weston
            test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc || ls /usr/share/fonts | head -3
            dpkg -s libvulkan-dev | grep ^Version
            dpkg -s libshaderc-dev | grep ^Version
            dpkg -s libssl-dev | grep ^Version
            test -f /usr/include/openssl/evp.h
          '
