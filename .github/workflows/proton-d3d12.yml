name: proton-d3d12
on:
  workflow_run:
    workflows: [windows-d3d12]
    types: [completed]
jobs:
  proton-compat:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-d3d12-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Install Wine + vkd3d-proton
        timeout-minutes: 20
        # vkd3d-proton is not in the Ubuntu archive (apt exit 100); install
        # wine64 from apt and the pinned upstream vkd3d-proton release
        # tarball instead.
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          # R675: each attempt is capped and retried -- a hung mirror otherwise
          # ate the whole step (R674 run: one job timed out at 10 min while
          # every other job installed in ~1 min). man-db triggers are skipped.
          sudo rm -f /var/lib/man-db/auto-update
          # R676: usage apt_retry <seconds-per-attempt> <apt-get args>. A failed
          # attempt moves the runner off its Azure mirror to archive.ubuntu.com
          # (R675 run: three 240 s attempts on the same stalled mirror).
          apt_retry() { t=$1; shift; for i in 1 2 3; do sudo timeout "$t" apt-get $APT_OPTS "$@" && return 0; echo "apt-get $1: attempt $i failed or timed out"; sudo sed -i "s#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo dpkg --configure -a || true; [ "$1" = install ] && sudo timeout 120 apt-get $APT_OPTS update || true; sleep 5; done; return 1; }
          sudo dpkg --add-architecture i386
          apt_retry 120 update
          apt_retry 360 install -y wine wine64 zstd
          curl -sSL -o /tmp/vkd3d-proton.tar.zst \
            https://github.com/HansKristian-Work/vkd3d-proton/releases/download/v3.0.1/vkd3d-proton-3.0.1.tar.zst
          tar -C /tmp --zstd -xf /tmp/vkd3d-proton.tar.zst
      - name: Run d3d12 contract suite under Proton/vkd3d
        run: |
          # Compatibility evidence only — never counted toward the
          # Windows-native D3D12 evidence levels (spec §2.1 risk register).
          # vkd3d-proton implements D3D12 as d3d12.dll/d3d12core.dll on
          # Vulkan; place the 64-bit build next to the contract executables.
          # set +e: Actions bash runs with -e, and a GPU-less runner makes
          # the contracts exit 77 (SKIP) — that must not fail this lane.
          set +e
          WINE="$(command -v wine64 || command -v wine || echo /usr/lib/wine/wine64)"
          echo "wine: $WINE"; "$WINE" --version
          cp /tmp/vkd3d-proton-3.0.1/x64/d3d12.dll /tmp/vkd3d-proton-3.0.1/x64/d3d12core.dll .
          "$WINE" test_d3d12_device_contract.exe; echo "device_contract=$?"
          "$WINE" test_d3d12_pipeline_contract.exe; echo "pipeline_contract=$?"
          exit 0
      - name: Record compat receipt
        run: |
          echo '{"schema_version":1,"lane":"proton-d3d12","note":"compat verification only; not Windows-native evidence"}' \
            > proton-d3d12-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: proton-d3d12-receipt
          path: proton-d3d12-receipt.json
