            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -R test_platform_wayland_runtime (weston headless backend, GL)" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-native-surface-wayland-gl
          path: receipt.json

  lane-native-surface-win32:
    # 自 windows-clang 拆出（brief :159）：仅 win32 runtime trio 的 native-surface
    # 证据 lane；headless 全量（含同一步 win32 trio）仍在 lane-headless-windows-clang。
    name: Windows + Clang (win32 native surface)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Fetch Agility SDK (pinned)
        run: cmake -P engine/tools/fetch_d3d12_agility_sdk.cmake

      - name: Add Windows SDK dxc to PATH
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { Write-Error "dxc.exe not found in the installed Windows SDKs"; exit 1 }
          Add-Content $env:GITHUB_PATH $dxc.Directory.FullName

      - name: Fetch and install Vulkan SDK (pinned)
        run: cmake -P engine/tools/fetch_vulkan_sdk_windows.cmake

      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DENGINE_VULKAN=ON

      - name: Test Win32 platform runtime
        run: |
          cmake --build build --parallel --target test_platform_config test_platform_null_safety test_platform_win32_runtime
          ctest --test-dir build --output-on-failure -R '^(test_platform_config|test_platform_null_safety|test_platform_win32_runtime)$'

      - name: Emit evidence receipt
        if: always()
        shell: bash
        run: |
          lvl=NATIVE_SURFACE
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=windows -DBACKEND=vulkan \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -R test_platform_win32_runtime (win32 runtime trio)" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-native-surface-win32
          path: receipt.json

  lane-native-surface-cocoa:
    # 原 macos-vulkan（brief :160）：test_platform_cocoa_runtime 的 native-surface
    # 证据；MoltenVK 后端（schema backend=vulkan-moltenvk）。
    name: macOS Cocoa + MoltenVK (Clang)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        # spirv-cross: test_rhi_backend_selection (headless suite) asserts the
        # metal selector configures successfully on APPLE; that nested
        # configure fail-closes on the missing MSL toolchain
        # (find_program spirv-cross REQUIRED in engine/CMakeLists.txt).
        run: brew install molten-vk vulkan-headers shaderc spirv-cross freetype

      - name: Configure
        run: |
          # The brew molten-vk keg ships libMoltenVK.dylib only — there is no
          # libvulkan.dylib in it (the historical path this job passed made
          # make fail instantly with "No rule to make target"; CMake does not
          # validate an explicit Vulkan_LIBRARY cache value at configure
          # time). Link the MoltenVK dylib directly: it exports the full
          # Vulkan API entry points.
          VULKAN_LIB="$(brew --prefix molten-vk)/lib/libMoltenVK.dylib"
          test -f "$VULKAN_LIB" || echo "::error::MoltenVK dylib not found at $VULKAN_LIB"
          VULKAN_HEADERS="$(brew --prefix vulkan-headers)"
          SHADERC_LIB="$(brew --prefix shaderc)/lib/libshaderc_shared.dylib"
          SHADERC_INCLUDE_DIR="$(brew --prefix shaderc)/include"
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Debug \
            -DENGINE_VULKAN=ON \
            -DCMAKE_C_FLAGS="-I$SHADERC_INCLUDE_DIR" \
            -DVulkan_LIBRARY="$VULKAN_LIB" \
            -DVulkan_INCLUDE_DIR="$VULKAN_HEADERS/include" \
            -DSHADERC_LIB:PATH="$SHADERC_LIB" \
            -DSHADERC_INCLUDE_DIR:PATH="$SHADERC_INCLUDE_DIR"
          # Diagnostics surfaced as annotations (logs need auth to read):
          # the actual brew shaderc layout and the cached CMake value.
          echo "::warning::shaderc prefix: $(brew --prefix shaderc)"
          find -H "$(brew --prefix shaderc)" -name "shaderc.h" 2>/dev/null | head -3 \
            | while IFS= read -r f; do echo "::warning::shaderc header at: $f"; done
          grep -m 1 "SHADERC_INCLUDE_DIR:" build/CMakeCache.txt \
            | while IFS= read -r line; do echo "::warning::cmake cache: $line"; done
          printf '#include <shaderc/shaderc.h>\nint main(void){return 0;}\n' > /tmp/sc_probe.c
          if cc -c /tmp/sc_probe.c -I"$SHADERC_INCLUDE_DIR" -o /tmp/sc_probe.o 2>/dev/null; then
            echo "::warning::shaderc header probe: COMPILES"
          else
            echo "::error::shaderc header probe FAILED for -I$SHADERC_INCLUDE_DIR"
          fi
          ls "$SHADERC_INCLUDE_DIR" 2>&1 | head -5 \
            | while IFS= read -r f; do echo "::warning::include dir entry: $f"; done
          # Definitive: generate engine's compile flags (no compilation) and
          # dump the include list. This runs in Configure, before any build
          # failure can short-circuit later steps.
          (cd build && make CMakeFiles/engine.dir/flags.make >/dev/null 2>&1 || true)
          FM="build/CMakeFiles/engine.dir/flags.make"
          if [ -f "$FM" ]; then
            echo "::warning::engine flags shaderc count: $(grep -c shaderc "$FM")"
            grep -m 1 "C_INCLUDES" "$FM" | head -c 250 \
              | while IFS= read -r c; do echo "::warning::engine C_INCLUDES: $c"; done
          else
            echo "::warning::engine flags.make MISSING at $FM"
            find build -name flags.make | head -5 | while IFS= read -r f; do echo "::warning::flags.make found: $f"; done
          fi

      - name: Build Break myui demo
        run: |
          set -o pipefail
          cmake --build build --target dxx_break --parallel "$(sysctl -n hw.ncpu)" 2>&1 | tee /tmp/macos_build.log || {
            echo "::error::macOS dxx_break build failed; first diagnostics:"
            grep -m 5 -E "error:|fatal error:|No rule to make target|Cannot find|ld: " /tmp/macos_build.log \
              | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Build and test Cocoa runtime
        run: |
          set -o pipefail
          # Full build: the headless suite below runs every non-graphics test,
          # so all test executables must exist (the dxx_break-only build above
          # leaves ctest with "(Not Run)" entries for every other test).
          cmake --build build --parallel "$(sysctl -n hw.ncpu)" -- VERBOSE=1 2>&1 | tee /tmp/macos_full.log || {
            # ld warnings match "ld: " and would eat the -m budget, so
            # compiler errors are surfaced first.
            grep -m 8 -E "error:|fatal error:" /tmp/macos_full.log \
              | while IFS= read -r line; do echo "::error::${line}"; done
            grep -m 3 -E "No rule to make target|Undefined symbols|ld: (framework|library) " /tmp/macos_full.log \
              | while IFS= read -r line; do echo "::error::${line}"; done
            # Which target owns the failing rhi_vk.c compile? The object path
            # encodes it: CMakeFiles/<target>.dir/...
            grep -m 1 -o "CMakeFiles/[^/]*/[^ ]*rhi_vk\.c\.o" /tmp/macos_full.log \
              | while IFS= read -r t; do echo "::error::rhi_vk object target: $t"; done
            FM=$(find build -name flags.make -path "*engine.dir*" 2>/dev/null | head -1)
            echo "::warning::engine flags.make at: ${FM:-NOT FOUND}"
            if [ -n "$FM" ]; then
              echo "::warning::shaderc occurrences in engine flags: $(grep -c shaderc "$FM")"
            fi
            exit 1
          }
          ctest --test-dir build --output-on-failure -R '^(test_platform_config|test_platform_null_safety|test_platform_cocoa_runtime)$' 2>&1 | tee /tmp/macos_cocoa_test.log || {
            echo "::error::macOS Cocoa runtime test failures:"
            grep -m 5 -E "\(Failed\)|\(Not Run\)|\(Timeout\)" /tmp/macos_cocoa_test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Test (headless suite)
        run: |
          set -o pipefail
          # GitHub macOS runners have no Metal window session: MoltenVK
          # raises an NSException from inside vkCreateInstance (and from its
          # own load-time background work) that terminates the process with
          # SIGABRT before C code can observe an error. The two tests that
          # link MoltenVK honor this marker and skip with a printed reason;
          # a local macOS machine with a GPU runs them in full.
          export BREAK_MYUI_SKIP_VK_SENSITIVE=1
          ctest --test-dir build -LE "graphics|fuzz|gpu|audio_device" --output-on-failure 2>&1 | tee /tmp/macos_headless.log || {
            # Surface which tests failed first — the vgcanvas tail below is
            # only a supplementary dump, not a failure identifier.
            grep -E "\(Failed\)|\(Timeout\)|\(Not Run\)|FAIL:|CMake Error" /tmp/macos_headless.log | head -30 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            t=test_myui_vgcanvas_backend
            if [ -x "build/$t" ]; then
              echo "::error::final output lines $t (unfiltered tail):"
              ( cd build && ./"$t" 2>&1 || true ) | tail -8 \
                | while IFS= read -r line; do echo "::error::${line}"; done
            fi
            exit 1
          }

      - name: Emit evidence receipt
        if: always()
        run: |
          lvl=NATIVE_SURFACE
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=macos -DBACKEND=vulkan-moltenvk \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -R test_platform_cocoa_runtime" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-native-surface-cocoa
          path: receipt.json

  # ---- lane: GPU-runtime（真实 GPU/软渲染 ICD 跑通帧；evidence_level=GPU_RUNTIME）----
  lane-gpu-runtime-linux-gl:
    # OpenGL 最后降级与渲染对比基准：Weston/Wayland + Mesa 软件光栅。
    name: Linux Wayland + OpenGL (GCC)
    # R680: pinned like every other Linux lane -- ubuntu-latest moves to
    # Ubuntu 26 from 2026-10-19 (runner-images#14748).
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.digest }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S engine -B build -DCMAKE_BUILD_TYPE=Debug -DENGINE_ENABLE_WAYLAND=ON -DENGINE_RHI_BACKEND=opengl

      - name: Build
        run: cmake --build build --parallel

      - name: Test (headless suite)
        run: |
          if ! ctest --test-dir build -LE "graphics|fuzz|gpu|audio_device" --output-on-failure; then
            echo '## Headless suite failures (rerun)' >> "$GITHUB_STEP_SUMMARY"
            ctest --test-dir build -LE "graphics|fuzz|gpu|audio_device" --rerun-failed --output-on-failure > /tmp/ctest-rerun.log 2>&1 || true
            grep -E "FAIL|Failed|FAILED|Not Run|LeakSanitizer|ERROR: AddressSanitizer|colored pixels|selftest|CMake Error" /tmp/ctest-rerun.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            cat /tmp/ctest-rerun.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Test Wayland/OpenGL runtime
        id: graphics
        continue-on-error: true
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=wayland-break-gl
          weston --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >/tmp/weston-gl.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" 2>/dev/null || { cat /tmp/weston-gl.log; exit 1; }
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          set +e
          out="$(ctest --test-dir build --output-on-failure -R \
            '^(test_rhi_wayland_runtime|test_mesh_gpu_gl|test_world_presentation_gl|test_mycompose_gpu_opengl)$' 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          skipped=$(printf '%s\n' "$out" | grep -c '\*\*\*Skipped' || true)
          passed=$(printf '%s\n' "$out" | grep -c '   Passed' || true)
          echo "Wayland/OpenGL execution: rc=$rc passed=$passed skipped=$skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Emit evidence receipt
        if: always()
        run: |
          rc="${{ steps.graphics.outputs.rc }}"; skipped="${{ steps.graphics.outputs.skipped }}"; passed="${{ steps.graphics.outputs.passed }}"
          : "${rc:=1}"; : "${skipped:=1}"; : "${passed:=0}"
          if [ "${{ job.status }}" != "success" ] || [ "$rc" != "0" ]; then
            lvl=UNAVAILABLE
          elif [ "$skipped" = "0" ] && [ "$passed" -gt 0 ]; then
            lvl=GPU_RUNTIME
          else
            lvl=UNAVAILABLE
          fi
          cmd="Wayland OpenGL runtime (Weston; rc=$rc passed=$passed skipped=$skipped)"
          echo "job=${{ job.status }} $cmd -> evidence_level=$lvl"
          cmake -DOUT=receipt.json -DPLATFORM=linux-wayland -DBACKEND=opengl \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="$cmd" -DBUILD_CONFIG=Debug \
            -DDEVICE_TYPE=CPU -DVENDOR_ID=0 -DDEVICE_ID=0 \
            -DGPU="mesa software rasterizer (LIBGL_ALWAYS_SOFTWARE=1)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-gpu-runtime-linux-gl
          path: receipt.json
      - name: Require executed graphics tests
        if: always()
        run: |
          test "${{ steps.graphics.outputs.rc }}" = "0"
          test "${{ steps.graphics.outputs.passed }}" -gt 0
          test "${{ steps.graphics.outputs.skipped }}" = "0"

  lane-gpu-runtime-linux-vk:
    # 钉版工具链 + lavapipe ICD；headless 全量与 Wayland graphics 同 lane 出据。
    name: Linux Wayland + Vulkan (lavapipe, Clang)
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.digest }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        # runner 的 toolcache cmake (/usr/local/bin) 会遮蔽 apt 钉版的
        # /usr/bin/cmake；前置 /usr/bin 让 cmake=3.28.* 钉版真实生效。
        run: |
          export PATH="/usr/bin:$PATH"
          cmake --version | head -1
          cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_BUILD_TYPE=Debug -DENGINE_ENABLE_WAYLAND=ON -DENGINE_VULKAN=ON

      - name: Build
        run: |
          set -o pipefail
          # Logs need auth to read: surface the compiler errors as
          # annotations (wayland lane pattern). Link failures need the
          # "undefined reference" lines and the failing link target too.
          cmake --build build --parallel 2>&1 | tee /tmp/vk_build.log || {
            grep -m 8 -E "error:|fatal error:|undefined reference|cannot find -l|No rule to make target" /tmp/vk_build.log \
              | head -c 1500 | while IFS= read -r line; do echo "::error::${line}"; done
            grep -B4 -m 2 "collect2: error" /tmp/vk_build.log \
              | head -c 1500 | while IFS= read -r line; do echo "::error::linkctx ${line}"; done
            exit 1
          }

      - name: Test (headless suite)
        run: |
          if ! ctest --test-dir build -LE "graphics|fuzz|gpu|audio_device" --output-on-failure; then
            echo '## Headless suite failures (rerun)' >> "$GITHUB_STEP_SUMMARY"
            ctest --test-dir build -LE "graphics|fuzz|gpu|audio_device" --rerun-failed --output-on-failure > /tmp/ctest-rerun.log 2>&1 || true
            grep -E "FAIL|Failed|FAILED|Not Run|LeakSanitizer|ERROR: AddressSanitizer|colored pixels|selftest|CMake Error" /tmp/ctest-rerun.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            cat /tmp/ctest-rerun.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Test Wayland/Vulkan graphics
        id: graphics
        continue-on-error: true
        run: |
          vk_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' -print -quit)"
          test -n "$vk_icd"
          export VK_ICD_FILENAMES="$vk_icd"
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=wayland-break-vk
          weston --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >/tmp/weston-vk.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" 2>/dev/null || { cat /tmp/weston-vk.log; exit 1; }
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          set +e
          out="$(ctest --test-dir build -L graphics --output-on-failure 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          skipped=$(printf '%s\n' "$out" | grep -c '\*\*\*Skipped' || true)
          passed=$(printf '%s\n' "$out" | grep -c '   Passed' || true)
          echo "Wayland/Vulkan execution: rc=$rc passed=$passed skipped=$skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Emit evidence receipt
        if: always()
        run: |
          rc="${{ steps.graphics.outputs.rc }}"; skipped="${{ steps.graphics.outputs.skipped }}"; passed="${{ steps.graphics.outputs.passed }}"
          : "${rc:=1}"; : "${skipped:=1}"; : "${passed:=0}"
          if [ "${{ job.status }}" != "success" ] || [ "$rc" != "0" ]; then
            lvl=UNAVAILABLE
          elif [ "$skipped" = "0" ] && [ "$passed" -gt 0 ]; then
            lvl=GPU_RUNTIME
          else
            lvl=UNAVAILABLE
          fi
          cmd="Wayland Vulkan graphics (Weston + lavapipe; rc=$rc passed=$passed skipped=$skipped)"
          echo "job=${{ job.status }} $cmd -> evidence_level=$lvl"
          cmake -DOUT=receipt.json -DPLATFORM=linux-wayland -DBACKEND=vulkan \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="$cmd" -DBUILD_CONFIG=Debug \
            -DDEVICE_TYPE=CPU -DVENDOR_ID=0 -DDEVICE_ID=0 \
            -DGPU="lavapipe (software ICD via VK_ICD_FILENAMES)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-gpu-runtime-linux
          path: receipt.json
      - name: Require executed graphics tests
        if: always()
        run: |
          test "${{ steps.graphics.outputs.rc }}" = "0"
          test "${{ steps.graphics.outputs.passed }}" -gt 0
          test "${{ steps.graphics.outputs.skipped }}" = "0"

  lane-gpu-runtime-macos-metal:
    # 计划 C lane（brief :164）：GitHub hosted macOS 无 Metal GPU 窗口会话，
    # graphics 契约整体跳过（77）时收据如实降级 HEADLESS，不伪造 GPU_RUNTIME；
    # 真机/self-hosted runner 上 graphics 全绿才标 GPU_RUNTIME。
    name: macOS native Metal (Clang)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer && xcodebuild -version

      - name: Install shader toolchain
        run: brew install shaderc spirv-cross

      - name: Configure (metal)
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENGINE_RHI_BACKEND=metal -DMYUI_PAL=cocoa

      - name: Build
        run: cmake --build build --parallel

      - name: Verify metallib artifact
        run: test -s build/metal_shaders/engine.metallib && xcrun metal-nm build/metal_shaders/engine.metallib | head -5

      - name: Headless + contract tests
        # On failure, mirror the failing tests into workflow annotations:
        # this repo's log download needs elevated token rights, annotations
        # stay readable through the checks API.
        run: |
          ctest --test-dir build -LE "graphics|fuzz|gpu|audio_device" --parallel 4 --output-on-failure || {
            rc=$?
            if [ -f build/Testing/Temporary/LastTestsFailed.log ]; then
              head -10 build/Testing/Temporary/LastTestsFailed.log | while IFS= read -r t; do echo "::error::ctest failed: $t"; done
            else
              echo "::error::ctest exited $rc with no LastTestsFailed.log (no tests found?)"
              tail -5 build/Testing/Temporary/LastTest.log 2>/dev/null | while IFS= read -r l; do echo "::notice::$l"; done
            fi
            exit $rc
          }

      - name: Metal device contract (GPU when available)
        id: metal_graphics
        continue-on-error: true
        run: |
          set +e
          out="$(ctest --test-dir build -L graphics --output-on-failure 2>&1)"
          rc=$?
          printf '%s\n' "$out"
          # '   Passed' 只锚定逐测试结果行（N/M Test #x: ...   Passed），
          # 不会误计小写 'tests passed' 汇总行；'***Skipped' 是
          # SKIP_RETURN_CODE 的 ctest 标记（不影响 rc）。
          skipped=$(printf '%s\n' "$out" | grep -c '\*\*\*Skipped' || true)
          passed=$(printf '%s\n' "$out" | grep -c '   Passed' || true)
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          exit $rc   # 77 skip not fatal; GPU runners count as receipts

      - name: Emit evidence receipt
        if: always()
        run: |
          # 降级阶梯（M1）：GPU_RUNTIME=graphics 真实跑过且全过（rc=0、零
          # Skipped、≥1 Passed）；rc!=0（跑了且有失败）=UNAVAILABLE；rc=0 但
          # 全 skip（hosted 无 Metal 会话）=HEADLESS——command 字段如实区分。
          rc="${{ steps.metal_graphics.outputs.rc }}"; skipped="${{ steps.metal_graphics.outputs.skipped }}"; passed="${{ steps.metal_graphics.outputs.passed }}"
          : "${rc:=1}"; : "${skipped:=1}"; : "${passed:=0}"
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; cmd="ctest -L graphics (lane failed before graphics)"
          elif [ "$rc" != "0" ]; then lvl=UNAVAILABLE; cmd="ctest -L graphics (metal device contract failed)"
          elif [ "$skipped" = "0" ] && [ "$passed" -gt 0 ]; then lvl=GPU_RUNTIME; cmd="ctest -L graphics (metal device contract)"
          elif [ "$skipped" -gt 0 ]; then lvl=HEADLESS; cmd="ctest -L graphics (metal device contract; all skipped, no GPU session)"
          else lvl=UNAVAILABLE; cmd="ctest -L graphics (no tests matched)"; fi
          echo "job=${{ job.status }} metal graphics rc=$rc skipped=$skipped passed=$passed -> evidence_level=$lvl"
          cmake -DOUT=receipt.json -DPLATFORM=macos -DBACKEND=metal \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="$cmd" -DBUILD_CONFIG=Debug \
            -DGPU="$(system_profiler SPDisplaysDataType 2>/dev/null | grep -m1 Chipset | cut -d: -f2 | sed 's/^ *//' || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-gpu-runtime-macos-metal
          path: receipt.json

  lane-gpu-runtime-windows-d3d12:
    # 计划 D 的真机 D3D12 GPU lane（brief :165）：self-hosted windows GPU
    # runner 接单，ENABLE_GPU_LANES=1 显式开启（同 lane-benchmark-steam-deck
    # 门控；hosted 上没有 self-hosted 标签可接单，不加 if 会永久 pending）。
    # hosted WARP 下限证据在 windows-d3d12.yml（gpu=WARP，不超 GPU_RUNTIME），
    # 不在本 workflow 重复；本 lane 只在真机接单且 graphics 全绿时标
    # GPU_RUNTIME，否则收据如实标 UNAVAILABLE。
    if: vars.ENABLE_GPU_LANES == '1'
    runs-on: [self-hosted, windows, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Fetch Agility SDK (pinned)
        run: cmake -P engine/tools/fetch_d3d12_agility_sdk.cmake

      - name: Add Windows SDK dxc to PATH
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { Write-Error "dxc.exe not found in the installed Windows SDKs"; exit 1 }
          Add-Content $env:GITHUB_PATH $dxc.Directory.FullName

      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DENGINE_RHI_BACKEND=d3d12

      - name: Build
        run: cmake --build build --parallel

      - name: D3D12 graphics suite (GPU-runtime evidence)
        id: d3d12_graphics
        continue-on-error: true
        shell: bash
        env:
          ENGINE_LOCKED_DEPS_ALLOW_ABSENT: 1
        run: |
          set +e
          out="$(ctest --test-dir build -L graphics --output-on-failure 2>&1)"
          rc=$?
          printf '%s\n' "$out"
          # '   Passed' 只锚定逐测试结果行（N/M Test #x: ...   Passed），
          # 不会误计小写 'tests passed' 汇总行；'***Skipped' 是
          # SKIP_RETURN_CODE 的 ctest 标记（不影响 rc）。
          skipped=$(printf '%s\n' "$out" | grep -c '\*\*\*Skipped' || true)
          passed=$(printf '%s\n' "$out" | grep -c '   Passed' || true)
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Emit evidence receipt
        if: always()
        shell: bash
        run: |
          rc="${{ steps.d3d12_graphics.outputs.rc }}"; skipped="${{ steps.d3d12_graphics.outputs.skipped }}"; passed="${{ steps.d3d12_graphics.outputs.passed }}"
          : "${rc:=1}"; : "${skipped:=1}"; : "${passed:=0}"
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE
          elif [ "$rc" = "0" ] && [ "$skipped" = "0" ] && [ "$passed" -gt 0 ]; then lvl=GPU_RUNTIME
          else lvl=UNAVAILABLE; fi
          echo "job=${{ job.status }} d3d12 graphics rc=$rc skipped=$skipped passed=$passed -> evidence_level=$lvl"
          cmake -DOUT=receipt.json -DPLATFORM=windows -DBACKEND=d3d12 \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -L graphics (ENGINE_RHI_BACKEND=d3d12)" -DBUILD_CONFIG=Release \
            -DGPU=unknown -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-gpu-runtime-windows-d3d12
          path: receipt.json

  lane-gpu-runtime-windows-d3d12-unavailable:
    # brief :165：hosted 无 GPU 接单时如实出 UNAVAILABLE 收据。真机 lane 由
    # ENABLE_GPU_LANES 门控；变量未置值时由本常开孪生 job 出「不可得」收据
    #（<1 min，ubuntu 即可——只跑 cmake 脚本）；artifact 名与真机 lane 互斥共用。
    if: vars.ENABLE_GPU_LANES != '1'
    name: "lane: GPU-runtime (windows d3d12, unavailable receipt)"
    # R680: pinned like every other Linux lane -- ubuntu-latest moves to
    # Ubuntu 26 from 2026-10-19 (runner-images#14748).
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Emit UNAVAILABLE receipt
        run: |
          cmake -DOUT=receipt.json -DPLATFORM=windows -DBACKEND=d3d12 \
            -DEVIDENCE_LEVEL=UNAVAILABLE -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="no self-hosted windows GPU runner accepted (ENABLE_GPU_LANES unset; hosted WARP floor in windows-d3d12.yml)" \
            -DBUILD_CONFIG=Release \
            -DGPU=none -DDRIVER_VERSION=none -DCPU=none -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-gpu-runtime-windows-d3d12
          path: receipt.json

  # ---- lane: validation（validation layers + D3D12 debug layer）----
  lane-validation-linux-vk:
    name: "lane: validation (Linux Wayland, VK_LAYER_KHRONOS_validation)"
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.digest }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Configure / build
        run: |
          # 前置 /usr/bin 让 cmake=3.28.* 钉版生效（clean-room lane 先例）；
          # clang-18 显式指定（apt 只装 clang-18，无裸 clang 链接）。
          export PATH="/usr/bin:$PATH"
          cmake --version | head -1
          cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_BUILD_TYPE=Debug -DENGINE_ENABLE_WAYLAND=ON -DENGINE_VULKAN=ON
          cmake --build build --parallel

      - name: Run Wayland graphics under validation layers
        id: graphics
        continue-on-error: true
        run: |
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          vk_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' -print -quit)"
          test -n "$vk_icd"
          export VK_ICD_FILENAMES="$vk_icd"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=wayland-break-validation
          weston --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >/tmp/weston-validation.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" 2>/dev/null || { cat /tmp/weston-validation.log; exit 1; }
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          set +e
          out="$(ctest --test-dir build -L graphics --output-on-failure 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q "VUID-"; then rc=1; fi
          skipped=$(printf '%s\n' "$out" | grep -c '\*\*\*Skipped' || true)
          passed=$(printf '%s\n' "$out" | grep -c '   Passed' || true)
          echo "Wayland validation execution: rc=$rc passed=$passed skipped=$skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Emit evidence receipt
        if: always()
        run: |
          rc="${{ steps.graphics.outputs.rc }}"; skipped="${{ steps.graphics.outputs.skipped }}"; passed="${{ steps.graphics.outputs.passed }}"
          : "${rc:=1}"; : "${skipped:=1}"; : "${passed:=0}"
          if [ "${{ job.status }}" != "success" ] || [ "$rc" != "0" ]; then
            lvl=UNAVAILABLE
          elif [ "$skipped" = "0" ] && [ "$passed" -gt 0 ]; then
            lvl=GPU_RUNTIME
          else
            lvl=UNAVAILABLE
          fi
          cmd="Wayland validation (Weston + lavapipe; rc=$rc passed=$passed skipped=$skipped)"
          echo "job=${{ job.status }} $cmd -> evidence_level=$lvl"
          cmake -DOUT=receipt.json -DPLATFORM=linux-wayland -DBACKEND=vulkan \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="$cmd" -DBUILD_CONFIG=Debug \
            -DDEVICE_TYPE=CPU -DVENDOR_ID=0 -DDEVICE_ID=0 \
            -DGPU="lavapipe (software ICD via VK_ICD_FILENAMES)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-validation-linux
          path: receipt.json
      - name: Require executed graphics tests
        if: always()
        run: |
          test "${{ steps.graphics.outputs.rc }}" = "0"
          test "${{ steps.graphics.outputs.passed }}" -gt 0
          test "${{ steps.graphics.outputs.skipped }}" = "0"

  # ---- lane: benchmark（evidence_level 如实标注；lavapipe 软渲染与真 GPU 不可比）----
  lane-benchmark-linux-vk:
    name: "lane: benchmark (Linux Wayland Vulkan, lavapipe)"
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.digest }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Configure / build
        run: |
          export PATH="/usr/bin:$PATH"
          cmake --version | head -1
          # Release IPO 把 LLVM bitcode 写入 libengine.a，默认 GNU ld 链不动
          # （toolchain-clang-linux.cmake 记载的同一坑）；本 lane 无裸 clang/lld，
          # 按 -18 后缀接线等价物。
          # CMAKE_AR/RANLIB 必须绝对路径：裸名字会被当相对路径解析到
          # workspace（/bin/sh: workspace/llvm-ar-18: not found）。
          cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_AR=/usr/bin/llvm-ar-18 -DCMAKE_RANLIB=/usr/bin/llvm-ranlib-18 \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld-18" \
            -DCMAKE_BUILD_TYPE=Release -DENGINE_ENABLE_WAYLAND=ON -DENGINE_VULKAN=ON
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee /tmp/bench_build.log || {
            grep -m 8 -E "error:|fatal error:|undefined reference|cannot find -l|No rule to make target|ld: |plugin needed|multiple definition|cannot open|not found|CMake Error" /tmp/bench_build.log \
              | head -c 1500 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Run Wayland benchmark
        id: graphics
        continue-on-error: true
        run: |
          vk_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' -print -quit)"
          test -n "$vk_icd"
          export VK_ICD_FILENAMES="$vk_icd"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=wayland-break-benchmark
          weston --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >/tmp/weston-benchmark.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" 2>/dev/null || { cat /tmp/weston-benchmark.log; exit 1; }
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          set +e
          out="$(ctest --test-dir build -L benchmark --output-on-failure 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          skipped=$(printf '%s\n' "$out" | grep -c '\*\*\*Skipped' || true)
          passed=$(printf '%s\n' "$out" | grep -c '   Passed' || true)
          echo "Wayland benchmark execution: rc=$rc passed=$passed skipped=$skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Emit benchmark receipt
        if: always()
        run: |
          rc="${{ steps.graphics.outputs.rc }}"; skipped="${{ steps.graphics.outputs.skipped }}"; passed="${{ steps.graphics.outputs.passed }}"
          : "${rc:=1}"; : "${skipped:=1}"; : "${passed:=0}"
          raw=build/rhi_receipt_local.json
          cmd="rhi_swapchain_bench (Weston + lavapipe; rc=$rc passed=$passed skipped=$skipped)"
          metrics_args=()
          if [ "${{ job.status }}" = "success" ] && [ "$rc" = "0" ] && \
              [ "$skipped" = "0" ] && [ "$passed" -gt 0 ] && [ -s "$raw" ]; then
            lvl=GPU_RUNTIME
            m() { python3 -c "import json;print(json.load(open('$raw'))['metrics']['$1'])"; }
            gpu="$(python3 -c "import json;print(json.load(open('$raw'))['gpu'] or 'unknown')")"
            driver="$(python3 -c "import json;print(json.load(open('$raw'))['driver_version'] or 'unknown')")"
            metrics_args=(-DFPS_AVG=$(m fps_avg) -DFPS_P1=$(m fps_p1)
              -DFRAME_MS_AVG=$(m frame_ms_avg) -DFRAME_MS_P99=$(m frame_ms_p99))
          else
            lvl=UNAVAILABLE
            gpu="lavapipe (not executed)"
            driver=unknown
          fi
          echo "job=${{ job.status }} $cmd -> evidence_level=$lvl"
          cmake -DOUT=receipt.json -DPLATFORM=linux-wayland -DBACKEND=vulkan \
            -DDEVICE_TYPE=CPU -DVENDOR_ID=0 -DDEVICE_ID=0 \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="$cmd" -DBUILD_CONFIG=Release \
            -DGPU="$gpu" -DDRIVER_VERSION="$driver" \
            -DCPU="$(uname -m)" -DRAM=unknown \
            "${metrics_args[@]}" \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-benchmark-linux-vk
          path: |
            receipt.json
            build/rhi_receipt_local.json
          if-no-files-found: ignore
      - name: Require executed benchmark
        if: always()
        run: |
          test "${{ steps.graphics.outputs.rc }}" = "0"
          test "${{ steps.graphics.outputs.passed }}" -gt 0
          test "${{ steps.graphics.outputs.skipped }}" = "0"
          test -s build/rhi_receipt_local.json

  lane-benchmark-steam-deck-vk:
    name: Steam Deck / Linux Wayland real-GPU Vulkan benchmark
    # 真 GPU 自托管 benchmark lane：BENCHMARK_COMPARABLE 真机证据归这里
    # （lavapipe 上的 lane-benchmark-linux-vk 只出 GPU_RUNTIME 收据）。
    # GitHub-hosted 运行器上没有 self-hosted 标签可接单，不加 if 会永久 pending。
    if: vars.ENABLE_GPU_LANES == '1'
    runs-on: [self-hosted, linux, gpu-vulkan]
    timeout-minutes: 30
    env:
      DECK_EXPECTED_VENDOR_ID: ${{ vars.STEAM_DECK_VENDOR_ID }}
      DECK_EXPECTED_DEVICE_ID: ${{ vars.STEAM_DECK_DEVICE_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 -o Dir::Cache::Archives=$HOME/apt-archives -o Binary::apt::APT::Keep-Downloaded-Packages=true"
          # R675: each attempt is capped and retried -- a hung mirror otherwise
          # ate the whole step (R674 run: one job timed out at 10 min while
          # every other job installed in ~1 min). man-db triggers are skipped.
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p "$HOME/apt-archives/partial"; sudo rm -f /etc/apt/apt.conf.d/docker-clean
          # R677: each failed attempt publishes the tail of its output as
          # ::warning:: annotations (job logs are not readable anonymously).
          # R676: usage apt_retry <seconds-per-attempt> <apt-get args>. A failed
          # attempt moves the runner off its Azure mirror to archive.ubuntu.com
          # (R675 run: three 240 s attempts on the same stalled mirror).
          apt_retry() { t=$1; shift; for i in 1 2 3; do if ( set -o pipefail; sudo timeout "$t" apt-get $APT_OPTS "$@" 2>&1 | tee /tmp/apt-attempt.log ); then return 0; fi; echo "::warning::apt-get $1 attempt $i failed or timed out after ${t}s; last output:"; tail -8 /tmp/apt-attempt.log | while IFS= read -r l; do echo "::warning::  $l"; done; sudo sed -i "s#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo dpkg --configure -a || true; [ "$1" = install ] && sudo timeout 120 apt-get $APT_OPTS update || true; sleep 5; done; return 1; }
          # R678: no fonts-noto-cjk here (61 MB, the largest download; R677
          # caught this lane timing out on it twice) -- this lane runs no font
          # test; the headless lanes keep it for test_myui_font's CJK cases.
          apt_retry 120 update
          # 钉版候选取自 ubuntu-24.04 (noble)：self-hosted runner 需为 24.04。
          apt_retry 360 install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libwayland-dev wayland-protocols libxkbcommon-dev weston \
            libgl1-mesa-dev libegl1-mesa-dev \
            libvulkan-dev=1.3.275.* libshaderc-dev=2023.8* libfreetype6-dev
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives" || true  # R682: readable by the cache save

      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENGINE_ENABLE_WAYLAND=ON -DENGINE_VULKAN=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run Wayland GPU suite and benchmark
        id: graphics
        continue-on-error: true
        env:
          RECEIPT_RUNNER: ${{ runner.name }}
          RECEIPT_OS_VERSION: ${{ runner.os }}
          RECEIPT_BUILD_CONFIG: RelWithDebInfo
          GIT_COMMIT: ${{ github.sha }}
        run: |
          export RECEIPT_TIMESTAMP="$(date -u +%FT%TZ)"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=wayland-break-steam-deck
          weston --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >/tmp/weston-steam-deck.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" 2>/dev/null || { cat /tmp/weston-steam-deck.log; exit 1; }
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          set +e
          out="$(ctest --test-dir build -L graphics --output-on-failure 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          skipped=$(printf '%s\n' "$out" | grep -c '\*\*\*Skipped' || true)
          passed=$(printf '%s\n' "$out" | grep -c '   Passed' || true)
          bench_rc=not-run
          if [ "$rc" = "0" ] && [ "$skipped" = "0" ] && [ "$passed" -gt 0 ]; then
            set +e
            ./build/rhi_swapchain_bench build/rhi_receipt_steam_deck.json
            bench_rc=$?
            set -e
            rc=$bench_rc
          fi
          echo "Steam Deck Wayland execution: rc=$rc passed=$passed skipped=$skipped benchmark=$bench_rc" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Emit benchmark receipt
        if: always()
        run: |
          rc="${{ steps.graphics.outputs.rc }}"; skipped="${{ steps.graphics.outputs.skipped }}"; passed="${{ steps.graphics.outputs.passed }}"
          : "${rc:=1}"; : "${skipped:=1}"; : "${passed:=0}"
          raw=build/rhi_receipt_steam_deck.json
          cmd="Steam Deck Wayland GPU suite + benchmark (rc=$rc passed=$passed skipped=$skipped)"
          cmake -DRECEIPT="$raw" -DOUT=hardware.env \
            -DEXPECTED_VENDOR_ID="$DECK_EXPECTED_VENDOR_ID" \
            -DEXPECTED_DEVICE_ID="$DECK_EXPECTED_DEVICE_ID" \
            -P engine/tools/check_steam_deck_hardware.cmake
          source hardware.env
          echo "Steam Deck hardware_ok=$hardware_ok reason=$hardware_reason"
          metrics_args=()
          if [ "${{ job.status }}" = "success" ] && [ "$rc" = "0" ] && \
              [ "$skipped" = "0" ] && [ "$passed" -gt 0 ] && [ -s "$raw" ] && \
              [ "$hardware_ok" = "true" ]; then
            lvl=BENCHMARK_COMPARABLE
            cmake -DRECEIPT="$raw" -P engine/tests/test_rhi_benchmark_receipt_validate.cmake
            cmake -DRECEIPT="$raw" -P engine/tests/test_evidence_receipt_schema.cmake
            j() { python3 -c "import json;print(json.load(open('$raw'))$1 or 'unknown')"; }
            jm() { python3 -c "import json;print(json.load(open('$raw'))['metrics']['$1'])"; }
            gpu="$(j "['gpu']")"
            driver="$(j "['driver_version']")"
            dtype="$(j "['device_type']")"
            vendor="$(j "['vendor_id']")"
            device="$(j "['device_id']")"
            metrics_args=(-DFPS_AVG=$(jm fps_avg) -DFPS_P1=$(jm fps_p1)
              -DFRAME_MS_AVG=$(jm frame_ms_avg) -DFRAME_MS_P99=$(jm frame_ms_p99))
          else
            lvl=UNAVAILABLE
            gpu=unknown
            driver=unknown
            dtype=UNKNOWN
            vendor=0
            device=0
          fi
          echo "job=${{ job.status }} $cmd -> evidence_level=$lvl"
          cmake -DOUT=receipt.json -DPLATFORM=linux-wayland -DBACKEND=vulkan \
            -DDEVICE_TYPE="$dtype" -DVENDOR_ID="$vendor" -DDEVICE_ID="$device" \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="$cmd" -DBUILD_CONFIG=RelWithDebInfo \
            -DGPU="$gpu" -DDRIVER_VERSION="$driver" \
            -DCPU="$(uname -m)" -DRAM=unknown \
            "${metrics_args[@]}" \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidence-receipt-benchmark-steam-deck
          path: |
            receipt.json
            hardware.env
            build/rhi_receipt_steam_deck.json
          if-no-files-found: ignore
      - name: Require executed real-GPU benchmark
        if: always()
        run: |
          raw=build/rhi_receipt_steam_deck.json
          cmake -DRECEIPT="$raw" -DOUT=hardware.env \
            -DEXPECTED_VENDOR_ID="$DECK_EXPECTED_VENDOR_ID" \
            -DEXPECTED_DEVICE_ID="$DECK_EXPECTED_DEVICE_ID" \
            -P engine/tools/check_steam_deck_hardware.cmake
          source hardware.env
          echo "Steam Deck final hardware_ok=$hardware_ok reason=$hardware_reason"
          test "$hardware_ok" = "true"
          test "${{ steps.graphics.outputs.rc }}" = "0"
          test "${{ steps.graphics.outputs.passed }}" -gt 0
          test "${{ steps.graphics.outputs.skipped }}" = "0"
          test -s "$raw"

  # ---- lane: proton（兼容验证，不计入 Windows D3D12 证据；schedule + 手动触发）----
  lane-proton:
    name: "lane: proton compatibility (reference only)"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Build under Steam Runtime (pinned)
        id: steamrt
        continue-on-error: true   # 参考 lane：失败记 UNAVAILABLE 收据，不红
        run: |
          # steamrt sniper 钉 digest（registry.gitlab.steamos.cloud 匿名 token
          # 实测 2026-10-17：latest 为单架构 docker manifest v2，linux/amd64，
          # 镜像 built 2026-09-28；取法见 task-7 报告）。
          docker run --rm -v "$GITHUB_WORKSPACE":/src -w /src \
            registry.gitlab.steamos.cloud/steamrt/sniper/sdk@sha256:9ae8083ee9ae6298361a62f289e62f0a2b0779d23fc8c276304157f0c06010c5 \
            bash -c '
              if ! command -v pkg-config >/dev/null 2>&1 ||
                 ! command -v wayland-scanner >/dev/null 2>&1 ||
                 ! pkg-config --exists wayland-client wayland-egl wayland-cursor xkbcommon; then
                echo "UNAVAILABLE: pinned SteamRT lacks the native Wayland build toolchain" >&2
                exit 77
              fi
              cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENGINE_ENABLE_WAYLAND=ON &&
              cmake --build build --parallel &&
              ctest --test-dir build -LE "graphics|fuzz|gpu|audio_device" --output-on-failure
            '

      - name: Emit evidence receipt
        if: always()
        run: |
          if [ "${{ steps.steamrt.outcome }}" = "success" ]; then lvl=HEADLESS; else lvl=UNAVAILABLE; fi
          echo "steamrt outcome=${{ steps.steamrt.outcome }} -> evidence_level=$lvl"
          cmake -DOUT=receipt.json -DPLATFORM=proton -DBACKEND=vulkan \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="docker steamrt sniper sdk (pinned digest) build + ctest -LE graphics|fuzz" \
            -DBUILD_CONFIG=Release \
            -DGPU=none -DDRIVER_VERSION=none -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-proton
          path: receipt.json

  ios-metal-build:
    # Simulator evidence = compile only (marking 1 of 3: lane comment)
    name: iOS native Metal build-only (Simulator evidence = compile only)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer && xcodebuild -version

      - name: Install shader toolchain
        run: brew install shaderc spirv-cross

      - name: Configure (iOS, metal)
        run: cmake -S engine -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DENGINE_RHI_BACKEND=metal -DENGINE_BUILD_TESTS=OFF -DBREAK_ENABLE_CRYPTO=OFF

      - name: Build (iOS Simulator destination)
        run: xcodebuild -project build-ios/PureCEngine.xcodeproj -scheme engine_demo -destination 'generic/platform=iOS Simulator' build

      - name: Verify artifact
        run: |
          test -s build-ios/metal_shaders/engine.metallib
          test -d build-ios/Debug-iphonesimulator/engine_demo.app
          test -s build-ios/Debug-iphonesimulator/engine_demo.app/engine.metallib
          test -s build-ios/Debug-iphonesimulator/engine_demo.app/assets/init.script
          test -s build-ios/Debug-iphonesimulator/engine_demo.app/assets/LiberationSans-Regular.ttf
          test -s build-ios/Debug-iphonesimulator/engine_demo.app/shaders/blinn_phong_vk.vert
          test -s build-ios/Debug-iphonesimulator/engine_demo.app/shaders/blinn_phong_vk.frag
          test "$(plutil -extract CFBundleIdentifier raw build-ios/Debug-iphonesimulator/engine_demo.app/Info.plist)" = "com.purecengine.engine-demo"
          test "$(plutil -extract UIApplicationSceneManifest.UISceneConfigurations.UIWindowSceneSessionRoleApplication.0.UISceneDelegateClassName raw build-ios/Debug-iphonesimulator/engine_demo.app/Info.plist)" = "IOSDemoSceneDelegate"

  clean-room:
    # headless 证据 lane：git archive 干净导出 + 仅锁定依赖（spec §8.2 headless 类；
    # task 2 交付，保留原名；不产出 GPU 收据 artifact）。
    name: Clean-room build (locked deps, fresh export)
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.digest }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # 钉版以 ubuntu-24.04 (noble) apt-cache policy 实测候选为准：
      # cmake=3.28.3 / libvulkan-dev=1.3.275.0-1build1 / libshaderc-dev=2023.8-1build1。

      - name: Clean-room configure/build/test
        run: |
          # runner 的 toolcache cmake (/usr/local/bin) 会遮蔽 apt 钉版的
          # /usr/bin/cmake；前置 /usr/bin 让 cmake=3.28.* 钉版真实生效。
          export PATH="/usr/bin:$PATH"
          cmake --version | head -1
          bash engine/tools/clean_room_build.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/clean-room" --backend vulkan

