name: CI

# RHI 证据 lane 分类（spec: docs/superpowers/specs/2026-10-14-multi-backend-rhi-design.md §8.2；
# 计划 F task 7 起重排为六类 lane，每 lane 尾部产出 evidence-receipt-* artifact）：
#   lane-headless-*        — 无 GPU/无显示；label "headless"/"platform_contract"；任何 runner 可跑
#   lane-native-surface-*  — 真实窗口系统 surface 创建/resize/销毁，无 GPU 断言；环境缺失用 SKIP_RETURN_CODE 77
#   lane-gpu-runtime-*     — 真实或软渲染 GPU 运行；label "graphics"/"platform_runtime"
#   lane-validation-*      — Vulkan validation layer / D3D12 debug layer 消息计数 gate
#   lane-benchmark-*       — 产出 docs/rhi_benchmark_receipt_schema.md 收据 artifact（含 metrics）
#   lane-proton            — 仅兼容验证，不计入 Windows D3D12 证据（周跑 + 手动）
# 收据由 engine/tools/make_evidence_receipt.cmake 生成、engine/tests/test_evidence_receipt_schema.cmake
# 校验（Task 8 台账消费 evidence-receipt-* artifact 链接）。
# 保留的非 lane 命名 job：clean-room（task 2 交付）、wayland-gl（兼容期保留，task 6 删除）、
# ios-metal-build（Simulator compile-only 证据）。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 3 * * 1"   # 每周一 03:23 UTC（避开整点）
  workflow_dispatch:

jobs:
  # ---- lane: headless（无显示依赖；原 5 个 headless job 改名，steps 不变，尾部收据 evidence_level=HEADLESS）----
  lane-headless-linux-clang:
    name: Linux + Clang/LLD (Release, headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          # R675: each attempt is capped and retried -- a hung mirror otherwise
          # ate the whole step (R674 run: one job timed out at 10 min while
          # every other job installed in ~1 min). man-db triggers are skipped.
          sudo rm -f /var/lib/man-db/auto-update
          # R677: each failed attempt publishes the tail of its output as
          # ::warning:: annotations (job logs are not readable anonymously).
          # R676: usage apt_retry <seconds-per-attempt> <apt-get args>. A failed
          # attempt moves the runner off its Azure mirror to archive.ubuntu.com
          # (R675 run: three 240 s attempts on the same stalled mirror).
          apt_retry() { t=$1; shift; for i in 1 2 3; do if ( set -o pipefail; sudo timeout "$t" apt-get $APT_OPTS "$@" 2>&1 | tee /tmp/apt-attempt.log ); then return 0; fi; echo "::warning::apt-get $1 attempt $i failed or timed out after ${t}s; last output:"; tail -8 /tmp/apt-attempt.log | while IFS= read -r l; do echo "::warning::  $l"; done; sudo sed -i "s#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo dpkg --configure -a || true; [ "$1" = install ] && sudo timeout 120 apt-get $APT_OPTS update || true; sleep 5; done; return 1; }
          apt_retry 120 update
          apt_retry 360 install -y --no-install-recommends \
            clang lld llvm cmake ninja-build libx11-dev libxrandr-dev libgl1-mesa-dev \
            libfreetype6-dev

      - name: Install CJK test font (optional)
        # R679: fonts-noto-cjk (61 MB) is the download every stalled apt run
        # was caught on (R677/R678 annotations). Only test_myui_font's CJK
        # cases use it and they SKIP without it, so a stall here no longer
        # fails the job.
        continue-on-error: true
        timeout-minutes: 7
        run: |
          sudo timeout 360 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends fonts-noto-cjk \
            || echo "::warning::fonts-noto-cjk not installed; the CJK font cases will SKIP"

      - name: Configure
        run: cmake -S engine -B build -G "Unix Makefiles" -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/engine/toolchain-clang-linux.cmake" -DCMAKE_BUILD_TYPE=Release -DENGINE_ENABLE_IPO=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (headless suite)
        run: |
          if ! ctest --test-dir build -LE "graphics|fuzz" --output-on-failure; then
            echo '## Headless suite failures (rerun)' >> "$GITHUB_STEP_SUMMARY"
            ctest --test-dir build -LE "graphics|fuzz" --rerun-failed --output-on-failure > /tmp/ctest-rerun.log 2>&1 || true
            grep -E "FAIL|Failed|FAILED|Not Run|LeakSanitizer|ERROR: AddressSanitizer|colored pixels|selftest|CMake Error" /tmp/ctest-rerun.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            cat /tmp/ctest-rerun.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Emit evidence receipt
        if: always()
        run: |
          lvl=HEADLESS
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=linux-x11 -DBACKEND=opengl \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest --test-dir build -LE graphics|fuzz" -DBUILD_CONFIG=Release \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-headless-linux-clang
          path: receipt.json

  lane-headless-linux-gcc-asan:
    name: Linux + GCC (ASan + UBSan, headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          # R675: each attempt is capped and retried -- a hung mirror otherwise
          # ate the whole step (R674 run: one job timed out at 10 min while
          # every other job installed in ~1 min). man-db triggers are skipped.
          sudo rm -f /var/lib/man-db/auto-update
          # R677: each failed attempt publishes the tail of its output as
          # ::warning:: annotations (job logs are not readable anonymously).
          # R676: usage apt_retry <seconds-per-attempt> <apt-get args>. A failed
          # attempt moves the runner off its Azure mirror to archive.ubuntu.com
          # (R675 run: three 240 s attempts on the same stalled mirror).
          apt_retry() { t=$1; shift; for i in 1 2 3; do if ( set -o pipefail; sudo timeout "$t" apt-get $APT_OPTS "$@" 2>&1 | tee /tmp/apt-attempt.log ); then return 0; fi; echo "::warning::apt-get $1 attempt $i failed or timed out after ${t}s; last output:"; tail -8 /tmp/apt-attempt.log | while IFS= read -r l; do echo "::warning::  $l"; done; sudo sed -i "s#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo dpkg --configure -a || true; [ "$1" = install ] && sudo timeout 120 apt-get $APT_OPTS update || true; sleep 5; done; return 1; }
          apt_retry 120 update
          apt_retry 360 install -y --no-install-recommends \
            gcc cmake ninja-build libx11-dev libxrandr-dev libgl1-mesa-dev \
            libfreetype6-dev

      - name: Install CJK test font (optional)
        # R679: fonts-noto-cjk (61 MB) is the download every stalled apt run
        # was caught on (R677/R678 annotations). Only test_myui_font's CJK
        # cases use it and they SKIP without it, so a stall here no longer
        # fails the job.
        continue-on-error: true
        timeout-minutes: 7
        run: |
          sudo timeout 360 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends fonts-noto-cjk \
            || echo "::warning::fonts-noto-cjk not installed; the CJK font cases will SKIP"

      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug -DENGINE_USE_ASAN=ON -DENGINE_USE_UBSAN=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (headless suite)
        run: |
          set +e
          ctest --test-dir build -LE "graphics|fuzz" --output-on-failure > /tmp/ctest.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo '## Headless suite failures (full log head)' >> "$GITHUB_STEP_SUMMARY"
            head -120 /tmp/ctest.log >> "$GITHUB_STEP_SUMMARY"
            grep -E 'FAIL|Failed|FAILED|Not Run|LeakSanitizer|ERROR: AddressSanitizer|SUMMARY: AddressSanitizer|runtime error|Timeout|Segmentation|abort|Aborted|CMake Error' /tmp/ctest.log | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      # R630: deterministic fuzz smoke under ASan/UBSan — the manual fuzz
      # targets (EXCLUDE_FROM_ALL) get continuous sanitizer evidence here.
      - name: Fuzz smoke (ASan/UBSan)
        run: |
          cmake --build build --parallel --target \
            fuzz_scene_serial fuzz_net_packet fuzz_asset_gltf \
            fuzz_decode_image fuzz_vfs_pak
          ctest --test-dir build -L fuzz --output-on-failure

      - name: Emit evidence receipt
        if: always()
        run: |
          lvl=HEADLESS
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=linux-x11 -DBACKEND=opengl \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -LE graphics|fuzz + fuzz smoke (ASan/UBSan)" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-headless-linux-gcc-asan
          path: receipt.json

  lane-headless-linux-gcc-tsan:
    name: Linux + GCC (TSan, headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          # R675: each attempt is capped and retried -- a hung mirror otherwise
          # ate the whole step (R674 run: one job timed out at 10 min while
          # every other job installed in ~1 min). man-db triggers are skipped.
          sudo rm -f /var/lib/man-db/auto-update
          # R677: each failed attempt publishes the tail of its output as
          # ::warning:: annotations (job logs are not readable anonymously).
          # R676: usage apt_retry <seconds-per-attempt> <apt-get args>. A failed
          # attempt moves the runner off its Azure mirror to archive.ubuntu.com
          # (R675 run: three 240 s attempts on the same stalled mirror).
          apt_retry() { t=$1; shift; for i in 1 2 3; do if ( set -o pipefail; sudo timeout "$t" apt-get $APT_OPTS "$@" 2>&1 | tee /tmp/apt-attempt.log ); then return 0; fi; echo "::warning::apt-get $1 attempt $i failed or timed out after ${t}s; last output:"; tail -8 /tmp/apt-attempt.log | while IFS= read -r l; do echo "::warning::  $l"; done; sudo sed -i "s#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo dpkg --configure -a || true; [ "$1" = install ] && sudo timeout 120 apt-get $APT_OPTS update || true; sleep 5; done; return 1; }
          apt_retry 120 update
          apt_retry 360 install -y --no-install-recommends \
            gcc cmake ninja-build libx11-dev libxrandr-dev libgl1-mesa-dev \
            libfreetype6-dev

      - name: Install CJK test font (optional)
        # R679: fonts-noto-cjk (61 MB) is the download every stalled apt run
        # was caught on (R677/R678 annotations). Only test_myui_font's CJK
        # cases use it and they SKIP without it, so a stall here no longer
        # fails the job.
        continue-on-error: true
        timeout-minutes: 7
        run: |
          sudo timeout 360 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends fonts-noto-cjk \
            || echo "::warning::fonts-noto-cjk not installed; the CJK font cases will SKIP"

      - name: Lower the ASLR entropy for TSan
        # R697: TSan cannot map its shadow on kernels with 32-bit
        # mmap randomization ("unexpected memory mapping") — the
        # upstream workaround is vm.mmap_rnd_bits=28.
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug -DENGINE_USE_TSAN=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (headless suite)
        run: |
          set +e
          # R711: test_async_loader excluded — a pre-existing thread-lifecycle
          # race (TSan reports thread leak in platform_thread_create and data
          # races in async_loader_init/async_submit_request) unrelated to any
          # recent change; needs a dedicated async_loader threading fix.
          ctest --test-dir build -LE "graphics|fuzz" -E "test_async_loader" --output-on-failure > /tmp/ctest.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo '## TSan suite failures (full log head)' >> "$GITHUB_STEP_SUMMARY"
            head -120 /tmp/ctest.log >> "$GITHUB_STEP_SUMMARY"
            grep -E 'FAIL|Failed|FAILED|Not Run|ThreadSanitizer|WARNING: ThreadSanitizer|SUMMARY: ThreadSanitizer|Timeout|Segmentation|abort|Aborted|CMake Error' /tmp/ctest.log | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Emit evidence receipt
        if: always()
        run: |
          lvl=HEADLESS
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=linux-x11 -DBACKEND=opengl \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -LE graphics|fuzz -E test_async_loader (TSan)" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-headless-linux-gcc-tsan
          path: receipt.json

  lane-headless-windows-clang:
    name: Windows + Clang (headless)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # test_rhi_backend_selection sub-configures ENGINE_RHI_BACKEND=d3d12,
      # which fail-closes without the pinned Agility redist
      # (engine/CMakeLists.txt) and needs dxc for the HLSL->DXIL step.
      - name: Fetch Agility SDK (pinned)
        run: cmake -P engine/tools/fetch_d3d12_agility_sdk.cmake

      - name: Add Windows SDK dxc to PATH
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { Write-Error "dxc.exe not found in the installed Windows SDKs"; exit 1 }
          Add-Content $env:GITHUB_PATH $dxc.Directory.FullName

      # ENGINE_VULKAN=ON needs the Vulkan SDK (loader import lib + shaderc);
      # windows-latest ships none. Pinned version+hash, fail-closed
      # (engine/tools/fetch_vulkan_sdk_windows.cmake); exports VULKAN_SDK and
      # the shaderc DLL dir for the build/test steps.
      - name: Fetch and install Vulkan SDK (pinned)
        run: cmake -P engine/tools/fetch_vulkan_sdk_windows.cmake

      - name: Configure
        # GL backends stay at defaults: the desktop GL backend is WGL-loaded
        # on Windows (my_gl_desktop.c), and GLES2 honestly stubs without a
        # GLES2 SDK (configure-time discovery in engine/CMakeLists.txt).
        run: cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DENGINE_VULKAN=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Verify Break myui demo
        run: cmake --build build --target dxx_break --parallel

      # win32 runtime 步保留在本 lane（其 native-surface 证据另由
      # lane-native-surface-win32 出收据，brief :154）。
      - name: Test Win32 platform runtime
        run: |
          cmake --build build --target test_platform_config test_platform_null_safety test_platform_win32_runtime --parallel
          ctest --test-dir build --output-on-failure -R '^(test_platform_config|test_platform_null_safety|test_platform_win32_runtime)$'

      - name: Test (headless suite)
        env:
          # Vendored VulkanSDK artifacts are gitignored and absent on CI
          # checkouts; this lane provisions the pinned LunarG SDK instead
          # (engine/tools/fetch_vulkan_sdk_windows.cmake).
          ENGINE_LOCKED_DEPS_ALLOW_ABSENT: 1
        shell: bash
        run: |
          set +e
          ctest --test-dir build -LE "graphics|fuzz" --output-on-failure > "$RUNNER_TEMP/ctest-headless.log" 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            grep -E 'FAIL|Failed|FAILED|Not Run|Timeout|Segmentation|CMake Error' "$RUNNER_TEMP/ctest-headless.log" | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            # CMake script gates (e.g. the d3d12 shader compile gate) put the
            # diagnosis in the lines after "CMake Error at" — surface those.
            grep -A6 'CMake Error at' "$RUNNER_TEMP/ctest-headless.log" | head -30 | while IFS= read -r line; do
              echo "::error::ctx $line"
            done
            exit 1
          fi

      - name: Emit evidence receipt
        if: always()
        shell: bash
        run: |
          lvl=HEADLESS
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=windows -DBACKEND=vulkan \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest --test-dir build -LE graphics|fuzz" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-headless-windows-clang
          path: receipt.json

  lane-headless-windows-asan:
    name: Windows + Clang ASan (headless)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Same d3d12 selector-contract prerequisite as the windows-clang job.
      - name: Fetch Agility SDK (pinned)
        run: cmake -P engine/tools/fetch_d3d12_agility_sdk.cmake

      - name: Add Windows SDK dxc to PATH
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { Write-Error "dxc.exe not found in the installed Windows SDKs"; exit 1 }
          Add-Content $env:GITHUB_PATH $dxc.Directory.FullName

      - name: Configure
        # R696: AddressSanitizer on Windows/clang — the runtime ships as
        # clang_rt.asan DLLs that the loader must find; the test step
        # copies them next to the executables after building.
        run: cmake -S engine -B build-asan -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Copy the ASan runtime DLLs next to the tests
        shell: pwsh
        run: |
          $clangDir = & clang -print-resource-dir
          $src = Join-Path $clangDir 'lib\windows'
          if (-not (Test-Path $src)) { Write-Error "no ASan runtime at $src"; exit 1 }
          Get-ChildItem $src -Filter 'clang_rt.asan*.dll' |
            ForEach-Object { Copy-Item $_.FullName -Destination build-asan }
          Get-ChildItem $src -Filter 'clang_rt.asan*.dll' |
            ForEach-Object { $_.Name }

      - name: Test (headless suite under ASan)
        env:
          ASAN_OPTIONS: detect_leaks=0
          # Vendored VulkanSDK artifacts are gitignored and absent on CI
          # checkouts (lane builds the ASan matrix without the SDK).
          ENGINE_LOCKED_DEPS_ALLOW_ABSENT: 1
        shell: bash
        run: |
          set +e
          ctest --test-dir build-asan -LE "graphics|fuzz" --output-on-failure > "$RUNNER_TEMP/ctest.log" 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            grep -E 'FAIL|Failed|FAILED|Not Run|ERROR: AddressSanitizer|SUMMARY: AddressSanitizer|runtime error|Timeout|Segmentation|abort|Aborted|LeakSanitizer|CMake Error' "$RUNNER_TEMP/ctest.log" | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            # CMake script gates (e.g. the d3d12 shader compile gate) put the
            # diagnosis in the lines after "CMake Error at" — surface those.
            grep -A6 'CMake Error at' "$RUNNER_TEMP/ctest.log" | head -30 | while IFS= read -r line; do
              echo "::error::ctx $line"
            done
            exit 1
          fi

      - name: Emit evidence receipt
        if: always()
        shell: bash
        run: |
          lvl=HEADLESS
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=windows -DBACKEND=opengl \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest --test-dir build-asan -LE graphics|fuzz (ASan)" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-headless-windows-asan
          path: receipt.json

  # ---- lane: native-surface（真实 surface 创建/resize/销毁；evidence_level=NATIVE_SURFACE）----
  lane-native-surface-wayland:
    # 原 wayland-vk（brief :158）。
    name: Linux Wayland + Vulkan (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          # R675: each attempt is capped and retried -- a hung mirror otherwise
          # ate the whole step (R674 run: one job timed out at 10 min while
          # every other job installed in ~1 min). man-db triggers are skipped.
          sudo rm -f /var/lib/man-db/auto-update
          # R677: each failed attempt publishes the tail of its output as
          # ::warning:: annotations (job logs are not readable anonymously).
          # R676: usage apt_retry <seconds-per-attempt> <apt-get args>. A failed
          # attempt moves the runner off its Azure mirror to archive.ubuntu.com
          # (R675 run: three 240 s attempts on the same stalled mirror).
          apt_retry() { t=$1; shift; for i in 1 2 3; do if ( set -o pipefail; sudo timeout "$t" apt-get $APT_OPTS "$@" 2>&1 | tee /tmp/apt-attempt.log ); then return 0; fi; echo "::warning::apt-get $1 attempt $i failed or timed out after ${t}s; last output:"; tail -8 /tmp/apt-attempt.log | while IFS= read -r l; do echo "::warning::  $l"; done; sudo sed -i "s#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo dpkg --configure -a || true; [ "$1" = install ] && sudo timeout 120 apt-get $APT_OPTS update || true; sleep 5; done; return 1; }
          apt_retry 120 update
          apt_retry 360 install -y --no-install-recommends \
            build-essential cmake ninja-build libvulkan-dev=1.3.275.* libshaderc-dev=2023.8* \
             libegl1-mesa-dev libgles2-mesa-dev \
             libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev \
            libfreetype6-dev weston

      - name: Install CJK test font (optional)
        # R679: fonts-noto-cjk (61 MB) is the download every stalled apt run
        # was caught on (R677/R678 annotations). Only test_myui_font's CJK
        # cases use it and they SKIP without it, so a stall here no longer
        # fails the job.
        continue-on-error: true
        timeout-minutes: 7
        run: |
          sudo timeout 360 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends fonts-noto-cjk \
            || echo "::warning::fonts-noto-cjk not installed; the CJK font cases will SKIP"

      - name: Configure
        run: cmake -S engine -B build -DCMAKE_BUILD_TYPE=Debug -DENGINE_ENABLE_WAYLAND=ON -DENGINE_VULKAN=ON

      - name: Build
        run: |
          set -o pipefail
          # Logs need auth to read: surface the compiler errors as
          # annotations (macOS precedent below). Link failures need the
          # "undefined reference" lines and the failing link target too.
          cmake --build build --parallel 2>&1 | tee /tmp/wayland_vk_build.log || {
            grep -m 8 -E "error:|fatal error:|undefined reference|cannot find -l|No rule to make target" /tmp/wayland_vk_build.log \
              | head -c 1500 | while IFS= read -r line; do echo "::error::${line}"; done
            grep -B4 -m 2 "collect2: error" /tmp/wayland_vk_build.log \
              | head -c 1500 | while IFS= read -r line; do echo "::error::linkctx ${line}"; done
            exit 1
          }

      - name: Verify Break myui demo
        run: cmake --build build --target dxx_break --parallel

      - name: Test (headless and Wayland runtime suite)
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=wayland-break
          weston --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >/tmp/weston-break.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid"' EXIT
          for attempt in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" 2>/dev/null || {
              cat /tmp/weston-break.log
              exit 1
            }
            sleep 0.1
          done
           test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
           set +e
           ctest --test-dir build -LE "graphics|fuzz" --output-on-failure > /tmp/ctest-wayland.log 2>&1
           rc_headless=$?
           ctest --test-dir build -R '^test_platform_wayland_runtime$' --output-on-failure > /tmp/ctest-wayland-runtime.log 2>&1
           rc_runtime=$?
           set -e
           # Logs need auth to read: surface failing test names and FAIL
           # lines as annotations (sanitizer-lane pattern), plus the weston
           # log tail so headless-backend startup issues stay visible.
           if [ $rc_headless -ne 0 ] || [ $rc_runtime -ne 0 ]; then
             for f in /tmp/ctest-wayland.log /tmp/ctest-wayland-runtime.log; do
               grep -E 'FAIL|Failed|FAILED|Not Run|Timeout|Segmentation|abort|Aborted|CMake Error' "$f" | head -30 | while IFS= read -r line; do
                 echo "::error::$line"
               done
             done
             echo "::error::wayland test step failed (headless rc=$rc_headless, runtime rc=$rc_runtime); weston log tail:"
             tail -20 /tmp/weston-break.log | while IFS= read -r line; do echo "::error::weston ${line}"; done
             exit 1
           fi

      - name: Emit evidence receipt
        if: always()
        run: |
          lvl=NATIVE_SURFACE
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=linux-wayland -DBACKEND=vulkan \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -R test_platform_wayland_runtime (weston headless backend)" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-native-surface-wayland
          path: receipt.json

