name: CI

# RHI 证据 lane 分类（spec: docs/superpowers/specs/2026-10-14-multi-backend-rhi-design.md §8.2；
# 计划 F task 7 起重排为六类 lane，每 lane 尾部产出 evidence-receipt-* artifact）：
#   lane-headless-*        — 无 GPU/无显示；label "headless"/"platform_contract"；任何 runner 可跑
#   lane-native-surface-*  — 真实窗口系统 surface 创建/resize/销毁，无 GPU 断言；环境缺失用 SKIP_RETURN_CODE 77
#   lane-gpu-runtime-*     — 真实或软渲染 GPU 运行；label "graphics"/"platform_runtime"
#   lane-validation-*      — Vulkan validation layer / D3D12 debug layer 消息计数 gate
#   lane-benchmark-*       — 产出 docs/rhi_benchmark_receipt_schema.md 收据 artifact（含 metrics）
#   lane-proton            — 仅兼容验证，不计入 Windows D3D12 证据（周跑 + 手动）
# 收据由 engine/tools/make_evidence_receipt.cmake 生成、engine/tests/test_evidence_receipt_schema.cmake
# 校验（Task 8 台账消费 evidence-receipt-* artifact 链接）。
# 保留的非 lane 命名 job：clean-room（task 2 交付）、wayland-gl（OpenGL 长期保留：最后降级 + 渲染对比基准）、
# ios-metal-build（Simulator compile-only 证据）。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 3 * * 1"   # 每周一 03:23 UTC（避开整点）
  workflow_dispatch:

jobs:
  image:
    name: Verify and publish Linux CI image
    uses: ./.github/workflows/ci-image.yml
    with:
      fallback_digest: ${{ vars.BREAK_CI_LINUX_DIGEST }}
      force_rebuild: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: read
      packages: write

  # ---- lane: headless（无显示依赖；原 5 个 headless job 改名，steps 不变，尾部收据 evidence_level=HEADLESS）----
  lane-headless-linux-clang:
    name: Linux + Clang/LLD (Release, headless)
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.digest }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S engine -B build -G "Unix Makefiles" -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/engine/toolchain-clang-linux.cmake" -DCMAKE_BUILD_TYPE=Release -DENGINE_ENABLE_IPO=ON -DENGINE_RHI_BACKEND=opengl

      - name: Build
        run: cmake --build build --parallel

      - name: Test (headless suite)
        run: |
          if ! ctest --test-dir build -LE "graphics|fuzz|gpu|audio_device" --output-on-failure; then
            echo '## Headless suite failures (rerun)' >> "$GITHUB_STEP_SUMMARY"
            ctest --test-dir build -LE "graphics|fuzz|gpu|audio_device" --rerun-failed --output-on-failure > /tmp/ctest-rerun.log 2>&1 || true
            grep -E "FAIL|Failed|FAILED|Not Run|LeakSanitizer|ERROR: AddressSanitizer|colored pixels|selftest|CMake Error" /tmp/ctest-rerun.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            cat /tmp/ctest-rerun.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Emit evidence receipt
        if: always()
        run: |
          lvl=HEADLESS
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=linux-wayland -DBACKEND=opengl \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest --test-dir build -LE graphics|fuzz|gpu|audio_device" -DBUILD_CONFIG=Release \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-headless-linux-clang
          path: receipt.json

  lane-headless-linux-gcc-asan:
    name: Linux + GCC (ASan + UBSan, headless)
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.digest }}
      # LeakSanitizer stops the world with ptrace; Docker blocks it by default.
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        # BREAK_EDITOR_PLUGINS=ON: the opt-in editor plugin loader
        # (docs/superpowers/plans/2026-11-16-editor-plugin-loader.md) gets a
        # build and test_editor_plugin_manifest_cli runs in its ON mode.
        run: cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug -DENGINE_USE_ASAN=ON -DENGINE_USE_UBSAN=ON -DENGINE_BUILD_FUZZ_SMOKE=ON -DENGINE_RHI_BACKEND=opengl -DBREAK_EDITOR_PLUGINS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (headless suite)
        run: |
          set +e
          ctest --test-dir build -LE "graphics|fuzz|gpu|audio_device" --output-on-failure > /tmp/ctest.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo '## Headless suite failures (full log head)' >> "$GITHUB_STEP_SUMMARY"
            head -120 /tmp/ctest.log >> "$GITHUB_STEP_SUMMARY"
            grep -E 'FAIL|Failed|FAILED|Not Run|LeakSanitizer|ERROR: AddressSanitizer|SUMMARY: AddressSanitizer|runtime error|Timeout|Segmentation|abort|Aborted|CMake Error' /tmp/ctest.log | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      # R630: deterministic fuzz smoke under ASan/UBSan — the manual fuzz
      # targets (EXCLUDE_FROM_ALL) get continuous sanitizer evidence here.
      - name: Fuzz smoke (ASan/UBSan)
        run: |
          cmake --build build --parallel --target \
            fuzz_scene_serial fuzz_net_packet fuzz_asset_gltf \
            fuzz_decode_image fuzz_vfs_pak \
            fuzz_mycompose_tree fuzz_mycompose_intent \
            fuzz_core_app_checkpoint fuzz_core_app_scenario fuzz_core_app_network \
            fuzz_break_online_voice
          ctest --test-dir build -L fuzz --output-on-failure

      - name: Emit evidence receipt
        if: always()
        run: |
          lvl=HEADLESS
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=linux-wayland -DBACKEND=opengl \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -LE graphics|fuzz|gpu|audio_device + fuzz smoke (ASan/UBSan)" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-headless-linux-gcc-asan
          path: receipt.json

  # Cross-compile the architecture-specific code, then run selected headless
  # service and security families with QEMU user emulation. The native suite
  # remains the broader regression net; this is not a full arm64 CTest run.
  lane-cross-aarch64-linux:
    name: Linux arm64 cross-build + QEMU tests (GCC)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install the host and arm64 build dependencies
        run: |
          # Ubuntu's archive hosts do not serve arm64. Keep the existing
          # archive/security stanzas on amd64 and add the ports archive only
          # for arm64 before enabling the foreign architecture.
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          . /etc/os-release
          cat <<EOF | sudo tee /etc/apt/sources.list.d/arm64.sources >/dev/null
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu ninja-build \
            pkg-config python3 file libwayland-dev wayland-protocols \
            libwayland-dev:arm64 libxkbcommon-dev:arm64 \
            libgl-dev:arm64 libegl-dev:arm64 libopengl-dev:arm64 \
            libssl-dev:arm64 qemu-user
          aarch64-linux-gnu-gcc --version

      - name: Configure
        run: |
          # Multiarch installs the target under /usr/lib/aarch64-linux-gnu,
          # so / is the real sysroot. /usr/aarch64-linux-gnu alone would
          # double-prefix the absolute paths in the cross libc linker script.
          export AARCH64_SYSROOT=/
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/aarch64-linux-gnu/lib/pkgconfig:/usr/share/pkgconfig
          # Linux has no ENGINE_RHI_BACKEND=headless selector. Compile the
          # explicit OpenGL path against real arm64 packages; graphics remain
          # compile-only.
          cmake -S engine -B build-arm64 -G Ninja \
            --toolchain "$GITHUB_WORKSPACE/engine/toolchain-aarch64-linux.cmake" \
            -DCMAKE_BUILD_TYPE=Debug -DENGINE_RHI_BACKEND=opengl \
            '-DCMAKE_CROSSCOMPILING_EMULATOR=/usr/bin/qemu-aarch64;-L;/'

      # The targets that carry architecture-specific code, plus the common
      # libraries so a type error anywhere in them fails here too.
      - name: Build the arm64 targets
        run: |
          cmake --build build-arm64 --parallel --target break_crash engine test_break_crash test_break_crash_symbolize test_break_crash_cluster test_break_crash_upload_http break_crash_server break_crash_report break_crash_e2e test_break_update test_break_update_client test_break_http break_manifest_tool break_manifest_verify break_update_server break_update_e2e test_break_crypto test_break_integrity test_break_authority break_keygen test_packet test_network test_break_online_lobby test_break_online_nat test_break_online_voice test_break_voice_mixer test_break_replay_window test_break_msg_rate test_break_online_aspect test_break_online_aspect_replication test_break_replication_fragment test_core_app_network core_app test_runtime_core test_runtime_facade test_runtime_io test_runtime_reload test_ecs test_ecs_system test_ecs_replication test_break_lua_runtime test_break_lua_module test_break_lua_value test_break_lua_binding test_break_lua_handle test_break_lua_table test_break_lua_debug test_break_kernel_lua test_break_lua_ecs_apply test_vfs test_async_loader test_filewatch_backend test_hotreload test_render_graph test_rhi_dispatch test_rhi_capabilities test_rhi_error_contract test_rhi_frame_lifecycle_contract test_profiler test_clock_offset test_trace_core_app test_trace_merge trace_merge test_platform_config test_platform_null_safety test_platform_fs_write test_platform_size_semantics test_task test_task_singleton test_physics test_physics_replay test_physics_sync test_physics_hinge test_physics_cone_twist test_physics_identity test_ragdoll test_vehicle test_physics_slider test_cloth test_rope test_soft_body test_destructible test_character test_animation test_anim_pose_authority test_anim_morph test_anim_facial test_anim_compression test_anim_locomotion test_skeleton_socket test_anim_aim test_break_nav_bake test_break_nav_query test_break_nav_query_concurrent test_break_nav_follow test_break_perception test_break_behavior test_break_steer test_break_ai_dynamic test_break_steer_velocity test_break_ai_agents test_break_ai_formation test_break_ai_smart_object test_voice_playback test_audio test_audio_extended test_audio_dsp test_audio_hrtf test_audio_capture test_audio_agc test_audio_noise_gate test_audio_echo_canceller test_audio_delay_estimator test_audio_fft test_audio_noise_suppressor test_audio_residual_echo_suppressor test_audio_delay_tracker test_audio_gcc_phat test_audio_drift_estimator test_audio_drift_resampler test_audio_drift_compensator test_audio_edit test_audio_voice_processor test_audio_voice_aligner test_audio_wav test_rule_engine test_rule_engine_transactions test_rule_engine_tms test_rule_engine_grl_semantics test_rule_engine_ir test_rule_engine_forall_limits test_rule_engine_rete_incremental test_rule_engine_agenda test_rule_engine_backward test_rule_engine_backward_ext test_rule_engine_grl_surface test_rule_engine_plugin_parity test_rule_engine_example_coverage test_rule_engine_query_blocks test_rule_engine_stream_ext test_rule_engine_stream_grl test_rule_engine_stream_eval test_rule_engine_backward_deep_chain test_backward_machine_structure test_backward_machine_context test_rule_engine_backward_bindings test_break_kernel_actor test_break_kernel_items test_break_kernel_weapons test_break_kernel_actions test_break_kernel_move test_break_kernel_level test_break_kernel_area test_break_kernel_flow test_break_flow_graph test_break_flow_serial test_break_flow_runtime test_vegetation test_time_of_day test_visarea test_world_stream test_decal test_voxel test_road test_mesh_stage test_mesh_buffer test_mesh_gpu test_world_mesh_fake test_world_presentation test_world_presenter_fake test_world_stream_job test_world_stream_world test_editor_doc test_editor_cmd test_editor_scene test_editor_components test_editor_viewport test_editor_gizmo test_editor_assets test_editor_i18n test_editor_scene_textures test_editor_audio test_editor_plugin_cmds test_editor_plugin_host test_editor_plugin_sections test_editor_plugin_panels test_editor_plugin_manifest test_mycompose_tree test_mycompose_remember test_mycompose_store test_mycompose_runtime test_mycompose_async test_break_cvar test_break_xml test_editor_flow test_editor_image test_shader_io test_mycompose_myui test_mycompose_widget_primitives test_render_features test_rt_trace test_rhi_tlas_instance_encode test_rhi_metal_format_mapping test_input_extended test_mycompose_cpp20_c_fixture test_mycompose_cpp20 test_mycompose_cpp20_header test_mycompose_cpp20_noexcept test_public_api_cpp20 test_core_style_prototype test_fork_deadline test_platform_screen_simulated test_platform_window_mode test_pad_linux_feedback test_pad_win_feedback_portable test_win32_touch test_wayland_touch test_rhi_rollout_log test_rhi_runtime_select test_rhi_fault_injection test_rhi_wsi_attach test_rhi_golden_parity test_editor_input_script test_editor_settings test_editor_fonts test_editor_audio_sink test_core_app_mesh test_core_app_runtime

      - name: Confirm the objects really are arm64
        run: |
          file build-arm64/libengine.a | tee /dev/stderr | grep -q 'current ar archive'
          aarch64-linux-gnu-objdump -f build-arm64/CMakeFiles/break_crash.dir/src/crash/break_crash.c.o \
            | tee /dev/stderr | grep -q 'aarch64'

      - name: Run selected tests under QEMU
        run: |
          qemu-aarch64 --version
          BREAK_TEST_NM=aarch64-linux-gnu-nm \
          BREAK_TEST_READELF=aarch64-linux-gnu-readelf \
          BREAK_TEST_STRIP=aarch64-linux-gnu-strip \
          BREAK_TEST_RUNNER='qemu-aarch64 -L /' \
          BREAK_TEST_QEMU_USER=1 \
          timeout 600 ctest --test-dir build-arm64 --verbose --no-tests=error \
            -R '^(test_break_crash|test_break_update|test_break_http|test_break_manifest_tool|test_break_crypto|test_break_keygen|test_break_integrity|test_break_authority|test_packet|test_network|test_break_online_lobby|test_break_online_nat|test_break_online_voice|test_break_voice_mixer|test_break_replay_window|test_break_msg_rate|test_break_online_aspect|test_break_replication_fragment|test_core_app_network($|_offline)|test_runtime_core($|_target_contract)|test_runtime_(facade|io|reload)$|test_ecs(_system|_replication)?$|test_replication_target_contract$|test_break_lua_(runtime|module|value|binding|handle|table|debug|ecs_apply|target_contract)$|test_break_kernel_lua$|test_(vfs|async_loader|filewatch_backend|hotreload)$|test_render_graph$|test_rhi_(dispatch|capabilities|error_contract|frame_lifecycle_contract)$|test_(profiler|clock_offset|trace_core_app|trace_merge|trace_merge_tool)$|test_(platform_config|platform_null_safety|platform_fs_write|platform_size_semantics|task|task_singleton)$|test_(physics(_replay|_sync|_hinge|_cone_twist|_identity)?|ragdoll|vehicle)$|test_(physics_slider|cloth|rope|soft_body|destructible|character)$|test_(animation|anim_(pose_authority|morph|facial|compression|locomotion|aim)|skeleton_socket)$|test_break_(nav_(bake|query|query_concurrent|follow)|perception|behavior|steer(_velocity)?|ai_(dynamic|agents|formation|smart_object|target_contract|hot_path_contract))$|test_audio(_(extended|dsp|hrtf|capture|agc|noise_gate|echo_canceller|delay_estimator|fft|noise_suppressor|residual_echo_suppressor|delay_tracker|gcc_phat|drift_estimator|drift_resampler|drift_compensator|edit|voice_processor|voice_aligner|wav|realtime_contract))?$|test_voice_playback$|test_rule_engine(_(transactions|tms|grl_semantics|ir|forall_limits|rete_incremental|agenda|backward|backward_ext|grl_surface|plugin_parity|example_coverage|query_blocks|stream_ext|stream_grl|stream_eval|backward_deep_chain|backward_bindings))?$|test_backward_machine_(structure|context)$|test_break_kernel_(actor|items|weapons|actions|move|level|area|flow|target_contract)$|test_break_flow_(graph|serial|runtime)$|test_(vegetation|time_of_day|visarea|decal|voxel|road)$|test_world_(stream(_job|_world)?|mesh_fake|presentation|presenter_fake)$|test_mesh_(stage|buffer|gpu)$|test_editor_(doc|cmd|scene|components|viewport|gizmo|assets|i18n|scene_textures)$|test_break_editor_target_contract$|test_editor_audio$|test_editor_plugin_cmds$|test_editor_plugin_host$|test_editor_plugin_sections$|test_editor_plugin_panels$|test_editor_plugin_manifest$|test_mycompose_tree$|test_mycompose_remember$|test_mycompose_store$|test_mycompose_runtime$|test_mycompose_async$|test_break_cvar$|test_break_xml$|test_editor_flow$|test_editor_image$|test_shader_io$|test_mycompose_myui$|test_mycompose_widget_primitives$|test_render_features$|test_rt_trace$|test_rhi_tlas_instance_encode$|test_rhi_metal_format_mapping$|test_input_extended$|test_mycompose_cpp20_c_fixture$|test_mycompose_cpp20$|test_mycompose_cpp20_header$|test_mycompose_cpp20_noexcept$|test_public_api_cpp20$|test_core_style_prototype$|test_fork_deadline$|test_platform_screen_simulated$|test_platform_window_mode$|test_pad_linux_feedback$|test_pad_win_feedback_portable$|test_win32_touch$|test_wayland_touch$|test_rhi_rollout_log$|test_rhi_runtime_select$|test_rhi_fault_injection$|test_rhi_wsi_attach$|test_rhi_golden_parity$|test_editor_input_script$|test_editor_settings$|test_editor_fonts$|test_editor_audio_sink$|test_core_app_mesh$|test_core_app_runtime$)'

  lane-libfuzzer-linux-clang:
    name: Linux + Clang-18 (libFuzzer, coverage-guided)
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.digest }}
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Debug -DENGINE_USE_ASAN=ON -DENGINE_USE_UBSAN=ON -DENGINE_BUILD_FUZZ_SMOKE=ON -DENGINE_BUILD_LIBFUZZER=ON -DENGINE_RHI_BACKEND=opengl

      # Fixed seed and run count: a fresh corpus directory is seeded from the
      # checked-in samples, so the run is reproducible from the commit alone.
      - name: libFuzzer (ASan/UBSan)
        run: |
          cmake --build build --parallel --target libfuzz_core_app_network libfuzz_core_app_scenario libfuzz_core_app_checkpoint
          ctest --test-dir build -L libfuzzer --output-on-failure

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: libfuzzer-crash-inputs
          path: |
            build/crash-*
            build/leak-*
            build/timeout-*
          if-no-files-found: ignore

  lane-headless-linux-gcc-tsan:
    name: Linux + GCC (TSan, headless)
    runs-on: ubuntu-24.04
    needs: image
    container:
      image: ${{ needs.image.outputs.digest }}
      # the "Lower the ASLR entropy" step writes vm.mmap_rnd_bits on the host kernel.
      options: --privileged
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Lower the ASLR entropy for TSan
        # R697: TSan cannot map its shadow on kernels with 32-bit
        # mmap randomization ("unexpected memory mapping") — the
        # upstream workaround is vm.mmap_rnd_bits=28.
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug -DENGINE_USE_TSAN=ON -DENGINE_RHI_BACKEND=opengl

      - name: Build
        run: cmake --build build --parallel

      - name: Test (headless suite)
        run: |
          set +e
          # R711: test_async_loader excluded — a pre-existing thread-lifecycle
          # race (TSan reports thread leak in platform_thread_create and data
          # races in async_loader_init/async_submit_request) unrelated to any
          # recent change; needs a dedicated async_loader threading fix.
          ctest --test-dir build -LE "graphics|fuzz|gpu|audio_device" -E "test_async_loader" --output-on-failure > /tmp/ctest.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo '## TSan suite failures (full log head)' >> "$GITHUB_STEP_SUMMARY"
            head -120 /tmp/ctest.log >> "$GITHUB_STEP_SUMMARY"
            grep -E 'FAIL|Failed|FAILED|Not Run|ThreadSanitizer|WARNING: ThreadSanitizer|SUMMARY: ThreadSanitizer|Timeout|Segmentation|abort|Aborted|CMake Error' /tmp/ctest.log | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Emit evidence receipt
        if: always()
        run: |
          lvl=HEADLESS
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=linux-wayland -DBACKEND=opengl \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -LE graphics|fuzz|gpu|audio_device -E test_async_loader (TSan)" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-headless-linux-gcc-tsan
          path: receipt.json

  lane-headless-windows-clang:
    name: Windows + Clang (headless)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # test_rhi_backend_selection sub-configures ENGINE_RHI_BACKEND=d3d12,
      # which fail-closes without the pinned Agility redist
      # (engine/CMakeLists.txt) and needs dxc for the HLSL->DXIL step.
      - name: Fetch Agility SDK (pinned)
        run: cmake -P engine/tools/fetch_d3d12_agility_sdk.cmake

      - name: Add Windows SDK dxc to PATH
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { Write-Error "dxc.exe not found in the installed Windows SDKs"; exit 1 }
          Add-Content $env:GITHUB_PATH $dxc.Directory.FullName

      # ENGINE_VULKAN=ON needs the Vulkan SDK (loader import lib + shaderc);
      # windows-latest ships none. Pinned version+hash, fail-closed
      # (engine/tools/fetch_vulkan_sdk_windows.cmake); exports VULKAN_SDK and
      # the shaderc DLL dir for the build/test steps.
      - name: Fetch and install Vulkan SDK (pinned)
        run: cmake -P engine/tools/fetch_vulkan_sdk_windows.cmake

      - name: Configure
        # GL backends stay at defaults: the desktop GL backend is WGL-loaded
        # on Windows (my_gl_desktop.c), and GLES2 honestly stubs without a
        # GLES2 SDK (configure-time discovery in engine/CMakeLists.txt).
        run: cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DENGINE_VULKAN=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Verify Break myui demo
        run: cmake --build build --target dxx_break --parallel

      # win32 runtime 步保留在本 lane（其 native-surface 证据另由
      # lane-native-surface-win32 出收据，brief :154）。
      - name: Test Win32 platform runtime
        run: |
          cmake --build build --target test_platform_config test_platform_null_safety test_platform_win32_runtime --parallel
          ctest --test-dir build --output-on-failure -R '^(test_platform_config|test_platform_null_safety|test_platform_win32_runtime)$'

      - name: Test (headless suite)
        env:
          # Vendored VulkanSDK artifacts are gitignored and absent on CI
          # checkouts; this lane provisions the pinned LunarG SDK instead
          # (engine/tools/fetch_vulkan_sdk_windows.cmake).
          ENGINE_LOCKED_DEPS_ALLOW_ABSENT: 1
        shell: bash
        run: |
          set +e
          ctest --test-dir build -LE "graphics|fuzz|gpu|audio_device" --output-on-failure > "$RUNNER_TEMP/ctest-headless.log" 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            grep -E 'FAIL|Failed|FAILED|Not Run|Timeout|Segmentation|CMake Error|lld-link|undefined symbol|undefined reference|could not find library|could not open' "$RUNNER_TEMP/ctest-headless.log" | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            # CMake script gates (e.g. the d3d12 shader compile gate) put the
            # diagnosis in the lines after "CMake Error at" — surface those.
            grep -A6 'CMake Error at' "$RUNNER_TEMP/ctest-headless.log" | head -30 | while IFS= read -r line; do
              echo "::error::ctx $line"
            done
            exit 1
          fi

      - name: Emit evidence receipt
        if: always()
        shell: bash
        run: |
          lvl=HEADLESS
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=windows -DBACKEND=vulkan \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest --test-dir build -LE graphics|fuzz|gpu|audio_device" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-headless-windows-clang
          path: receipt.json

  lane-headless-windows-asan:
    name: Windows + Clang ASan (headless)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      # Same d3d12 selector-contract prerequisite as the windows-clang job.
      - name: Fetch Agility SDK (pinned)
        run: cmake -P engine/tools/fetch_d3d12_agility_sdk.cmake

      - name: Add Windows SDK dxc to PATH
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { Write-Error "dxc.exe not found in the installed Windows SDKs"; exit 1 }
          Add-Content $env:GITHUB_PATH $dxc.Directory.FullName

      - name: Configure
        # R696: AddressSanitizer on Windows/clang — the runtime ships as
        # clang_rt.asan DLLs that the loader must find; the test step
        # copies them next to the executables after building.
        run: cmake -S engine -B build-asan -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" -DENGINE_RHI_BACKEND=opengl

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Copy the ASan runtime DLLs next to the tests
        shell: pwsh
        run: |
          $clangDir = & clang -print-resource-dir
          $src = Join-Path $clangDir 'lib\windows'
          if (-not (Test-Path $src)) { Write-Error "no ASan runtime at $src"; exit 1 }
          Get-ChildItem $src -Filter 'clang_rt.asan*.dll' |
            ForEach-Object { Copy-Item $_.FullName -Destination build-asan }
          Get-ChildItem $src -Filter 'clang_rt.asan*.dll' |
            ForEach-Object { $_.Name }

      - name: Test (headless suite under ASan)
        env:
          ASAN_OPTIONS: detect_leaks=0
          # Vendored VulkanSDK artifacts are gitignored and absent on CI
          # checkouts (lane builds the ASan matrix without the SDK).
          ENGINE_LOCKED_DEPS_ALLOW_ABSENT: 1
        shell: bash
        run: |
          set +e
          ctest --test-dir build-asan -LE "graphics|fuzz|gpu|audio_device" --output-on-failure > "$RUNNER_TEMP/ctest.log" 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            grep -E 'FAIL|Failed|FAILED|Not Run|ERROR: AddressSanitizer|SUMMARY: AddressSanitizer|runtime error|Timeout|Segmentation|abort|Aborted|LeakSanitizer|CMake Error|lld-link|undefined symbol|undefined reference|could not find library|could not open' "$RUNNER_TEMP/ctest.log" | head -60 | while IFS= read -r line; do
              echo "::error::$line"
            done
            # CMake script gates (e.g. the d3d12 shader compile gate) put the
            # diagnosis in the lines after "CMake Error at" — surface those.
            grep -A6 'CMake Error at' "$RUNNER_TEMP/ctest.log" | head -30 | while IFS= read -r line; do
              echo "::error::ctx $line"
            done
            exit 1
          fi

      - name: Emit evidence receipt
        if: always()
        shell: bash
        run: |
          lvl=HEADLESS
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=windows -DBACKEND=opengl \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest --test-dir build-asan -LE graphics|fuzz|gpu|audio_device (ASan)" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-headless-windows-asan
          path: receipt.json

  # MSVC 与 MinGW 没有别的 lane 覆盖；两者各自的编译器/链接器对同一份源码的诊断不同
  # （MSVC /W4 /WX、GCC -Werror），在这里漂移过一次（见 docs/Implementation_Status.md）。
  # 只跑 headless 套件，不宣称 GPU/窗口系统证据。
  lane-headless-windows-msvc:
    name: Windows + MSVC (headless)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Same d3d12 selector-contract prerequisite as the windows-clang job.
      - name: Fetch Agility SDK (pinned)
        run: cmake -P engine/tools/fetch_d3d12_agility_sdk.cmake

      - name: Add Windows SDK dxc to PATH
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { Write-Error "dxc.exe not found in the installed Windows SDKs"; exit 1 }
          Add-Content $env:GITHUB_PATH $dxc.Directory.FullName

      # cl.exe is not on PATH by default; this exports the x64 MSVC environment
      # (INCLUDE/LIB/PATH) to the following steps.
      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Keep Configure/Build on the default shell: with `shell: bash` the runner
      # prepends /usr/bin, whose GNU `link` shadows MSVC's link.exe.
      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_BUILD_TYPE=Debug -DENGINE_VULKAN=OFF -DENGINE_ENABLE_IPO=OFF -DENGINE_BUILD_FUZZ_SMOKE=ON

      - name: Build
        run: cmake --build build --parallel

      # The fuzz targets are EXCLUDE_FROM_ALL; without building them the
      # *_smoke tests report Not Run.
      - name: Build fuzz targets
        run: cmake --build build --target fuzz_scene_serial fuzz_net_packet fuzz_decode_image fuzz_vfs_pak fuzz_asset_gltf fuzz_mycompose_tree fuzz_mycompose_intent fuzz_core_app_checkpoint fuzz_core_app_scenario fuzz_core_app_network fuzz_break_online_voice --parallel

