        shell: bash
        run: |
          set +e
          ctest --test-dir build -LE "graphics|gpu|audio_device" --output-on-failure > "$RUNNER_TEMP/ctest.log" 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            grep -E 'FAIL|Failed|FAILED|Not Run|Timeout|Segmentation|CMake Error|error C[0-9]+|fatal error|error LNK[0-9]+' "$RUNNER_TEMP/ctest.log" | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -A6 'CMake Error at' "$RUNNER_TEMP/ctest.log" | head -30 | while IFS= read -r line; do
              echo "::error::ctx $line"
            done
            exit 1
          fi

      - name: Emit evidence receipt
        if: always()
        shell: bash
        run: |
          lvl=HEADLESS
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=windows -DBACKEND=opengl \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest --test-dir build -LE graphics|gpu|audio_device (MSVC)" -DBUILD_CONFIG=Debug \
            -DGPU=unknown \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-receipt-headless-windows-msvc
          path: receipt.json

  lane-headless-windows-mingw:
    name: Windows + MinGW GCC (headless)
