        run: |
          # 前置 /usr/bin 让 cmake=3.28.* 钉版生效（clean-room lane 先例）；
          # clang-18 显式指定（apt 只装 clang-18，无裸 clang 链接）。
          export PATH="/usr/bin:$PATH"
          cmake --version | head -1
          cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_BUILD_TYPE=Debug -DENGINE_VULKAN=ON
          cmake --build build --parallel

      - name: Run graphics suite under validation layers
        run: |
          set -o pipefail
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          vk_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' -print -quit)"
          test -n "$vk_icd"
          export VK_ICD_FILENAMES="$vk_icd"
          Xvfb :99 -screen 0 1280x720x24 -ac >/tmp/xvfb.log 2>&1 &
          trap 'kill $!' EXIT
          export DISPLAY=:99
          until xdpyinfo >/dev/null 2>&1; do sleep 0.1; done
          ctest --test-dir build -L graphics --output-on-failure 2>&1 | tee /tmp/val.log
          ! grep -q "VUID-" /tmp/val.log   # 任何 validation error 即 lane 失败

      - name: Emit evidence receipt
        if: always()
        run: |
          # GPU_RUNTIME 仅在整 lane 成功时声明；失败 lane 的收据如实降级 UNAVAILABLE。
          lvl=GPU_RUNTIME
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=linux-x11 -DBACKEND=vulkan \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -L graphics (VK_LAYER_KHRONOS_validation, lavapipe ICD)" -DBUILD_CONFIG=Debug \
            -DGPU="lavapipe (software ICD via VK_ICD_FILENAMES)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-validation-linux
          path: receipt.json

  # ---- lane: benchmark（evidence_level 如实标注；lavapipe 软渲染与真 GPU 不可比）----
  lane-benchmark-linux-vk:
    name: "lane: benchmark (linux vulkan, lavapipe)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        timeout-minutes: 20
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          # R675: each attempt is capped and retried -- a hung mirror otherwise
          # ate the whole step (R674 run: one job timed out at 10 min while
          # every other job installed in ~1 min). man-db triggers are skipped.
          sudo rm -f /var/lib/man-db/auto-update
          # R677: each failed attempt publishes the tail of its output as
          # ::warning:: annotations (job logs are not readable anonymously).
          # R676: usage apt_retry <seconds-per-attempt> <apt-get args>. A failed
          # attempt moves the runner off its Azure mirror to archive.ubuntu.com
          # (R675 run: three 240 s attempts on the same stalled mirror).
          apt_retry() { t=$1; shift; for i in 1 2 3; do if ( set -o pipefail; sudo timeout "$t" apt-get $APT_OPTS "$@" 2>&1 | tee /tmp/apt-attempt.log ); then return 0; fi; echo "::warning::apt-get $1 attempt $i failed or timed out after ${t}s; last output:"; tail -8 /tmp/apt-attempt.log | while IFS= read -r l; do echo "::warning::  $l"; done; sudo sed -i "s#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo dpkg --configure -a || true; [ "$1" = install ] && sudo timeout 120 apt-get $APT_OPTS update || true; sleep 5; done; return 1; }
          # R678: no fonts-noto-cjk here (61 MB, the largest download; R677
          # caught this lane timing out on it twice) -- this lane runs no font
          # test; the headless lanes keep it for test_myui_font's CJK cases.
          apt_retry 120 update
          apt_retry 360 install -y --no-install-recommends \
            clang-18 lld-18 llvm-18-tools cmake=3.28.* ninja-build libx11-dev libxrandr-dev \
            libvulkan-dev=1.3.275.* libshaderc-dev=2023.8* \
            libfreetype6-dev mesa-vulkan-drivers xvfb x11-utils

      - name: Configure / build
        run: |
          export PATH="/usr/bin:$PATH"
          cmake --version | head -1
          # Release IPO 把 LLVM bitcode 写入 libengine.a，默认 GNU ld 链不动
          # （toolchain-clang-linux.cmake 记载的同一坑）；本 lane 无裸 clang/lld，
          # 按 -18 后缀接线等价物。
          # CMAKE_AR/RANLIB 必须绝对路径：裸名字会被当相对路径解析到
          # workspace（/bin/sh: workspace/llvm-ar-18: not found）。
          cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_AR=/usr/bin/llvm-ar-18 -DCMAKE_RANLIB=/usr/bin/llvm-ranlib-18 \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld-18" \
            -DCMAKE_BUILD_TYPE=Release -DENGINE_VULKAN=ON
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee /tmp/bench_build.log || {
            grep -m 8 -E "error:|fatal error:|undefined reference|cannot find -l|No rule to make target|ld: |plugin needed|multiple definition|cannot open|not found|CMake Error" /tmp/bench_build.log \
              | head -c 1500 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Run benchmark
        run: |
          # 实际 benchmark target 为 rhi_swapchain_bench <out.json>（600 帧定长；
          # 无 --seconds/--headless-lavapipe CLI，偏差记录见 task-7 报告）。
          # 软渲染经 Xvfb + VK_ICD_FILENAMES(lvp) 提供。
          vk_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' -print -quit)"
          test -n "$vk_icd"
          export VK_ICD_FILENAMES="$vk_icd"
          Xvfb :99 -screen 0 1280x720x24 -ac >/tmp/xvfb.log 2>&1 &
          trap 'kill $!' EXIT
          export DISPLAY=:99
          until xdpyinfo >/dev/null 2>&1; do sleep 0.1; done
          ./build/rhi_swapchain_bench metrics.json

      - name: Emit benchmark receipt
        run: |
          # lavapipe 软渲染 fps 与真 GPU 不可比：evidence_level 如实标
          # GPU_RUNTIME（BENCHMARK_COMPARABLE 仅授予真机收据，如
          # lane-benchmark-steam-deck-vk 与本机 D3D12/VK 收据），command 注明
          # lavapipe；metrics 照填供台账留档。
          m() { python3 -c "import json;print(json.load(open('metrics.json'))['metrics']['$1'])"; }
          cmake -DOUT=receipt.json -DPLATFORM=linux-x11 -DBACKEND=vulkan \
            -DEVIDENCE_LEVEL=GPU_RUNTIME -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="rhi_swapchain_bench metrics.json (lavapipe software ICD, 600 frames)" \
            -DBUILD_CONFIG=Release \
            -DGPU="$(python3 -c "import json;print(json.load(open('metrics.json'))['gpu'] or 'unknown')")" \
            -DDRIVER_VERSION="$(python3 -c "import json;print(json.load(open('metrics.json'))['driver_version'] or 'unknown')")" \
            -DCPU="$(uname -m)" -DRAM=unknown \
            -DFPS_AVG=$(m fps_avg) \
            -DFPS_P1=$(m fps_p1) \
            -DFRAME_MS_AVG=$(m frame_ms_avg) \
            -DFRAME_MS_P99=$(m frame_ms_p99) \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-benchmark-linux-vk
          path: receipt.json

  lane-benchmark-steam-deck-vk:
    name: Steam Deck / Linux real-GPU Vulkan benchmark
    # 真 GPU 自托管 benchmark lane：BENCHMARK_COMPARABLE 真机证据归这里
    # （lavapipe 上的 lane-benchmark-linux-vk 只出 GPU_RUNTIME 收据）。
    # GitHub-hosted 运行器上没有 self-hosted 标签可接单，不加 if 会永久 pending。
    if: vars.ENABLE_GPU_LANES == '1'
    runs-on: [self-hosted, linux, gpu-vulkan]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          # R675: each attempt is capped and retried -- a hung mirror otherwise
          # ate the whole step (R674 run: one job timed out at 10 min while
          # every other job installed in ~1 min). man-db triggers are skipped.
          sudo rm -f /var/lib/man-db/auto-update
          # R677: each failed attempt publishes the tail of its output as
          # ::warning:: annotations (job logs are not readable anonymously).
          # R676: usage apt_retry <seconds-per-attempt> <apt-get args>. A failed
          # attempt moves the runner off its Azure mirror to archive.ubuntu.com
          # (R675 run: three 240 s attempts on the same stalled mirror).
          apt_retry() { t=$1; shift; for i in 1 2 3; do if ( set -o pipefail; sudo timeout "$t" apt-get $APT_OPTS "$@" 2>&1 | tee /tmp/apt-attempt.log ); then return 0; fi; echo "::warning::apt-get $1 attempt $i failed or timed out after ${t}s; last output:"; tail -8 /tmp/apt-attempt.log | while IFS= read -r l; do echo "::warning::  $l"; done; sudo sed -i "s#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo dpkg --configure -a || true; [ "$1" = install ] && sudo timeout 120 apt-get $APT_OPTS update || true; sleep 5; done; return 1; }
          # R678: no fonts-noto-cjk here (61 MB, the largest download; R677
          # caught this lane timing out on it twice) -- this lane runs no font
          # test; the headless lanes keep it for test_myui_font's CJK cases.
          apt_retry 120 update
          # 钉版候选取自 ubuntu-24.04 (noble)：self-hosted runner 需为 24.04。
          apt_retry 360 install -y --no-install-recommends \
            build-essential cmake ninja-build libx11-dev libxrandr-dev \
            libvulkan-dev=1.3.275.* libshaderc-dev=2023.8* libfreetype6-dev

      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENGINE_VULKAN=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Graphics suite (GPU-runtime evidence)
        run: ctest --test-dir build -L graphics --output-on-failure

      - name: Benchmark receipt
        env:
          RECEIPT_RUNNER: ${{ runner.name }}
          RECEIPT_OS_VERSION: ${{ runner.os }}
          RECEIPT_BUILD_CONFIG: RelWithDebInfo
          GIT_COMMIT: ${{ github.sha }}
        run: |
          # RECEIPT_TIMESTAMP 不能写在 env: 块——那里不会求值 $(...)。
          export RECEIPT_TIMESTAMP="$(date -u +%FT%TZ)"
          set +e
          ./build/rhi_swapchain_bench build/rhi_receipt_steam_deck.json
          rc=$?
          set -e
          # 环境缺显示/GPU 时 bench 以 77 退出：记为 unavailable 证据，不算通过。
          if [ $rc -eq 77 ]; then
            echo "::warning::bench skipped (no display/GPU on this runner) — no receipt produced"
            exit 0
          fi
          test $rc -eq 0
          cmake -DRECEIPT=build/rhi_receipt_steam_deck.json \
            -P engine/tests/test_rhi_benchmark_receipt_validate.cmake
          cmake -DRECEIPT=build/rhi_receipt_steam_deck.json \
            -P engine/tests/test_evidence_receipt_schema.cmake
          # BENCHMARK_COMPARABLE 归本真机 lane：bench 自产收据硬编码
          # GPU_RUNTIME（rhi_swapchain_bench.c），故用生成器按同一实测重建
          # 台账收据（I1）；gpu/driver 空值回落 unknown（M2）。
          j() { python3 -c "import json;print(json.load(open('build/rhi_receipt_steam_deck.json'))$1 or 'unknown')"; }
          jm() { python3 -c "import json;print(json.load(open('build/rhi_receipt_steam_deck.json'))['metrics']['$1'])"; }
          cmake -DOUT=receipt.json -DPLATFORM=linux-x11 -DBACKEND=vulkan \
            -DEVIDENCE_LEVEL=BENCHMARK_COMPARABLE -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="rhi_swapchain_bench (real GPU, 600 frames)" -DBUILD_CONFIG=RelWithDebInfo \
            -DGPU="$(j "['gpu']")" \
            -DDRIVER_VERSION="$(j "['driver_version']")" \
            -DCPU="$(uname -m)" -DRAM=unknown \
            -DFPS_AVG=$(jm fps_avg) \
            -DFPS_P1=$(jm fps_p1) \
            -DFRAME_MS_AVG=$(jm frame_ms_avg) \
            -DFRAME_MS_P99=$(jm frame_ms_p99) \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-receipt-benchmark-steam-deck
          path: |
            receipt.json
            build/rhi_receipt_steam_deck.json
          if-no-files-found: ignore

  # ---- lane: proton（兼容验证，不计入 Windows D3D12 证据；schedule + 手动触发）----
  lane-proton:
    name: "lane: proton compatibility (reference only)"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Build under Steam Runtime (pinned)
        id: steamrt
        continue-on-error: true   # 参考 lane：失败记 UNAVAILABLE 收据，不红
        run: |
          # steamrt sniper 钉 digest（registry.gitlab.steamos.cloud 匿名 token
          # 实测 2026-10-17：latest 为单架构 docker manifest v2，linux/amd64，
          # 镜像 built 2026-09-28；取法见 task-7 报告）。
          docker run --rm -v "$GITHUB_WORKSPACE":/src -w /src \
            registry.gitlab.steamos.cloud/steamrt/sniper/sdk@sha256:9ae8083ee9ae6298361a62f289e62f0a2b0779d23fc8c276304157f0c06010c5 \
            bash -c "cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel && ctest --test-dir build -LE 'graphics|fuzz' --output-on-failure"

      - name: Emit evidence receipt
        if: always()
        run: |
          if [ "${{ steps.steamrt.outcome }}" = "success" ]; then lvl=HEADLESS; else lvl=UNAVAILABLE; fi
          echo "steamrt outcome=${{ steps.steamrt.outcome }} -> evidence_level=$lvl"
          cmake -DOUT=receipt.json -DPLATFORM=proton -DBACKEND=vulkan \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="docker steamrt sniper sdk (pinned digest) build + ctest -LE graphics|fuzz" \
            -DBUILD_CONFIG=Release \
            -DGPU=none -DDRIVER_VERSION=none -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-proton
          path: receipt.json

  ios-metal-build:
    # Simulator evidence = compile only (marking 1 of 3: lane comment)
    name: iOS native Metal build-only (Simulator evidence = compile only)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer && xcodebuild -version

      - name: Install shader toolchain
        run: brew install shaderc spirv-cross

      - name: Configure (iOS, metal)
        run: cmake -S engine -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DENGINE_RHI_BACKEND=metal -DENGINE_BUILD_TESTS=OFF

      - name: Build (iOS Simulator destination)
        run: xcodebuild -project build-ios/PureCEngine.xcodeproj -scheme engine_demo -destination 'generic/platform=iOS Simulator' build

      - name: Verify artifact
        run: |
          test -s build-ios/metal_shaders/engine.metallib
          test -d build-ios/Debug-iphonesimulator/engine_demo.app
          test -s build-ios/Debug-iphonesimulator/engine_demo.app/engine.metallib

  clean-room:
    # headless 证据 lane：git archive 干净导出 + 仅锁定依赖（spec §8.2 headless 类；
    # task 2 交付，保留原名；不产出 GPU 收据 artifact）。
    name: Clean-room build (locked deps, fresh export)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 钉版以 ubuntu-24.04 (noble) apt-cache policy 实测候选为准：
      # cmake=3.28.3 / libvulkan-dev=1.3.275.0-1build1 / libshaderc-dev=2023.8-1build1。
      - name: Install pinned toolchain
        timeout-minutes: 20
        run: |
          set +e
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          # R675: each attempt is capped and retried -- a hung mirror otherwise
          # ate the whole step (R674 run: one job timed out at 10 min while
          # every other job installed in ~1 min). man-db triggers are skipped.
          sudo rm -f /var/lib/man-db/auto-update
          # R677: each failed attempt publishes the tail of its output as
          # ::warning:: annotations (job logs are not readable anonymously).
          # R676: usage apt_retry <seconds-per-attempt> <apt-get args>. A failed
          # attempt moves the runner off its Azure mirror to archive.ubuntu.com
          # (R675 run: three 240 s attempts on the same stalled mirror).
          apt_retry() { t=$1; shift; for i in 1 2 3; do if ( set -o pipefail; sudo timeout "$t" apt-get $APT_OPTS "$@" 2>&1 | tee /tmp/apt-attempt.log ); then return 0; fi; echo "::warning::apt-get $1 attempt $i failed or timed out after ${t}s; last output:"; tail -8 /tmp/apt-attempt.log | while IFS= read -r l; do echo "::warning::  $l"; done; sudo sed -i "s#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo dpkg --configure -a || true; [ "$1" = install ] && sudo timeout 120 apt-get $APT_OPTS update || true; sleep 5; done; return 1; }
          # R678: no fonts-noto-cjk here (61 MB, the largest download; R677
          # caught this lane timing out on it twice) -- this lane runs no font
          # test; the headless lanes keep it for test_myui_font's CJK cases.
          apt_retry 120 update
          apt_retry 360 install -y --no-install-recommends \
            clang-18 lld-18 cmake=3.28.* ninja-build libx11-dev libxrandr-dev \
            libvulkan-dev=1.3.275.* libshaderc-dev=2023.8* \
            libfreetype6-dev mesa-vulkan-drivers > /tmp/apt-install.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            tail -40 /tmp/apt-install.log | while IFS= read -r line; do echo "::error::$line"; done
            echo '## apt pin diagnosis' >> "$GITHUB_STEP_SUMMARY"
            apt-cache policy cmake "libvulkan-dev" "libshaderc-dev" clang-18 lld-18 >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            exit $rc
          fi

      - name: Clean-room configure/build/test
        run: |
          # runner 的 toolcache cmake (/usr/local/bin) 会遮蔽 apt 钉版的
          # /usr/bin/cmake；前置 /usr/bin 让 cmake=3.28.* 钉版真实生效。
          export PATH="/usr/bin:$PATH"
          cmake --version | head -1
          bash engine/tools/clean_room_build.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/clean-room" --backend vulkan

