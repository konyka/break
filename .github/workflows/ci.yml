    # 证据 lane；headless 全量（含同一步 win32 trio）仍在 lane-headless-windows-clang。
    name: Windows + Clang (win32 native surface)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Agility SDK (pinned)
        run: cmake -P engine/tools/fetch_d3d12_agility_sdk.cmake

      - name: Add Windows SDK dxc to PATH
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { Write-Error "dxc.exe not found in the installed Windows SDKs"; exit 1 }
          Add-Content $env:GITHUB_PATH $dxc.Directory.FullName

      - name: Fetch and install Vulkan SDK (pinned)
        run: cmake -P engine/tools/fetch_vulkan_sdk_windows.cmake

      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DENGINE_VULKAN=ON

      - name: Test Win32 platform runtime
        run: |
          cmake --build build --parallel --target test_platform_config test_platform_null_safety test_platform_win32_runtime
          ctest --test-dir build --output-on-failure -R '^(test_platform_config|test_platform_null_safety|test_platform_win32_runtime)$'

      - name: Emit evidence receipt
        if: always()
        shell: bash
        run: |
          lvl=NATIVE_SURFACE
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=windows -DBACKEND=vulkan \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -R test_platform_win32_runtime (win32 runtime trio)" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-native-surface-win32
          path: receipt.json

  lane-native-surface-cocoa:
    # 原 macos-vulkan（brief :160）：test_platform_cocoa_runtime 的 native-surface
    # 证据；MoltenVK 后端（schema backend=vulkan-moltenvk）。
    name: macOS Cocoa + MoltenVK (Clang)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # spirv-cross: test_rhi_backend_selection (headless suite) asserts the
        # metal selector configures successfully on APPLE; that nested
        # configure fail-closes on the missing MSL toolchain
        # (find_program spirv-cross REQUIRED in engine/CMakeLists.txt).
        run: brew install molten-vk vulkan-headers shaderc spirv-cross freetype

      - name: Configure
        run: |
          # The brew molten-vk keg ships libMoltenVK.dylib only — there is no
          # libvulkan.dylib in it (the historical path this job passed made
          # make fail instantly with "No rule to make target"; CMake does not
          # validate an explicit Vulkan_LIBRARY cache value at configure
          # time). Link the MoltenVK dylib directly: it exports the full
          # Vulkan API entry points.
          VULKAN_LIB="$(brew --prefix molten-vk)/lib/libMoltenVK.dylib"
          test -f "$VULKAN_LIB" || echo "::error::MoltenVK dylib not found at $VULKAN_LIB"
          VULKAN_HEADERS="$(brew --prefix vulkan-headers)"
          SHADERC_LIB="$(brew --prefix shaderc)/lib/libshaderc_shared.dylib"
          SHADERC_INCLUDE_DIR="$(brew --prefix shaderc)/include"
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Debug \
            -DENGINE_VULKAN=ON \
            -DCMAKE_C_FLAGS="-I$SHADERC_INCLUDE_DIR" \
            -DVulkan_LIBRARY="$VULKAN_LIB" \
            -DVulkan_INCLUDE_DIR="$VULKAN_HEADERS/include" \
            -DSHADERC_LIB:PATH="$SHADERC_LIB" \
            -DSHADERC_INCLUDE_DIR:PATH="$SHADERC_INCLUDE_DIR"
          # Diagnostics surfaced as annotations (logs need auth to read):
          # the actual brew shaderc layout and the cached CMake value.
          echo "::warning::shaderc prefix: $(brew --prefix shaderc)"
          find -H "$(brew --prefix shaderc)" -name "shaderc.h" 2>/dev/null | head -3 \
            | while IFS= read -r f; do echo "::warning::shaderc header at: $f"; done
          grep -m 1 "SHADERC_INCLUDE_DIR:" build/CMakeCache.txt \
            | while IFS= read -r line; do echo "::warning::cmake cache: $line"; done
          printf '#include <shaderc/shaderc.h>\nint main(void){return 0;}\n' > /tmp/sc_probe.c
          if cc -c /tmp/sc_probe.c -I"$SHADERC_INCLUDE_DIR" -o /tmp/sc_probe.o 2>/dev/null; then
            echo "::warning::shaderc header probe: COMPILES"
          else
            echo "::error::shaderc header probe FAILED for -I$SHADERC_INCLUDE_DIR"
          fi
          ls "$SHADERC_INCLUDE_DIR" 2>&1 | head -5 \
            | while IFS= read -r f; do echo "::warning::include dir entry: $f"; done
          # Definitive: generate engine's compile flags (no compilation) and
          # dump the include list. This runs in Configure, before any build
          # failure can short-circuit later steps.
          (cd build && make CMakeFiles/engine.dir/flags.make >/dev/null 2>&1 || true)
          FM="build/CMakeFiles/engine.dir/flags.make"
          if [ -f "$FM" ]; then
            echo "::warning::engine flags shaderc count: $(grep -c shaderc "$FM")"
            grep -m 1 "C_INCLUDES" "$FM" | head -c 250 \
              | while IFS= read -r c; do echo "::warning::engine C_INCLUDES: $c"; done
          else
            echo "::warning::engine flags.make MISSING at $FM"
            find build -name flags.make | head -5 | while IFS= read -r f; do echo "::warning::flags.make found: $f"; done
          fi

      - name: Build Break myui demo
        run: |
          set -o pipefail
          cmake --build build --target dxx_break --parallel 2>&1 | tee /tmp/macos_build.log || {
            echo "::error::macOS dxx_break build failed; first diagnostics:"
            grep -m 5 -E "error:|fatal error:|No rule to make target|Cannot find|ld: " /tmp/macos_build.log \
              | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Build and test Cocoa runtime
        run: |
          set -o pipefail
          # Full build: the headless suite below runs every non-graphics test,
          # so all test executables must exist (the dxx_break-only build above
          # leaves ctest with "(Not Run)" entries for every other test).
          cmake --build build --parallel -- VERBOSE=1 2>&1 | tee /tmp/macos_full.log || {
            # ld warnings match "ld: " and would eat the -m budget, so
            # compiler errors are surfaced first.
            grep -m 8 -E "error:|fatal error:" /tmp/macos_full.log \
              | while IFS= read -r line; do echo "::error::${line}"; done
            grep -m 3 -E "No rule to make target|Undefined symbols|ld: (framework|library) " /tmp/macos_full.log \
              | while IFS= read -r line; do echo "::error::${line}"; done
            # Which target owns the failing rhi_vk.c compile? The object path
            # encodes it: CMakeFiles/<target>.dir/...
            grep -m 1 -o "CMakeFiles/[^/]*/[^ ]*rhi_vk\.c\.o" /tmp/macos_full.log \
              | while IFS= read -r t; do echo "::error::rhi_vk object target: $t"; done
            FM=$(find build -name flags.make -path "*engine.dir*" 2>/dev/null | head -1)
            echo "::warning::engine flags.make at: ${FM:-NOT FOUND}"
            if [ -n "$FM" ]; then
              echo "::warning::shaderc occurrences in engine flags: $(grep -c shaderc "$FM")"
            fi
            exit 1
          }
          ctest --test-dir build --output-on-failure -R '^(test_platform_config|test_platform_null_safety|test_platform_cocoa_runtime)$' 2>&1 | tee /tmp/macos_cocoa_test.log || {
            echo "::error::macOS Cocoa runtime test failures:"
            grep -m 5 -E "\(Failed\)|\(Not Run\)|\(Timeout\)" /tmp/macos_cocoa_test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Test (headless suite)
        run: |
          set -o pipefail
          # GitHub macOS runners have no Metal window session: MoltenVK
          # raises an NSException from inside vkCreateInstance (and from its
          # own load-time background work) that terminates the process with
          # SIGABRT before C code can observe an error. The two tests that
          # link MoltenVK honor this marker and skip with a printed reason;
          # a local macOS machine with a GPU runs them in full.
          export BREAK_MYUI_SKIP_VK_SENSITIVE=1
          ctest --test-dir build -LE "graphics|fuzz" --output-on-failure 2>&1 | tee /tmp/macos_headless.log || {
            # Surface which tests failed first — the vgcanvas tail below is
            # only a supplementary dump, not a failure identifier.
            grep -E "\(Failed\)|\(Timeout\)|\(Not Run\)|FAIL:|CMake Error" /tmp/macos_headless.log | head -30 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            t=test_myui_vgcanvas_backend
            if [ -x "build/$t" ]; then
              echo "::error::final output lines $t (unfiltered tail):"
              ( cd build && ./"$t" 2>&1 || true ) | tail -8 \
                | while IFS= read -r line; do echo "::error::${line}"; done
            fi
            exit 1
          }

      - name: Emit evidence receipt
        if: always()
        run: |
          lvl=NATIVE_SURFACE
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=macos -DBACKEND=vulkan-moltenvk \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -R test_platform_cocoa_runtime" -DBUILD_CONFIG=Debug \
            -DGPU="$(vulkaninfo --summary 2>/dev/null | grep -m1 deviceName || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-native-surface-cocoa
          path: receipt.json

  # ---- lane: GPU-runtime（真实 GPU/软渲染 ICD 跑通帧；evidence_level=GPU_RUNTIME）----
  lane-gpu-runtime-linux-gl:
    # DEPRECATED（task 6 删除）：兼容期保留的 X11+OpenGL lane（brief :121），
    # 不再扩展；Xvfb + LIBGL_ALWAYS_SOFTWARE 下跑 X11/GL runtime。
    name: Linux X11 + OpenGL (GCC)
    # R680: pinned like every other Linux lane -- ubuntu-latest moves to
    # Ubuntu 26 from 2026-10-19 (runner-images#14748).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          # R675: each attempt is capped and retried -- a hung mirror otherwise
          # ate the whole step (R674 run: one job timed out at 10 min while
          # every other job installed in ~1 min). man-db triggers are skipped.
          sudo rm -f /var/lib/man-db/auto-update
          # R677: each failed attempt publishes the tail of its output as
          # ::warning:: annotations (job logs are not readable anonymously).
          # R676: usage apt_retry <seconds-per-attempt> <apt-get args>. A failed
          # attempt moves the runner off its Azure mirror to archive.ubuntu.com
          # (R675 run: three 240 s attempts on the same stalled mirror).
          apt_retry() { t=$1; shift; for i in 1 2 3; do if ( set -o pipefail; sudo timeout "$t" apt-get $APT_OPTS "$@" 2>&1 | tee /tmp/apt-attempt.log ); then return 0; fi; echo "::warning::apt-get $1 attempt $i failed or timed out after ${t}s; last output:"; tail -8 /tmp/apt-attempt.log | while IFS= read -r l; do echo "::warning::  $l"; done; sudo sed -i "s#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo dpkg --configure -a || true; [ "$1" = install ] && sudo timeout 120 apt-get $APT_OPTS update || true; sleep 5; done; return 1; }
          apt_retry 120 update
          apt_retry 360 install -y --no-install-recommends \
            build-essential cmake libx11-dev libxrandr-dev libgl1-mesa-dev \
            libfreetype6-dev xvfb x11-utils

      - name: Install CJK test font (optional)
        # R679: fonts-noto-cjk (61 MB) is the download every stalled apt run
        # was caught on (R677/R678 annotations). Only test_myui_font's CJK
        # cases use it and they SKIP without it, so a stall here no longer
        # fails the job.
        continue-on-error: true
        timeout-minutes: 7
        run: |
          sudo timeout 360 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends fonts-noto-cjk \
            || echo "::warning::fonts-noto-cjk not installed; the CJK font cases will SKIP"

      - name: Configure
        run: cmake -S engine -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test (headless suite)
        run: |
          if ! ctest --test-dir build -LE "graphics|fuzz" --output-on-failure; then
            echo '## Headless suite failures (rerun)' >> "$GITHUB_STEP_SUMMARY"
            ctest --test-dir build -LE "graphics|fuzz" --rerun-failed --output-on-failure > /tmp/ctest-rerun.log 2>&1 || true
            grep -E "FAIL|Failed|FAILED|Not Run|LeakSanitizer|ERROR: AddressSanitizer|colored pixels|selftest|CMake Error" /tmp/ctest-rerun.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            cat /tmp/ctest-rerun.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Test X11/OpenGL runtime
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac >/tmp/xvfb-gl.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid"' EXIT
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          until xdpyinfo >/dev/null 2>&1; do sleep 0.1; done
          ctest --test-dir build --output-on-failure -R \
            '^(test_platform_x11_runtime|test_rhi_x11_runtime)$'

      - name: Emit evidence receipt
        if: always()
        run: |
          # GPU_RUNTIME 仅在整 lane 成功时声明；失败 lane 的收据如实降级 UNAVAILABLE。
          lvl=GPU_RUNTIME
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=linux-x11 -DBACKEND=opengl \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -R x11_runtime (Xvfb + LIBGL_ALWAYS_SOFTWARE)" -DBUILD_CONFIG=Debug \
            -DGPU="mesa software rasterizer (LIBGL_ALWAYS_SOFTWARE=1)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-gpu-runtime-linux-gl
          path: receipt.json

  lane-gpu-runtime-linux-vk:
    # 原 vk + linux-graphics-smoke 合并（brief :163）：钉版工具链 + lavapipe
    # VK_ICD_FILENAMES，headless 全量与 graphics suite 同 lane 出 GPU_RUNTIME 收据。
    name: Linux X11 + Vulkan (lavapipe, Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        timeout-minutes: 20
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          # R675: each attempt is capped and retried -- a hung mirror otherwise
          # ate the whole step (R674 run: one job timed out at 10 min while
          # every other job installed in ~1 min). man-db triggers are skipped.
          sudo rm -f /var/lib/man-db/auto-update
          # R677: each failed attempt publishes the tail of its output as
          # ::warning:: annotations (job logs are not readable anonymously).
          # R676: usage apt_retry <seconds-per-attempt> <apt-get args>. A failed
          # attempt moves the runner off its Azure mirror to archive.ubuntu.com
          # (R675 run: three 240 s attempts on the same stalled mirror).
          apt_retry() { t=$1; shift; for i in 1 2 3; do if ( set -o pipefail; sudo timeout "$t" apt-get $APT_OPTS "$@" 2>&1 | tee /tmp/apt-attempt.log ); then return 0; fi; echo "::warning::apt-get $1 attempt $i failed or timed out after ${t}s; last output:"; tail -8 /tmp/apt-attempt.log | while IFS= read -r l; do echo "::warning::  $l"; done; sudo sed -i "s#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo dpkg --configure -a || true; [ "$1" = install ] && sudo timeout 120 apt-get $APT_OPTS update || true; sleep 5; done; return 1; }
          apt_retry 120 update
          apt_retry 360 install -y --no-install-recommends \
            clang-18 lld-18 cmake=3.28.* ninja-build libx11-dev libxrandr-dev \
            libgl1-mesa-dev libgl1-mesa-dri \
            libvulkan-dev=1.3.275.* libshaderc-dev=2023.8* \
            libfreetype6-dev mesa-vulkan-drivers xvfb x11-utils

      - name: Install CJK test font (optional)
        # R679: fonts-noto-cjk (61 MB) is the download every stalled apt run
        # was caught on (R677/R678 annotations). Only test_myui_font's CJK
        # cases use it and they SKIP without it, so a stall here no longer
        # fails the job.
        continue-on-error: true
        timeout-minutes: 7
        run: |
          sudo timeout 360 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends fonts-noto-cjk \
            || echo "::warning::fonts-noto-cjk not installed; the CJK font cases will SKIP"

      - name: Configure
        # runner 的 toolcache cmake (/usr/local/bin) 会遮蔽 apt 钉版的
        # /usr/bin/cmake；前置 /usr/bin 让 cmake=3.28.* 钉版真实生效。
        run: |
          export PATH="/usr/bin:$PATH"
          cmake --version | head -1
          cmake -S engine -B build -G Ninja -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_BUILD_TYPE=Debug -DENGINE_VULKAN=ON

      - name: Build
        run: |
          set -o pipefail
          # Logs need auth to read: surface the compiler errors as
          # annotations (wayland lane pattern). Link failures need the
          # "undefined reference" lines and the failing link target too.
          cmake --build build --parallel 2>&1 | tee /tmp/vk_build.log || {
            grep -m 8 -E "error:|fatal error:|undefined reference|cannot find -l|No rule to make target" /tmp/vk_build.log \
              | head -c 1500 | while IFS= read -r line; do echo "::error::${line}"; done
            grep -B4 -m 2 "collect2: error" /tmp/vk_build.log \
              | head -c 1500 | while IFS= read -r line; do echo "::error::linkctx ${line}"; done
            exit 1
          }

      - name: Test (headless suite)
        run: |
          if ! ctest --test-dir build -LE "graphics|fuzz" --output-on-failure; then
            echo '## Headless suite failures (rerun)' >> "$GITHUB_STEP_SUMMARY"
            ctest --test-dir build -LE "graphics|fuzz" --rerun-failed --output-on-failure > /tmp/ctest-rerun.log 2>&1 || true
            grep -E "FAIL|Failed|FAILED|Not Run|LeakSanitizer|ERROR: AddressSanitizer|colored pixels|selftest|CMake Error" /tmp/ctest-rerun.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            cat /tmp/ctest-rerun.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Test graphics smoke
        run: |
          test -x "$(command -v Xvfb)"
          vk_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' -print -quit)"
          test -n "$vk_icd"
          Xvfb :99 -screen 0 1280x720x24 -ac >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid"' EXIT
          export DISPLAY=:99
          until xdpyinfo >/dev/null 2>&1; do sleep 0.1; done
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          export VK_ICD_FILENAMES="$vk_icd"
          ctest --test-dir build -L graphics --output-on-failure

      - name: Emit evidence receipt
        if: always()
        run: |
          # GPU_RUNTIME 仅在整 lane 成功时声明；失败 lane 的收据如实降级 UNAVAILABLE。
          lvl=GPU_RUNTIME
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; echo "job ${{ job.status }} -> evidence_level=UNAVAILABLE"; fi
          cmake -DOUT=receipt.json -DPLATFORM=linux-x11 -DBACKEND=vulkan \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -L graphics (lavapipe ICD, Xvfb)" -DBUILD_CONFIG=Debug \
            -DGPU="lavapipe (software ICD via VK_ICD_FILENAMES)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-gpu-runtime-linux
          path: receipt.json

  lane-gpu-runtime-macos-metal:
    # 计划 C lane（brief :164）：GitHub hosted macOS 无 Metal GPU 窗口会话，
    # graphics 契约整体跳过（77）时收据如实降级 HEADLESS，不伪造 GPU_RUNTIME；
    # 真机/self-hosted runner 上 graphics 全绿才标 GPU_RUNTIME。
    name: macOS native Metal (Clang)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer && xcodebuild -version

      - name: Install shader toolchain
        run: brew install shaderc spirv-cross

      - name: Configure (metal)
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENGINE_RHI_BACKEND=metal -DMYUI_PAL=cocoa

      - name: Build
        run: cmake --build build --parallel

      - name: Verify metallib artifact
        run: test -s build/metal_shaders/engine.metallib && xcrun metal-nm build/metal_shaders/engine.metallib | head -5

      - name: Headless + contract tests
        # On failure, mirror the failing tests into workflow annotations:
        # this repo's log download needs elevated token rights, annotations
        # stay readable through the checks API.
        run: |
          ctest --test-dir build -LE "graphics|fuzz" --parallel 4 --output-on-failure || {
            rc=$?
            if [ -f build/Testing/Temporary/LastTestsFailed.log ]; then
              head -10 build/Testing/Temporary/LastTestsFailed.log | while IFS= read -r t; do echo "::error::ctest failed: $t"; done
            else
              echo "::error::ctest exited $rc with no LastTestsFailed.log (no tests found?)"
              tail -5 build/Testing/Temporary/LastTest.log 2>/dev/null | while IFS= read -r l; do echo "::notice::$l"; done
            fi
            exit $rc
          }

      - name: Metal device contract (GPU when available)
        id: metal_graphics
        continue-on-error: true
        run: |
          set +e
          out="$(ctest --test-dir build -L graphics --output-on-failure 2>&1)"
          rc=$?
          printf '%s\n' "$out"
          # '   Passed' 只锚定逐测试结果行（N/M Test #x: ...   Passed），
          # 不会误计小写 'tests passed' 汇总行；'***Skipped' 是
          # SKIP_RETURN_CODE 的 ctest 标记（不影响 rc）。
          skipped=$(printf '%s\n' "$out" | grep -c '\*\*\*Skipped' || true)
          passed=$(printf '%s\n' "$out" | grep -c '   Passed' || true)
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          exit $rc   # 77 skip not fatal; GPU runners count as receipts

      - name: Emit evidence receipt
        if: always()
        run: |
          # 降级阶梯（M1）：GPU_RUNTIME=graphics 真实跑过且全过（rc=0、零
          # Skipped、≥1 Passed）；rc!=0（跑了且有失败）=UNAVAILABLE；rc=0 但
          # 全 skip（hosted 无 Metal 会话）=HEADLESS——command 字段如实区分。
          rc="${{ steps.metal_graphics.outputs.rc }}"; skipped="${{ steps.metal_graphics.outputs.skipped }}"; passed="${{ steps.metal_graphics.outputs.passed }}"
          : "${rc:=1}"; : "${skipped:=1}"; : "${passed:=0}"
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE; cmd="ctest -L graphics (lane failed before graphics)"
          elif [ "$rc" != "0" ]; then lvl=UNAVAILABLE; cmd="ctest -L graphics (metal device contract failed)"
          elif [ "$skipped" = "0" ] && [ "$passed" -gt 0 ]; then lvl=GPU_RUNTIME; cmd="ctest -L graphics (metal device contract)"
          elif [ "$skipped" -gt 0 ]; then lvl=HEADLESS; cmd="ctest -L graphics (metal device contract; all skipped, no GPU session)"
          else lvl=UNAVAILABLE; cmd="ctest -L graphics (no tests matched)"; fi
          echo "job=${{ job.status }} metal graphics rc=$rc skipped=$skipped passed=$passed -> evidence_level=$lvl"
          cmake -DOUT=receipt.json -DPLATFORM=macos -DBACKEND=metal \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="$cmd" -DBUILD_CONFIG=Debug \
            -DGPU="$(system_profiler SPDisplaysDataType 2>/dev/null | grep -m1 Chipset | cut -d: -f2 | sed 's/^ *//' || echo unknown)" \
            -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-gpu-runtime-macos-metal
          path: receipt.json

  lane-gpu-runtime-windows-d3d12:
    # 计划 D 的真机 D3D12 GPU lane（brief :165）：self-hosted windows GPU
    # runner 接单，ENABLE_GPU_LANES=1 显式开启（同 lane-benchmark-steam-deck
    # 门控；hosted 上没有 self-hosted 标签可接单，不加 if 会永久 pending）。
    # hosted WARP 下限证据在 windows-d3d12.yml（gpu=WARP，不超 GPU_RUNTIME），
    # 不在本 workflow 重复；本 lane 只在真机接单且 graphics 全绿时标
    # GPU_RUNTIME，否则收据如实标 UNAVAILABLE。
    if: vars.ENABLE_GPU_LANES == '1'
    runs-on: [self-hosted, windows, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Agility SDK (pinned)
        run: cmake -P engine/tools/fetch_d3d12_agility_sdk.cmake

      - name: Add Windows SDK dxc to PATH
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { Write-Error "dxc.exe not found in the installed Windows SDKs"; exit 1 }
          Add-Content $env:GITHUB_PATH $dxc.Directory.FullName

      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DENGINE_RHI_BACKEND=d3d12

      - name: Build
        run: cmake --build build --parallel

      - name: D3D12 graphics suite (GPU-runtime evidence)
        id: d3d12_graphics
        continue-on-error: true
        shell: bash
        env:
          ENGINE_LOCKED_DEPS_ALLOW_ABSENT: 1
        run: |
          set +e
          out="$(ctest --test-dir build -L graphics --output-on-failure 2>&1)"
          rc=$?
          printf '%s\n' "$out"
          # '   Passed' 只锚定逐测试结果行（N/M Test #x: ...   Passed），
          # 不会误计小写 'tests passed' 汇总行；'***Skipped' 是
          # SKIP_RETURN_CODE 的 ctest 标记（不影响 rc）。
          skipped=$(printf '%s\n' "$out" | grep -c '\*\*\*Skipped' || true)
          passed=$(printf '%s\n' "$out" | grep -c '   Passed' || true)
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Emit evidence receipt
        if: always()
        shell: bash
        run: |
          rc="${{ steps.d3d12_graphics.outputs.rc }}"; skipped="${{ steps.d3d12_graphics.outputs.skipped }}"; passed="${{ steps.d3d12_graphics.outputs.passed }}"
          : "${rc:=1}"; : "${skipped:=1}"; : "${passed:=0}"
          if [ "${{ job.status }}" != "success" ]; then lvl=UNAVAILABLE
          elif [ "$rc" = "0" ] && [ "$skipped" = "0" ] && [ "$passed" -gt 0 ]; then lvl=GPU_RUNTIME
          else lvl=UNAVAILABLE; fi
          echo "job=${{ job.status }} d3d12 graphics rc=$rc skipped=$skipped passed=$passed -> evidence_level=$lvl"
          cmake -DOUT=receipt.json -DPLATFORM=windows -DBACKEND=d3d12 \
            -DEVIDENCE_LEVEL="$lvl" -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="ctest -L graphics (ENGINE_RHI_BACKEND=d3d12)" -DBUILD_CONFIG=Release \
            -DGPU=unknown -DDRIVER_VERSION=unknown -DCPU="$(uname -m)" -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-gpu-runtime-windows-d3d12
          path: receipt.json

  lane-gpu-runtime-windows-d3d12-unavailable:
    # brief :165：hosted 无 GPU 接单时如实出 UNAVAILABLE 收据。真机 lane 由
    # ENABLE_GPU_LANES 门控；变量未置值时由本常开孪生 job 出「不可得」收据
    #（<1 min，ubuntu 即可——只跑 cmake 脚本）；artifact 名与真机 lane 互斥共用。
    if: vars.ENABLE_GPU_LANES != '1'
    name: "lane: GPU-runtime (windows d3d12, unavailable receipt)"
    # R680: pinned like every other Linux lane -- ubuntu-latest moves to
    # Ubuntu 26 from 2026-10-19 (runner-images#14748).
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Emit UNAVAILABLE receipt
        run: |
          cmake -DOUT=receipt.json -DPLATFORM=windows -DBACKEND=d3d12 \
            -DEVIDENCE_LEVEL=UNAVAILABLE -DRUNNER="$RUNNER_NAME" \
            -DCOMMAND_STR="no self-hosted windows GPU runner accepted (ENABLE_GPU_LANES unset; hosted WARP floor in windows-d3d12.yml)" \
            -DBUILD_CONFIG=Release \
            -DGPU=none -DDRIVER_VERSION=none -DCPU=none -DRAM=unknown \
            -P engine/tools/make_evidence_receipt.cmake
          cmake -DRECEIPT=receipt.json -P engine/tests/test_evidence_receipt_schema.cmake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-receipt-gpu-runtime-windows-d3d12
          path: receipt.json

